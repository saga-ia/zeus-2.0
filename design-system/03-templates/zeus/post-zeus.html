<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Modelo de post no Design ZEUS roxo + magenta (1080 x 1350). Guia: /opt/jeff-worker/docs/design-system-zeus.md
     Troque só os textos marcados; mantenha cores, degradês, fontes, raios e estrutura. -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{--roxo:#673DE6;--roxo-bg:rgba(103,61,230,0.10);--magenta:#BE185D;--ink:#17171A;--mute:#66666F;--ok:#0F7A68;--ok-bg:rgba(15,122,104,0.10);
    --aurora:radial-gradient(1100px 650px at 8% -5%,rgba(139,108,240,0.36),transparent 60%),radial-gradient(900px 600px at 98% 8%,rgba(236,72,153,0.26),transparent 60%),radial-gradient(900px 700px at 75% 105%,rgba(249,168,212,0.32),transparent 60%),#F1E8F8;
    --card:linear-gradient(155deg,rgba(255,255,255,0.95) 0%,rgba(252,243,250,0.88) 45%,rgba(242,229,250,0.82) 100%);
    --faixa:linear-gradient(120deg,#230C3F 0%,#4B26C2 50%,#7C5CF0 100%);
    --brilho:radial-gradient(circle,rgba(249,168,212,0.55) 0%,rgba(236,72,153,0.28) 38%,transparent 70%)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1350px;overflow:hidden;background:var(--aurora);font-family:'DM Sans',sans-serif;color:var(--ink)}
  .pag{height:100%;padding:56px;display:flex;flex-direction:column}
  .faixa{position:relative;overflow:hidden;border-radius:44px;background:var(--faixa);padding:56px 60px 64px;color:#FFFFFF;box-shadow:0 36px 88px rgba(52,26,134,0.28)}
  .faixa::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.22) 2px,transparent 2.6px);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse at 90% 0%,#000 0%,transparent 65%);mask-image:radial-gradient(ellipse at 90% 0%,#000 0%,transparent 65%)}
  .faixa::after{content:"";position:absolute;right:-160px;top:-240px;width:840px;height:840px;border-radius:50%;background:var(--brilho)}
  .topo,.eyebrow,h1{position:relative;z-index:1}
  .topo{display:flex;align-items:center;gap:18px}
  .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(140deg,#8B6CF0,#673DE6);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(139,108,240,0.55)}
  .marca{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;letter-spacing:.14em}
  .eyebrow{margin-top:70px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:25px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,0.78)}
  .eyebrow i{width:12px;height:12px;border-radius:4px;background:#EC4899}
  h1{margin-top:20px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:84px;line-height:1.04;letter-spacing:-0.015em}
  h1 em{font-style:normal;color:#F9A8D4}
  .cards{margin-top:44px;display:flex;flex-direction:column;gap:18px}
  .card{background:var(--card);border:2px solid rgba(103,61,230,0.13);border-radius:30px;padding:30px 34px;display:flex;align-items:center;gap:26px;box-shadow:0 10px 26px rgba(52,26,134,0.06)}
  .ico{width:72px;height:72px;flex:0 0 72px;border-radius:20px;background:var(--roxo-bg);display:flex;align-items:center;justify-content:center;color:var(--roxo)}
  .card b{display:block;font-size:32px;font-weight:700}
  .rodape{margin-top:auto;display:flex;align-items:center}
  .selo{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:40px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:23px}
  .selo i{width:14px;height:14px;border-radius:50%;background:var(--ok)}
</style></head>
<body><div class="pag">
  <div class="faixa">
    <div class="topo">
      <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></div>
      <div class="marca">ZEUS</div>
    </div>
    <div class="eyebrow"><i></i>Rotinas do ZEUS</div><!-- TEXTO: rótulo curto -->
    <h1>Seu relatório chega <em>sozinho</em>, todo dia às 18h.</h1><!-- TEXTO: título, destaque em <em> -->
  </div>
  <div class="cards">
    <div class="card"><div class="ico"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div><b>No horário que você marcar</b></div></div>
    <div class="card"><div class="ico"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20v-6M12 20V8M18 20v-9"/></svg></div><div><b>Com dados reais das suas contas</b></div></div>
    <div class="card"><div class="ico" style="background:rgba(190,24,93,0.09);color:#BE185D"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5l1.3-4A8.5 8.5 0 1 1 8 19.6z"/></svg></div><div><b>No WhatsApp, chat ou e-mail</b></div></div>
  </div>
  <div class="rodape"><span class="selo"><i></i>Ativo na Central</span></div><!-- TEXTO: selo de status -->
</div></body></html>
