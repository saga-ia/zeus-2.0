<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeus — Espelho WhatsApp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #111b21;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    background: #202c33;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid #2a3942;
    flex-shrink: 0;
  }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00a884, #005c4b);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff; font-weight: 700;
    flex-shrink: 0;
  }
  .header-info { flex: 1; }
  .header-name {
    color: #e9edef;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.2;
  }
  .header-sub {
    color: #8696a0;
    font-size: 13px;
    margin-top: 2px;
  }
  .live-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #00a884;
    flex-shrink: 0;
    animation: pulse 2s infinite;
  }
  .live-label {
    color: #00a884;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Chat area */
  .chat-wrapper {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  .chat-bg {
    position: absolute; inset: 0;
    background-color: #0b141a;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23182229' fill-opacity='0.6'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .chat-scroll {
    position: absolute; inset: 0;
    overflow-y: auto;
    padding: 16px 20px;
    scroll-behavior: smooth;
  }
  .chat-scroll::-webkit-scrollbar { width: 6px; }
  .chat-scroll::-webkit-scrollbar-track { background: transparent; }
  .chat-scroll::-webkit-scrollbar-thumb { background: #374045; border-radius: 3px; }

  /* Date divider */
  .date-divider {
    text-align: center;
    margin: 10px 0 8px;
    position: relative;
  }
  .date-divider span {
    background: #182229;
    color: #8696a0;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 8px;
  }

  /* Bubble */
  .msg-row {
    display: flex;
    margin-bottom: 3px;
  }
  .msg-row.sent { justify-content: flex-end; }
  .msg-row.received { justify-content: flex-start; }
  .msg-row.new-group { margin-top: 10px; }

  .bubble {
    max-width: 72%;
    padding: 8px 12px 6px;
    border-radius: 8px;
    position: relative;
    word-break: break-word;
  }
  .sent .bubble {
    background: #005c4b;
    border-bottom-right-radius: 2px;
  }
  .received .bubble {
    background: #202c33;
    border-bottom-left-radius: 2px;
  }

  /* Tail */
  .sent.new-group .bubble::after {
    content: '';
    position: absolute;
    bottom: 0; right: -8px;
    width: 0; height: 0;
    border: 8px solid transparent;
    border-bottom-color: #005c4b;
    border-right: 0;
    border-top: 0;
  }
  .received.new-group .bubble::after {
    content: '';
    position: absolute;
    bottom: 0; left: -8px;
    width: 0; height: 0;
    border: 8px solid transparent;
    border-bottom-color: #202c33;
    border-left: 0;
    border-top: 0;
  }

  .msg-text {
    color: #e9edef;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg-meta {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
  }
  .msg-time {
    color: #8696a0;
    font-size: 11px;
  }
  .msg-check {
    color: #53bdeb;
    font-size: 13px;
  }

  /* Voice message */
  .voice-msg {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 200px;
  }
  .voice-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #00a884;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .voice-icon svg { fill: white; width: 18px; height: 18px; }
  .voice-content { flex: 1; }
  .voice-wave {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 24px;
    margin-bottom: 4px;
  }
  .voice-wave span {
    width: 3px;
    background: #8696a0;
    border-radius: 2px;
    animation: none;
  }
  .voice-transcription {
    color: #8696a0;
    font-size: 12px;
    font-style: italic;
    margin-top: 4px;
    line-height: 1.4;
  }
  .voice-transcription.full {
    color: #e9edef;
    font-style: normal;
    font-size: 14px;
  }

  /* Media placeholder */
  .media-placeholder {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #8696a0;
    font-size: 13px;
  }
  .media-placeholder svg { fill: #8696a0; width: 20px; height: 20px; }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #8696a0;
    text-align: center;
    padding: 40px;
  }
  .empty-state .icon { font-size: 60px; margin-bottom: 16px; opacity: 0.4; }
  .empty-state p { font-size: 16px; }

  /* Loading */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #8696a0;
    font-size: 14px;
    gap: 8px;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid #374045;
    border-top-color: #00a884;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Footer */
  .footer {
    background: #202c33;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #2a3942;
    flex-shrink: 0;
  }
  .footer-info { color: #8696a0; font-size: 12px; }
  .footer-status {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 10px;
  }
  .footer-status.online { color: #00a884; background: #00a8841a; }
  .footer-status.offline { color: #f15c6d; background: #f15c6d1a; }
</style>
</head>
<body>

<div class="header">
  <div class="avatar">Z</div>
  <div class="header-info">
    <div class="header-name">Zeus</div>
    <div class="header-sub" id="header-sub">Carregando...</div>
  </div>
  <div class="live-label">AO VIVO</div>
  <div class="live-dot"></div>
</div>

<div class="chat-wrapper">
  <div class="chat-bg"></div>
  <div class="chat-scroll" id="chat">
    <div class="loading"><div class="spinner"></div> Carregando mensagens...</div>
  </div>
</div>

<div class="footer">
  <div class="footer-info" id="footer-count"></div>
  <div class="footer-status online" id="conn-status">Conectado</div>
</div>

<script>
const JEFF_NAME = 'Jeff';
const ZEUS_NAME = 'Zeus';

let messages = [];
let lastRenderCount = 0;

function formatTime(ts) {
  const d = new Date(ts + ' -03:00');
  return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function formatDate(ts) {
  const d = new Date(ts + ' -03:00');
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);

  if (d.toDateString() === today.toDateString()) return 'Hoje';
  if (d.toDateString() === yesterday.toDateString()) return 'Ontem';
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
}

function waveBar(i) {
  const heights = [6,10,14,10,18,12,8,16,10,14,8,12,16,10,6,14,10,8,12,16];
  return `<span style="height:${heights[i % heights.length]}px"></span>`;
}

function renderVoice(msg) {
  const hasTranscription = msg.transcription && msg.transcription_status === 'ok';
  const text = hasTranscription ? msg.transcription : (msg.content || '');

  const waves = Array.from({length: 20}, (_, i) => waveBar(i)).join('');

  if (hasTranscription) {
    return `
      <div class="voice-msg">
        <div class="voice-icon">
          <svg viewBox="0 0 24 24"><path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </div>
        <div class="voice-content">
          <div class="voice-wave">${waves}</div>
          <div class="msg-text">${escHtml(text)}</div>
        </div>
      </div>`;
  }

  return `
    <div class="voice-msg">
      <div class="voice-icon">
        <svg viewBox="0 0 24 24"><path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </div>
      <div class="voice-content">
        <div class="voice-wave">${waves}</div>
        <div class="voice-transcription">Audio</div>
      </div>
    </div>`;
}

function renderMedia(type) {
  const icons = {
    image: '<svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>',
    video: '<svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>',
    document: '<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>',
  };
  const labels = { image: 'Imagem', video: 'Video', document: 'Documento' };
  const icon = icons[type] || icons.document;
  const label = labels[type] || type;
  return `<div class="media-placeholder">${icon} <span>${label}</span></div>`;
}

function escHtml(t) {
  return (t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function renderMessages(msgs) {
  if (!msgs || msgs.length === 0) {
    return '<div class="empty-state"><div class="icon">💬</div><p>Nenhuma mensagem ainda.</p></div>';
  }

  let html = '';
  let lastDate = '';
  let lastSender = null;

  msgs.forEach((msg, i) => {
    const isSent = msg.from_me === 1;
    const side = isSent ? 'sent' : 'received';
    const curDate = formatDate(msg.ts_brt);
    const newGroup = lastSender !== (isSent ? 'sent' : 'recv');
    lastSender = isSent ? 'sent' : 'recv';

    if (curDate !== lastDate) {
      html += `<div class="date-divider"><span>${curDate}</span></div>`;
      lastDate = curDate;
    }

    let content = '';
    if (msg.type === 'ptt' || msg.type === 'audio') {
      content = renderVoice(msg);
    } else if (msg.type === 'image' || msg.type === 'video' || msg.type === 'document') {
      const text = msg.content ? `${renderMedia(msg.type)}<div class="msg-text" style="margin-top:6px">${escHtml(msg.content)}</div>` : renderMedia(msg.type);
      content = text;
    } else {
      content = `<div class="msg-text">${escHtml(msg.content)}</div>`;
    }

    const check = isSent ? '<span class="msg-check">✓✓</span>' : '';

    html += `
      <div class="msg-row ${side}${newGroup ? ' new-group' : ''}">
        <div class="bubble">
          ${content}
          <div class="msg-meta">
            <span class="msg-time">${formatTime(msg.ts_brt)}</span>
            ${check}
          </div>
        </div>
      </div>`;
  });

  return html;
}

async function loadMessages(scroll = true) {
  try {
    const r = await fetch('/api/messages?limit=60');
    if (!r.ok) throw new Error(r.statusText);
    messages = await r.json();

    const chat = document.getElementById('chat');
    const wasAtBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;

    chat.innerHTML = renderMessages(messages);

    if (scroll || wasAtBottom) {
      chat.scrollTop = chat.scrollHeight;
    }

    const count = messages.length;
    document.getElementById('footer-count').textContent = `${count} mensagem${count !== 1 ? 's' : ''}`;
    document.getElementById('header-sub').textContent = `${count} mensagens recentes`;
  } catch (e) {
    console.error('load error:', e);
  }
}

function setupSSE() {
  const es = new EventSource('/api/stream');
  const statusEl = document.getElementById('conn-status');

  es.onopen = () => {
    statusEl.textContent = 'Conectado';
    statusEl.className = 'footer-status online';
  };

  es.onmessage = (e) => {
    if (e.data === 'refresh') loadMessages(false);
  };

  es.onerror = () => {
    statusEl.textContent = 'Reconectando...';
    statusEl.className = 'footer-status offline';
  };
}

// Init
loadMessages(true);
setupSSE();
</script>
</body>
</html>
