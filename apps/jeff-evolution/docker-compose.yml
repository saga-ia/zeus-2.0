services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: jeff-evolution-api
    restart: unless-stopped
    environment:
      - SERVER_URL=https://evolution.jefersonhenrike.com
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${POSTGRES_PASSWORD}@evolution-postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      - DEL_INSTANCE=false
      - LOG_LEVEL=ERROR,WARN,INFO,LOG,VERBOSE,DEBUG,WEBHOOKS
      - LOG_COLOR=false
      - LOG_BAILEYS=warn
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1027004616
      - QRCODE_LIMIT=30
      - TZ=America/Sao_Paulo
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-postgres
      - evolution-redis
    networks:
      - jeff-evolution
      - labastia

  evolution-postgres:
    image: postgres:15-alpine
    container_name: jeff-evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=evolution
      - TZ=America/Sao_Paulo
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    networks:
      - jeff-evolution

  evolution-redis:
    image: redis:7-alpine
    container_name: jeff-evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - jeff-evolution

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:

networks:
  jeff-evolution:
    driver: bridge
  labastia:
    external: true
    name: labastia-setup_labastia
