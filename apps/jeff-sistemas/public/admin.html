<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Sistemas — Admin</title>
<link rel="stylesheet" href="/_styles.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span> ALPHA SISTEMAS · ADMIN</div>
    <div class="right">
      <a class="btn-link" href="/">dashboard</a>
      <button class="btn-link" id="logout">sair</button>
    </div>
  </header>
  <main class="dash">
    <h1>Painel Admin</h1>
    <p class="sub">Aprovação de cadastros e gestão dos cards do dashboard.</p>

    <div class="section-title">Cadastros</div>
    <table class="table" id="usersTable">
      <thead><tr><th>Nome</th><th>Email</th><th>Telefone</th><th>Status</th><th>Criado</th><th></th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table>

    <div class="section-title" style="margin-top:40px">Sistemas (cards do dashboard)</div>
    <table class="table" id="sysTable">
      <thead><tr><th>Ícone</th><th>Nome</th><th>URL</th><th>Ordem</th><th>Ativo</th><th></th></tr></thead>
      <tbody id="sysBody"></tbody>
    </table>
    <div style="margin-top:16px">
      <button class="btn-secondary" id="newSys">+ adicionar sistema</button>
    </div>
  </main>
</div>
<script>
document.getElementById('logout').onclick = async () => {
  await fetch('/api/logout', { method:'POST' });
  location.href = '/login';
};

async function loadUsers() {
  const { users } = await (await fetch('/api/admin/users')).json();
  const body = document.getElementById('usersBody');
  if (!users.length) { body.innerHTML = '<tr><td colspan="6" class="empty">nenhum cadastro ainda</td></tr>'; return; }
  body.innerHTML = users.map(u => {
    const badge = u.status === 'approved'
      ? '<span class="badge badge-approved">aprovado</span>'
      : u.status === 'denied'
        ? '<span class="badge badge-denied">recusado</span>'
        : '<span class="badge badge-pending">pendente</span>';
    const role = u.role === 'admin' ? ' <span class="badge badge-admin">admin</span>' : '';
    const actions = u.status === 'pending'
      ? `<div class="row-actions"><button class="btn-secondary" data-act="approve" data-id="${u.id}">aprovar</button><button class="btn-danger" data-act="deny" data-id="${u.id}">recusar</button></div>`
      : (u.status === 'approved' && u.role !== 'admin'
          ? `<div class="row-actions"><button class="btn-danger" data-act="deny" data-id="${u.id}">revogar</button></div>`
          : '');
    return `<tr><td>${u.name}${role}</td><td>${u.email}</td><td>${u.phone || '—'}</td><td>${badge}</td><td>${u.created_at.slice(0,16).replace('T',' ')}</td><td>${actions}</td></tr>`;
  }).join('');
}

async function loadSystems() {
  const { systems } = await (await fetch('/api/admin/systems')).json();
  const body = document.getElementById('sysBody');
  if (!systems.length) { body.innerHTML = '<tr><td colspan="6" class="empty">nenhum sistema</td></tr>'; return; }
  body.innerHTML = systems.map(s => `
    <tr>
      <td><span style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;background:${s.color}1f;color:${s.color};font-weight:800">${s.icon}</span></td>
      <td>${s.name}<br><span style="color:var(--muted);font-size:12px">${s.description||''}</span></td>
      <td><a href="${s.url}" target="_blank" rel="noopener" style="font-size:13px">${s.url}</a></td>
      <td>${s.sort_order}</td>
      <td>${s.active ? '<span class="badge badge-approved">on</span>' : '<span class="badge badge-denied">off</span>'}</td>
      <td><div class="row-actions"><button class="btn-danger" data-syscat="del" data-id="${s.id}">remover</button></div></td>
    </tr>
  `).join('');
}

document.addEventListener('click', async (e) => {
  const t = e.target;
  if (t.matches('[data-act]')) {
    const id = t.dataset.id, act = t.dataset.act;
    if (act === 'deny' && !confirm('Recusar/revogar acesso?')) return;
    await fetch(`/api/admin/users/${id}/${act}`, { method: 'POST' });
    loadUsers();
  }
  if (t.matches('[data-syscat="del"]')) {
    if (!confirm('Remover este sistema?')) return;
    await fetch(`/api/admin/systems/${t.dataset.id}`, { method: 'DELETE' });
    loadSystems();
  }
});

document.getElementById('newSys').onclick = async () => {
  const slug = prompt('slug (ex: meu-app):'); if (!slug) return;
  const name = prompt('nome:'); if (!name) return;
  const url = prompt('URL:'); if (!url) return;
  const icon = prompt('ícone (1-3 chars/emoji):') || '◆';
  const description = prompt('descrição (opcional):') || '';
  const color = prompt('cor accent (#hex):', '#C4FF0E') || '#C4FF0E';
  const r = await fetch('/api/admin/systems', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ slug, name, url, icon, description, color }) });
  const d = await r.json();
  if (!r.ok) return alert(d.error || 'erro');
  loadSystems();
};

loadUsers(); loadSystems();
setInterval(loadUsers, 20000);
</script>
</body>
</html>
