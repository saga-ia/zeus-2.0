<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Vídeo IA</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
</head>
<body class="pg-login">
<form class="login" id="f">
  <div class="marca"><span class="logo">Z</span> Vídeo IA</div>
  <p>Entre com o mesmo e-mail e senha da Central.</p>
  <label>E-mail<input name="email" type="email" autocomplete="username" required autofocus></label>
  <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
  <div class="aviso erro" id="erro" hidden></div>
  <button class="btn prim largo" type="submit">Entrar</button>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target)), erro = document.getElementById('erro');
  erro.hidden = true;
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) });
  if (r.ok) return location.href = '/';
  const j = await r.json().catch(() => ({})); erro.textContent = j.erro || 'Não deu pra entrar.'; erro.hidden = false;
});
</script>
</body>
</html>
