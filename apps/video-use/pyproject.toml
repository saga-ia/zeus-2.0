[project]
name = "video-use"
version = "0.1.0"
description = "Conversation-driven video editor skill for Claude Code (Forge fork: local transcription + Windows fixes)"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
    # Local transcription engine (replaces ElevenLabs Scribe in this fork).
    # Ships the Silero VAD used by helpers/transcribe.py's silence pass.
    "faster-whisper",
]

[project.optional-dependencies]
animations = ["manim"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
