# Presenton (gerador de apresentações) usando o Claude Code do servidor via jeff-claude-shim.
# Preso em 127.0.0.1 e com teto de CPU/RAM para não disputar recurso com a produção.
services:
  presenton:
    image: ghcr.io/presenton/presenton:latest
    container_name: jeff-presenton
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:80"
    volumes:
      - ./app_data:/app_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM: custom
      CUSTOM_LLM_URL: http://host.docker.internal:8787/v1
      CUSTOM_LLM_API_KEY: ${CUSTOM_LLM_API_KEY}
      CUSTOM_MODEL: claude-code
      CAN_CHANGE_KEYS: "false"
      DISABLE_IMAGE_GENERATION: "true"
      DISABLE_ANONYMOUS_TRACKING: "true"
      PRESENTON_COMMUNITY_ENABLED: "false"
      MEM0_ENABLED: "false"
      WEB_GROUNDING: "false"
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
