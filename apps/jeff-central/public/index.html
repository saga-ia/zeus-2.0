<style>
  html,body{margin:0;padding:0;background:#F6F6F7;color:#17171A;font-family:'DM Sans',system-ui,sans-serif;font-size:14px}
  *{box-sizing:border-box}
  a{color:#A8620A;text-decoration:none}
  a:hover{color:#C2760A}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#D3D3D8;border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes zeusDrift{0%{transform:translate3d(0,0,0) scale(1);opacity:.45}50%{transform:translate3d(-10px,-12px,0) scale(1.015);opacity:.7}100%{transform:translate3d(8px,10px,0) scale(1);opacity:.5}}
  [data-hover]:hover{background:#F1F1F3}
  [data-agent-pop][hidden],[data-team-pop][hidden],[data-tf-group][hidden],[data-tf-agent][hidden]{display:none!important}

  #team-scroll > *{flex-shrink:0}

  .zl-track{display:flex;width:max-content;animation:zlScroll 32s linear infinite}
  .zl-marquee:hover .zl-track{animation-play-state:paused}
  .zl-item{flex:0 0 auto;width:62px;display:flex;justify-content:center;color:#3C3C44;opacity:.72;transition:opacity .2s,transform .2s,color .2s}
  .zl-item:hover{opacity:1;color:#A8620A;transform:translateY(-2px)}
  @keyframes zlScroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
  @media (prefers-reduced-motion: reduce){ .zl-track{animation:none} }
  [data-hover-border]:hover{border-color:#B4B4BC}
  [data-hover-dark]:hover{background:#8F5208}
  .app{display:flex;min-height:100vh;background:#F6F6F7}
  @media (max-width:1180px){ .ag-side{display:none !important} }
  @media (max-width:760px){ .ag-sess{display:none !important} }
  .rail-icon{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}

  /* ===== Animações (fluidez de botões, menus e troca de página) ===== */
  :root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.56,.64,1)}
  [data-hover],[data-hover-border],[data-hover-dark],[data-go],[data-toggle-widget],[style*="cursor:pointer"],.rail-icon,button,a,input,textarea,select{
    transition:background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .25s var(--ease-out),transform .25s var(--ease-out),opacity .2s ease}
  /* Com borda (cards, chips, botões secundários): sobe + sombra. !important porque a borda/sombra vêm inline */
  [data-hover-border]:hover,
  [style*="cursor:pointer"][style*="border:1px"]:not([data-hover]):not([data-hover-dark]):hover,
  [style*="cursor:pointer"][style*="border:1.5px"]:not([data-hover]):not([data-hover-dark]):hover{
    transform:translateY(-2px);box-shadow:0 8px 22px rgba(23,23,26,.10),0 2px 6px rgba(23,23,26,.05)!important}
  [data-hover-border]:not([style*="#A8620A"]):not([style*="168,98,10"]):hover,
  [style*="cursor:pointer"][style*="border:1px"]:not([data-hover]):not([data-hover-dark]):not([style*="#A8620A"]):not([style*="168,98,10"]):hover{border-color:#B4B4BC!important}
  /* Dourados (botão principal, bolinhas, FAB-like): sobe + sombra dourada */
  [data-hover-dark]:hover,
  [style*="cursor:pointer"][style*="background:#A8620A"]:hover,
  [style*="cursor:pointer"][style*="linear-gradient(140deg,#A8620A"]:not([data-toggle-widget]):hover{
    transform:translateY(-2px);box-shadow:0 10px 24px rgba(168,98,10,.34)!important}
  /* Sem borda e com cantos (abas, pílulas de período): leve realce de fundo sem brigar com o background inline */
  [style*="cursor:pointer"][style*="border-radius"]:not([style*="border:1"]):not([style*="#A8620A"]):not([data-hover]):not([data-hover-dark]):not([data-toggle-widget]):not(button):hover{
    box-shadow:inset 0 0 0 999px rgba(23,23,26,.05)}
  /* Itens com background:transparent inline (sidebar, históricos, menus): o inline ganhava do [data-hover]:hover */
  [data-hover][style*="background:transparent"]:hover{background-color:#F1F1F3!important}
  /* Sidebar: fundo suave, ícone desliza e fica dourado; item ativo escurece um pouco */
  aside [data-go][data-hover] svg{transition:transform .25s var(--ease-out),color .2s ease}
  aside [data-go][data-hover]:hover svg:first-child{transform:translateX(2px);color:#A8620A}
  aside [data-go][data-hover][style*="168,98,10"]:hover{background-color:rgba(168,98,10,.2)!important}
  [data-hover]:active,[data-hover-border]:active,[data-hover-dark]:active,[style*="cursor:pointer"]:active,.rail-icon:active,button:active{transform:scale(.97);transition-duration:.08s}
  [data-toggle-widget]:hover{transform:scale(1.07) rotate(-4deg);box-shadow:0 14px 32px rgba(168,98,10,.42)!important}
  [data-toggle-widget]:active{transform:scale(.94);transition-duration:.08s}
  button[type=submit]:not([disabled]):hover{transform:scale(1.08);box-shadow:0 6px 16px rgba(168,98,10,.35)}
  input:focus,textarea:focus{outline:none}

  /* Troca de página: wrapper faz fade, blocos internos sobem em cascata */
  @keyframes pgFade{from{opacity:0}to{opacity:1}}
  @keyframes pgRise{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
  .pg-in{animation:pgFade .35s ease backwards}
  .pg-in > *{animation:pgRise .55s var(--ease-out) backwards}
  .pg-in > *:nth-child(2){animation-delay:.05s}
  .pg-in > *:nth-child(3){animation-delay:.10s}
  .pg-in > *:nth-child(4){animation-delay:.15s}
  .pg-in > *:nth-child(5){animation-delay:.20s}
  .pg-in > *:nth-child(6){animation-delay:.25s}
  .pg-in > *:nth-child(n+7){animation-delay:.30s}

  /* Menus, widget e overlay */
  @keyframes popIn{from{opacity:0;transform:translate3d(0,-6px,0) scale(.97)}to{opacity:1;transform:none}}
  @keyframes popUp{from{opacity:0;transform:translate3d(0,8px,0) scale(.97)}to{opacity:1;transform:none}}
  @keyframes popSide{from{opacity:0;transform:translate3d(-6px,0,0) scale(.97)}to{opacity:1;transform:none}}
  @keyframes widgetIn{from{opacity:0;transform:translate3d(0,16px,0) scale(.94)}to{opacity:1;transform:none}}
  @keyframes cardIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.965)}to{opacity:1;transform:none}}

  .pop-up{animation:popUp .24s var(--ease-out) backwards;transform-origin:bottom center}
  .pop-side{animation:popSide .2s var(--ease-out) backwards;transform-origin:left bottom}
  .widget-in{animation:widgetIn .34s var(--ease-spring) backwards;transform-origin:bottom right}
  .ov-in{animation:pgFade .25s ease backwards}
  .ov-in > [data-chat-overlay-card]{animation:cardIn .42s var(--ease-out) .03s backwards}

"use strict";

const state = {
  screen: "home",
  collapsed: false,
  wsMenuOpen: false,
  userMenuOpen: false,
  themeMenuOpen: false,
  widgetOpen: false,
  toolsTab: "tools",
  chatOverlay: false,
  chatOverlayHist: false
};

function setState(patch){
  // Trocar de tela fecha o chat flutuante (a não ser que o próprio patch mande o contrário)
  if(patch.screen && patch.screen !== state.screen && state.chatOverlay && patch.chatOverlay === undefined){
    patch = Object.assign({}, patch, { chatOverlay: false });
    if(patch.screen !== "motorExec") chatCloseStream();
  }
  Object.assign(state, patch);
  if(patch.screen || patch.agentId !== undefined || patch.editAgentId !== undefined || patch.teamId !== undefined || patch.editTeamId !== undefined){
    const alvo = hashFor(state.screen);
    if(location.hash !== alvo){
      _skipHashSync = true;
      location.hash = alvo;
    }
  }
  render();
}
// Telas com parâmetro: #/agente/<id> (chat do agente) e #/criarAgente/<id> (editar agente)
function hashFor(s){
  if(s === "agente" && state.agentId) return "#/agente/" + state.agentId;
  if(s === "criarAgente" && state.editAgentId) return "#/criarAgente/" + state.editAgentId;
  if(s === "equipe" && state.teamId) return "#/equipe/" + state.teamId;
  if(s === "criarEquipe" && state.editTeamId) return "#/criarEquipe/" + state.editTeamId;
  return "#/" + s;
}
function paramFromHash(){
  const m = /^#\/[\w-]+\/([\w-]+)/.exec(location.hash || "");
  return m ? m[1] : null;
}
function hashPatch(){
  let s = screenFromHash();
  const p = paramFromHash();
  if(s === "equipe" && !p) s = "equipes"; // link antigo #/equipe sem id cai na lista
  return { screen: s, agentId: s === "agente" ? p : state.agentId, editAgentId: s === "criarAgente" ? p : null,
    teamId: s === "equipe" ? p : state.teamId, editTeamId: s === "criarEquipe" ? p : null };
}
function go(s){ return function(){ setState({ screen: s, wsMenuOpen:false, userMenuOpen:false, themeMenuOpen:false }); }; }
function toggle(k){ return function(e){ e && e.stopPropagation && e.stopPropagation(); const p={}; p[k]=!state[k]; setState(p); }; }

let _skipHashSync = false;
const VALID_SCREENS = ["home","gestao","agentes","criarAgente","catalogo","equipes","equipe","criarEquipe","habilidades","conhecimento","biblioteca","conectores","waConnector","ferramentas","swot","okrs","organograma","acoes","motores","motorVendas","motorExec","growthDash","chat","growthAgente","empresa","permissoes","agente"];
function screenFromHash(){
  const m = /^#\/([\w-]+)/.exec(location.hash || "");
  const s = m && m[1];
  return VALID_SCREENS.indexOf(s) >= 0 ? s : "home";
}
window.addEventListener("hashchange", () => {
  if(_skipHashSync){ _skipHashSync = false; return; }
  const hp = hashPatch();
  if(state.screen !== hp.screen || state.agentId !== hp.agentId || state.editAgentId !== hp.editAgentId || state.teamId !== hp.teamId || state.editTeamId !== hp.editTeamId){
    setState(Object.assign(hp, { wsMenuOpen:false, userMenuOpen:false, themeMenuOpen:false }));
  }
});

function e(v){ return String(v==null?"":v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function h(tag, attrs, children){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === "onClick") el.addEventListener("click", attrs[k]);
    else if(k === "style" && typeof attrs[k] === "object") Object.assign(el.style, attrs[k]);
    else if(k === "html") el.innerHTML = attrs[k];
    else if(attrs[k] != null) el.setAttribute(k, attrs[k]);
  }
  if(children != null){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null||c===false) return;
      el.appendChild(typeof c==="string"? document.createTextNode(c) : c);
    });
  }
  return el;
}

function icon(path, size, stroke, fill){
  size = size || 16; stroke = stroke || "currentColor"; fill = fill || "none";
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="${stroke}" stroke-width="1.7">${path}</svg>`;
}

function asciiArt(){
  const chars=[" "," ",".",".","+","+","=","=","#","%","@","@"];
  const rows=[];
  for(let y=0;y<66;y++){
    let line="";
    for(let x=0;x<260;x++){
      const dx=(x-30)/34, dy=(y-26)/16;
      const blob=1-Math.sqrt(dx*dx+dy*dy);
      const wave=0.2*Math.sin(x/7+y/4)+0.16*Math.sin(x/21-y/6)+0.1*Math.sin(x/41+y/11);
      const v=blob*0.9+wave+0.12;
      const noise=((x*7+y*13)%11)/40;
      const idx=Math.max(0,Math.min(chars.length-1,Math.round((v+noise)*(chars.length-1))));
      line += v<-0.18 ? (noise>0.1?".":" ") : chars[idx];
    }
    rows.push(line);
  }
  return rows.join("\n");
}

}

}

}
function teamStatusBadge(st){
  const s = TM_STATUS[st] || TM_STATUS.pending;

}

function teamMenuHTML(t){

    ${item("del", ICONS.trash, "Excluir equipe", "#C0341C")}
  </div>`;
}

function teamCardHTML(t){

  return `<div data-team-open="${id}" data-team-card data-hover-border style="position:relative;border:1px solid #E6E6EA;border-radius:14px;background:#FFFFFF;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer">

      ${teamVisTag(t)}
      <span data-team-kebab="${id}" data-hover title="Mais opções" style="width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#66666F;cursor:pointer;flex:0 0 auto">${icon(ICONS.ellip, 18, "currentColor")}</span>

      <span data-team-open="${id}" data-hover-dark style="flex:1;${AG_BTN};background:#A8620A;color:#FFFFFF;font-weight:700">${icon(ICONS.play, 13, "none", "currentColor")}Usar equipe</span>
      <span data-team-share="${id}" data-hover title="Copiar link da equipe" style="width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#66666F;cursor:pointer">${icon(ICONS.share, 15, "currentColor")}</span>

function renderEquipes(){

  const lim = teamLimits();
  const passo = (n, titulo, txt) => `<div style="flex:1;min-width:200px;display:flex;gap:12px">
    <span style="width:26px;height:26px;border-radius:8px;background:rgba(168,98,10,0.12);color:#A8620A;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto">${n}</span>
    <span><strong style="display:block;font-size:13px;margin-bottom:3px">${titulo}</strong><span style="font-size:12px;color:#66666F;line-height:1.5">${txt}</span></span>

  return `<div style="padding:34px 40px 60px;max-width:1240px">
    <div style="font-size:10.5px;letter-spacing:0.16em;color:#A8620A;font-weight:700;margin-bottom:8px">MEU WORKSPACE</div>
    <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:26px">

        <h1 style="font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:600;margin:0 0 6px">Equipes de agentes</h1>
        <p style="margin:0;color:#66666F;max-width:640px;line-height:1.55">Reúna de ${lim.min} a ${lim.max} agentes do seu workspace em torno de um objetivo. Um orquestrador coordena e entrega um resultado consolidado.</p>
      </div>
      <span data-team-new data-hover-dark style="display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;background:#A8620A;color:#FFFFFF;font-size:13px;font-weight:700;cursor:pointer">${icon(ICONS.plus, 14, "currentColor")}Criar equipe de agentes</span>

let _teamES = null, _teamsLoading = false, _teamForceScroll = false;
const _teamOpen = new Set(); // passos de agente expandidos manualmente

function teamPlanOf(step){ try { return JSON.parse(step.content || "{}"); } catch(err){ return {}; } }

function teamStepHTML(t, s, tr){
  const bubbleOrq = (html) => `<div style="display:flex;gap:10px;align-items:flex-start">
    <span style="width:30px;height:30px;border-radius:9px;background:rgba(168,98,10,0.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto">${icon(ICONS.users, 15, "#A8620A")}</span>
    <div style="flex:1;min-width:0">${html}</div></div>`;

  if(s.kind === "user"){
    return `<div style="display:flex;justify-content:flex-end"><div style="max-width:78%;padding:12px 16px;border-radius:14px 14px 4px 14px;background:rgba(168,98,10,0.12);border:1px solid rgba(168,98,10,0.24);font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word">${e(s.content)}</div></div>`;
  }
  if(s.kind === "plan"){
    if(s.status === "running"){
      return bubbleOrq(`<div style="padding:12px 16px;border:1px solid #E6E6EA;border-radius:12px;background:#FFFFFF;font-size:13px;color:#66666F;display:inline-flex;align-items:center;gap:9px"><span class="tm-pulse" style="width:7px;height:7px;border-radius:50%;background:#A8620A"></span>Orquestrador analisando o pedido e montando o plano...</div>`);
    }
    const p = teamPlanOf(s);
    if(p.modo !== "executar" || !p.tarefas) return "";
    const nomes = {}; (t.agents || []).forEach(a => nomes[a.id] = a.name);
    const etapas = {}; p.tarefas.forEach(x => (etapas[x.etapa] = etapas[x.etapa] || []).push(x));
    const ks = Object.keys(etapas).sort((a, b) => a - b);
    return bubbleOrq(`<div style="border:1px solid #E6E6EA;border-radius:12px;background:#FFFFFF;padding:14px 16px">
      <div style="${TM_EYEBROW};margin-bottom:7px">PLANO DO ORQUESTRADOR</div>
      ${p.resumo ? `<p style="margin:0 0 12px;font-size:13px;line-height:1.55">${e(p.resumo)}</p>` : ""}
      <div style="display:flex;flex-direction:column;gap:8px">
        ${ks.map(k => `<div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
          <span style="font-size:11px;font-weight:700;color:#A8620A;padding-top:5px;min-width:64px">ETAPA ${k}</span>
          <span style="display:flex;flex-wrap:wrap;gap:6px;flex:1">${etapas[k].map(x => `<span style="padding:4px 10px;border:1px solid #DADADF;border-radius:20px;font-size:11.5px;color:#3C3C44">${e(nomes[x.agente] || x.agente)}</span>`).join("")}</span>
          ${etapas[k].length > 1 ? `<span style="font-size:11px;color:#66666F;padding-top:5px">em paralelo</span>` : ""}
        </div>`).join("")}
      </div>
    </div>`);
  }
  if(s.kind === "agent"){
    const ag = (t.agents || []).find(a => a.id === s.agentId);
    const aberto = s.status === "running" || _teamOpen.has(s.id);
    const temConteudo = !!(s.content && s.content.trim());
    return `<div style="margin-left:40px;border:1px solid ${s.status === "running" ? "rgba(168,98,10,0.4)" : "#E6E6EA"};border-radius:12px;background:#FFFFFF;overflow:hidden">
      <div data-ts-toggle="${e(s.id)}" style="display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:${temConteudo ? "pointer" : "default"}">
        <span style="${TM_AVATAR};border:0">${e(ag ? ag.initials : "?")}</span>
        <span style="flex:1;min-width:0">
          <span style="display:flex;align-items:center;gap:8px"><strong style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e(s.agentName)}</strong><span style="font-size:11px;color:#9A9AA3;white-space:nowrap">Etapa ${e(s.stage)}</span></span>
          <span style="display:block;font-size:12px;color:#66666F;margin-top:2px;${aberto ? "" : "white-space:nowrap;overflow:hidden;text-overflow:ellipsis"}">${e(s.task)}</span>
        </span>
        ${teamStatusBadge(s.status)}
        ${temConteudo && s.status !== "running" ? `<span style="display:flex;color:#9A9AA3">${icon(aberto ? ICONS.chevUp : ICONS.chevDown, 14, "currentColor")}</span>` : ""}
      </div>
      ${aberto ? `<div style="border-top:1px solid #EFEFF1;padding:13px 18px;font-size:13px;line-height:1.65;word-wrap:break-word;background:#FCFCFD">${temConteudo ? mdToHtml(s.content) : '<span style="color:#66666F">Trabalhando ▍</span>'}</div>` : ""}
    </div>`;
  }
  if(s.kind === "final"){
    if(s.task === "perguntar" || s.task === "responder"){
      return bubbleOrq(`<div style="padding:14px 18px;border-radius:4px 14px 14px 14px;background:#FFFFFF;border:1px solid #E6E6EA;font-size:13.5px;line-height:1.65;word-wrap:break-word">${mdToHtml(s.content)}</div>`);
    }
    const vazio = !(s.content && s.content.trim());
    return `<div style="border:1px solid rgba(168,98,10,0.35);border-radius:14px;background:#FFFFFF;overflow:hidden;box-shadow:0 8px 24px rgba(23,23,26,0.05)">
      <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(168,98,10,0.06);border-bottom:1px solid rgba(168,98,10,0.18)">
        ${icon(ICONS.check, 15, "#A8620A")}
        <strong style="font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;flex:1">Entrega consolidada</strong>
        ${s.status === "done" ? `<span data-ts-copy="${e(s.id)}" data-hover style="display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:12px;color:#3C3C44;cursor:pointer">${icon(ICONS.copy, 13, "currentColor")}<span>Copiar</span></span>` : teamStatusBadge(s.status)}
      </div>
      <div style="padding:16px 20px;font-size:13.5px;line-height:1.7;word-wrap:break-word">${vazio ? '<span style="color:#66666F">Orquestrador consolidando as entregas ▍</span>' : mdToHtml(s.content)}</div>
    </div>`;
  }
  if(s.kind === "error"){
    return bubbleOrq(`<div style="padding:12px 16px;border:1px solid rgba(192,52,28,0.3);border-radius:12px;background:rgba(192,52,28,0.05);font-size:13px;color:#8A2512;line-height:1.55">${icon(ICONS.warn, 13, "#C0341C")} ${e(s.content)}</div>`);
  }
  return "";
}

function teamTimelineHTML(t, tr){
  const steps = tr.steps || [];
  if(tr._loadingRun) return `<div style="margin:auto;color:#66666F;font-size:13px">Carregando execução...</div>`;
  if(!steps.length){
    return `<div style="margin:auto;width:100%;max-width:640px;text-align:center;padding:20px 0">
      <div style="font-size:12.5px;color:#66666F;margin-bottom:8px">Orquestrador da equipe</div>
      <h2 style="font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;margin:0 0 10px">${e(t.name)}</h2>
      ${t.objective ? `<p style="margin:0 auto 18px;max-width:520px;color:#66666F;font-size:13.5px;line-height:1.6">${e(t.objective)}</p>` : ""}
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-bottom:24px">
        ${t.agents.map(a => `<span style="display:flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid #DADADF;border-radius:20px;font-size:12px;color:#3C3C44;background:#FFFFFF">${icon(ICONS.briefcase, 11, "#A8620A")}${e(a.name)}</span>`).join("")}
      </div>
      ${(t.icebreakers || []).length ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">
        ${t.icebreakers.map(q => `<div data-tr-ice="${e(q)}" data-hover-border style="border:1px solid #E6E6EA;border-radius:11px;background:#FFFFFF;padding:13px 15px;font-size:12.5px;color:#3C3C44;line-height:1.5;cursor:pointer;text-align:left">${e(q)}</div>`).join("")}
      </div>` : `<p style="font-size:12.5px;color:#9A9AA3">Descreva abaixo o que a equipe deve entregar.</p>`}
    </div>`;
  }
  return steps.map(s => teamStepHTML(t, s, tr)).join("");
}

function teamRunsHTML(tr){
  const runs = tr.runs || [];
  if(!runs.length) return `<div style="font-size:12px;color:#66666F;padding:9px 12px;line-height:1.5">As execuções desta equipe ficam salvas aqui.</div>`;
  return runs.map(r => {
    const on = r.id === tr.rid;
    return `<div data-tr-open="${e(r.id)}" data-hover style="display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;background:${on ? "rgba(168,98,10,0.12)" : "transparent"};color:${on ? "#A8620A" : "#3C3C44"};font-weight:${on ? "600" : "500"}">
      ${r.status === "running" ? `<span class="tm-pulse" style="width:7px;height:7px;border-radius:50%;background:#A8620A;flex:0 0 auto"></span>` : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${ICONS.chatBubble}</svg>`}
      <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e(r.title || "Nova execução")}</span>
      <span data-tr-del="${e(r.id)}" title="Excluir" style="opacity:.5;cursor:pointer;display:flex">${icon(ICONS.x, 12, "currentColor")}</span>
    </div>`;
  }).join("");
}

function teamActionsHTML(tr){
  if(tr.running){
    return `<span data-tr-stop data-hover-border title="Parar a execução" style="display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid #DADADF;border-radius:20px;font-size:12px;color:#C0341C;cursor:pointer;background:#FFFFFF"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>Parar</span>`;
  }
  return `<button id="team-send" type="submit" title="Enviar" style="width:32px;height:32px;border-radius:50%;background:#A8620A;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;padding:0">${icon(ICONS.arrowUp, 16, "#FFFFFF")}</button>`;
}
function teamStatusHTML(tr){
  const r = !!tr.running;
  return `<span style="width:6px;height:6px;border-radius:50%;background:currentColor" class="${r ? "tm-pulse" : ""}"></span>${r ? "Equipe trabalhando..." : "Pronta"}`;
}

// Faixa animada com os modelos e ferramentas que o ZEUS usa (lista duplicada pra rolagem contínua)
function zeusLogoMarquee(){
  const item = l => `<span class="zl-item" title="${e(l[0])}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-label="${e(l[0])}"><path d="${l[1]}"/></svg></span>`;
  const faixa = ZEUS_LOGOS.map(item).join("");
  return `<div class="zl-marquee" aria-label="Modelos e ferramentas: ${e(ZEUS_LOGOS.map(l => l[0]).join(", "))}"><div class="zl-track">${faixa}${faixa}</div></div>`;
}

// Elenco no topo do cartão: chips com o status de cada agente na rodada atual
function teamElencoHTML(t, tr){
  const steps = tr.steps || [];
  const ultimo = steps.length ? steps[steps.length - 1].turn : 0;
  const doTurno = steps.filter(s => s.turn === ultimo && s.kind === "agent");
  return t.agents.map(a => {
    const st = doTurno.find(s => s.agentId === a.id);
    const cor = st ? (TM_STATUS[st.status] || TM_STATUS.pending)[1] : null;
    return `<span title="${e(st ? a.name + " · " + (TM_STATUS[st.status] || TM_STATUS.pending)[0] : a.name)}" style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;background:${st && st.status === "running" ? "rgba(168,98,10,0.10)" : "#F4F4F6"};font-size:11.5px;color:#3C3C44;white-space:nowrap">
      ${st ? `<span class="${st.status === "running" ? "tm-pulse" : ""}" style="width:6px;height:6px;border-radius:50%;background:${cor}"></span>` : icon(ICONS.agentes, 12, "#A8620A")}${e(a.name)}</span>`;
  }).join("");
}

function teamComposerHTML(t, tr, hero){
  const temVoz = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  return `<form data-team-form style="margin:0;width:100%;max-width:${hero ? "660px" : "860px"}">
    <div style="border:1px solid #DADADF;border-radius:16px;background:#FFFFFF;padding:14px 16px 12px;box-shadow:${hero ? "0 10px 30px rgba(23,23,26,0.07)" : "none"}">
      <textarea id="team-input" rows="${hero ? 3 : 2}" placeholder="Descreva o objetivo ou responda ao orquestrador..." style="width:100%;border:0;outline:none;font-size:14px;background:transparent;font-family:inherit;padding:0 0 8px;color:#17171A;resize:none;max-height:200px;line-height:1.5"></textarea>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:11px;color:#9A9AA3">Enter envia · Shift+Enter quebra linha</span>
        <span style="flex:1"></span>
        ${temVoz ? `<span data-tr-mic data-hover title="Ditar por voz" style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#66666F">${icon(ICONS.mic, 17, "currentColor")}</span>` : ""}
        <span id="team-actions" style="display:flex">${teamActionsHTML(tr)}</span>
      </div>
    </div>
  </form>`;
}

// Durante a execução só o miolo muda: não recria o textarea (preserva o que está sendo digitado).
// Troca entre tela inicial e conversa muda a estrutura: aí redesenha a tela inteira.
function syncTeam(){
  const t = teamById(state.teamId);
  const sc = document.getElementById("team-scroll");
  if(!t || !sc) return;
  const tr = state.teamRun || {};
  const vazio = !(tr.steps || []).length && !tr._loadingRun;
  if(sc.dataset.vazio !== String(vazio)){
    const pop = document.querySelector("[data-tr-pop]");
    const popAberto = pop && !pop.hidden;
    document.getElementById("main-slot").innerHTML = renderEquipe();
    if(popAberto){ const p2 = document.querySelector("[data-tr-pop]"); if(p2) p2.hidden = false; }
    const sc2 = document.getElementById("team-scroll");
    if(sc2 && !vazio) sc2.scrollTop = sc2.scrollHeight;
    _teamForceScroll = false;
    attach();
    return;
  }
  if(!vazio){
    const perto = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160;
    sc.innerHTML = teamTimelineHTML(t, tr);
    if(perto || _teamForceScroll){ sc.scrollTop = sc.scrollHeight; _teamForceScroll = false; }
  }
  const el = document.getElementById("team-elenco");
  if(el) el.innerHTML = teamElencoHTML(t, tr);
  const st = document.getElementById("team-status");
  if(st){ st.style.color = tr.running ? "#A8620A" : "#0F7A68"; st.innerHTML = teamStatusHTML(tr); }
  const act = document.getElementById("team-actions");
  if(act && act.dataset.running !== String(!!tr.running)){ act.dataset.running = String(!!tr.running); act.innerHTML = teamActionsHTML(tr); }
  const runs = document.getElementById("tr-runs");
  if(runs){
    const ass = (tr.runs || []).map(r => r.id + ":" + r.title + ":" + r.status).join("|") + "#" + (tr.rid || "");
    if(runs.dataset.ass !== ass){ runs.dataset.ass = ass; runs.innerHTML = teamRunsHTML(tr); }
  }
  attach();
}

// Ditado por voz (reconhecimento do próprio navegador, pt-BR)
let _teamRec = null;
function teamMic(el){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Seu navegador não suporta ditado por voz. Use o Chrome ou o Edge."); return; }
  if(_teamRec){ _teamRec.stop(); return; }
  const inp = document.getElementById("team-input");
  if(!inp) return;
  const rec = new SR();
  rec.lang = "pt-BR"; rec.interimResults = true; rec.continuous = true;
  const base = inp.value ? inp.value.replace(/\s*$/, " ") : "";
  rec.onresult = ev => { let txt = ""; for(let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript; inp.value = base + txt; };
  rec.onerror = ev => { if(ev.error === "not-allowed") alert("Permita o uso do microfone no navegador para ditar."); };
  rec.onend = () => { _teamRec = null; const b = document.querySelector("[data-tr-mic]"); if(b){ b.style.color = ""; b.style.background = ""; } };
  try { rec.start(); } catch(err){ return; }
  _teamRec = rec;
  el.style.color = "#C0341C"; el.style.background = "rgba(192,52,28,0.08)";
}

// ─── Ações de equipes ────────────────────────────────────────────────────────
async function teamsLoad(){
  if(_teamsLoading) return;
  _teamsLoading = true;
  try {
    const r = await fetch("/api/teams");
    if(!r.ok) throw new Error("HTTP " + r.status);
    state.teamsData = await r.json();
    state.teamsError = null;
  } catch(err){ state.teamsError = "Não foi possível carregar as equipes: " + err.message; }
  _teamsLoading = false;
  render();
}
function trSet(patch){ state.teamRun = Object.assign({}, state.teamRun || {}, patch); render(); }
function teamCloseStream(){ if(_teamES){ try { _teamES.close(); } catch(err){} _teamES = null; } }
async function teamRunInit(teamId){
  teamCloseStream();
  state.teamRun = { teamId, runs: [], rid: null, steps: [], running: false };
  render();
  await teamRunsLoad();
  // Se tem execução rodando, abre ela direto pra acompanhar
  const tr = state.teamRun;
  const rodando = (tr.runs || []).find(r => r.status === "running");
  if(rodando && !tr.rid) teamRunOpen(rodando.id);
}
async function teamRunsLoad(){
  const teamId = state.teamRun && state.teamRun.teamId;
  if(!teamId) return;
  try {
    const r = await fetch("/api/teams/" + encodeURIComponent(teamId) + "/runs");
    const j = await r.json();
    if(!state.teamRun || state.teamRun.teamId !== teamId) return;
    trSet({ runs: j.runs || [] });
  } catch(err){}
}
function teamUpsertStep(step){
  const steps = (state.teamRun.steps || []).slice();
  const i = steps.findIndex(s => s.id === step.id);
  if(i >= 0) steps[i] = step; else steps.push(step);
  steps.sort((a, b) => a.turn - b.turn || a.seq - b.seq);
  return steps;
}
function teamOpenStream(rid){
  teamCloseStream();
  let pronto;
  const conectado = new Promise(r => { pronto = r; setTimeout(r, 3000); });
  try {
    const es = new EventSource("/api/teams/runs/" + encodeURIComponent(rid) + "/stream");
    _teamES = es;
    const meu = () => state.teamRun && state.teamRun.rid === rid;
    es.addEventListener("open", () => pronto());
    es.addEventListener("step", ev => { if(meu()) trSet({ steps: teamUpsertStep(JSON.parse(ev.data)) }); });
    es.addEventListener("token", ev => {
      if(!meu()) return;
      const d = JSON.parse(ev.data);
      const steps = (state.teamRun.steps || []).slice();
      const i = steps.findIndex(s => s.id === d.id);
      if(i < 0) return;
      steps[i] = Object.assign({}, steps[i], { content: (steps[i].content || "") + (d.text || "") });
      trSet({ steps });
    });
    es.addEventListener("run", ev => { if(meu()){ trSet({ running: JSON.parse(ev.data).status === "running" }); teamRunsLoad(); } });
    es.addEventListener("end", () => { if(meu()){ trSet({ running: false }); teamRunsLoad(); } });
  } catch(err){ pronto(); }
  return conectado;
}
async function teamRunOpen(rid){
  teamCloseStream();
  trSet({ rid, steps: [], running: false, _loadingRun: true });
  try {
    const r = await fetch("/api/teams/runs/" + encodeURIComponent(rid));
    const j = await r.json();
    if(!state.teamRun || state.teamRun.rid !== rid) return;
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    _teamForceScroll = true;
    trSet({ steps: j.steps || [], running: j.run.status === "running", _loadingRun: false });
    await teamOpenStream(rid);
  } catch(err){ trSet({ _loadingRun: false }); alert("Erro: " + err.message); }
}
function teamStartNew(){
  teamCloseStream();
  trSet({ rid: null, steps: [], running: false, _loadingRun: false });
  const i = document.getElementById("team-input"); if(i) i.focus();
}
async function teamSend(text){
  text = (text || "").trim();
  const tr = state.teamRun || {};
  if(!text || tr.running) return;
  let rid = tr.rid;
  try {
    if(!rid){
      const r = await fetch("/api/teams/" + encodeURIComponent(tr.teamId) + "/runs", { method: "POST" });
      const j = await r.json();
      if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
      rid = j.run.id;
      trSet({ rid, steps: [], running: true });
      await teamOpenStream(rid);
    } else {
      trSet({ running: true });
      if(!_teamES) await teamOpenStream(rid);
    }
    _teamForceScroll = true;
    const r2 = await fetch("/api/teams/runs/" + encodeURIComponent(rid) + "/send", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ text }) });
    const j2 = await r2.json().catch(() => ({}));
    if(!r2.ok) throw new Error(j2.error || "HTTP " + r2.status);
    teamRunsLoad();
  } catch(err){ trSet({ running: false }); alert("Erro ao enviar: " + err.message); }
}
function teamSendFromInput(){
  const i = document.getElementById("team-input");
  if(!i || !i.value.trim() || (state.teamRun && state.teamRun.running)) return;
  const v = i.value; i.value = "";
  teamSend(v);
}
async function teamCancel(){
  const rid = state.teamRun && state.teamRun.rid;
  if(!rid) return;
  try { await fetch("/api/teams/runs/" + encodeURIComponent(rid) + "/cancel", { method: "POST" }); } catch(err){}
}
async function teamRunDelete(rid){
  if(!confirm("Excluir esta execução? O histórico e as entregas dela serão apagados.")) return;
  try {
    const r = await fetch("/api/teams/runs/" + encodeURIComponent(rid), { method: "DELETE" });
    if(!r.ok) throw new Error((await r.json()).error || "HTTP " + r.status);
    if(state.teamRun && state.teamRun.rid === rid){ teamCloseStream(); trSet({ rid: null, steps: [], running: false }); }
    teamRunsLoad();
  } catch(err){ alert("Erro: " + err.message); }
}
async function teamShare(id, el){
  const link = location.origin + location.pathname + "#/equipe/" + id;
  try { await navigator.clipboard.writeText(link); }
  catch(err){ prompt("Copie o link da equipe:", link); return; }
  const span = el && el.querySelector("span");
  if(span){ const antes = span.textContent; span.textContent = "Link copiado"; setTimeout(() => { span.textContent = antes; cardMenuClose(); }, 1200); }
  else if(el){ el.title = "Link copiado"; el.style.color = "#0F7A68"; setTimeout(() => { el.style.color = ""; el.title = "Copiar link da equipe"; }, 1200); }
}
async function teamDuplicate(id){
  try {
    const r = await fetch("/api/teams/" + encodeURIComponent(id) + "/duplicate", { method: "POST" });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    state.teamsData = null;
    setState({});
  } catch(err){ alert("Erro ao duplicar: " + err.message); }
}
async function teamDeleteById(id){
  const t = teamById(id);
  if(!t) return;
  if(!confirm(`Excluir a equipe "${t.name}"? As execuções e entregas dela serão apagadas. Os agentes continuam existindo.`)) return;
  try {
    const r = await fetch("/api/teams/" + encodeURIComponent(id), { method: "DELETE" });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    state.teamsData = null; state.teamForm = null;
    if(state.teamRun && state.teamRun.teamId === id){ teamCloseStream(); state.teamRun = null; }
    setState(["equipe", "criarEquipe"].indexOf(state.screen) >= 0 ? { screen: "equipes", teamId: null, editTeamId: null } : {});
  } catch(err){ alert("Erro: " + err.message); }
}
function teamMenuAction(act, id, el){
  if(act === "share"){ teamShare(id, el); return; }
  cardMenuClose();
  if(act === "edit") setState({ screen: "criarEquipe", editTeamId: id });
  else if(act === "dup") teamDuplicate(id);
  else if(act === "del") teamDeleteById(id);
}

function tfBlank(){ return { id: null, name: "", objective: "", description: "", visibility: "privada", orchestratorPrompt: "", model: "", icebreakers: [""], agentIds: [], _q: "" }; }
function tfFrom(t){
  return { id: t.id, name: t.name, objective: t.objective, description: t.description, visibility: t.visibility, orchestratorPrompt: t.orchestratorPrompt,
    model: t.model || "", icebreakers: t.icebreakers.length ? t.icebreakers.slice() : [""], agentIds: t.agents.filter(a => !a.missing).map(a => a.id), _q: "" };
}
function tfTouch(patch){ state.teamForm = Object.assign({}, state.teamForm, patch || {}); render(); }
function tfNorm(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function tfFilter(){
  const f = state.teamForm; if(!f) return;
  const q = tfNorm(f._q);
  document.querySelectorAll("[data-tf-group]").forEach(g => {
    let vis = 0;
    g.querySelectorAll("[data-tf-agent]").forEach(el => { const ok = !q || el.dataset.busca.indexOf(q) >= 0; el.hidden = !ok; if(ok) vis++; });
    g.hidden = !vis;
  });
}

async function tfSave(){
  const f = state.teamForm; if(!f || f._saving) return;
  const lim = teamLimits();
  if(!f.name.trim()){ alert("Dê um nome à equipe."); return; }
  if(f.agentIds.length < lim.min || f.agentIds.length > lim.max){ alert(`Selecione de ${lim.min} a ${lim.max} agentes.`); return; }
  tfTouch({ _saving: true });
  const body = { name: f.name, objective: f.objective, description: f.description, visibility: f.visibility, orchestratorPrompt: f.orchestratorPrompt,
    model: f.model, icebreakers: f.icebreakers.filter(q => q && q.trim()), agentIds: f.agentIds };
  try {
    const r = await fetch(f.id ? "/api/teams/" + encodeURIComponent(f.id) : "/api/teams", {
      method: f.id ? "PATCH" : "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    state.teamsData = null; state.teamForm = null;
    if(state.teamRun && state.teamRun.teamId === j.team.id) state.teamRun = Object.assign({}, state.teamRun);
    setState({ screen: "equipe", teamId: j.team.id, editTeamId: null });
  } catch(err){ tfTouch({ _saving: false }); alert("Erro ao salvar: " + err.message); }
}

function fmtBytes(n){
  if(!n && n !== 0) return "";
  if(n < 1024) return n + " B";
  if(n < 1024*1024) return (n/1024).toFixed(0) + " KB";
  return (n/1024/1024).toFixed(1).replace(".", ",") + " MB";
}

function mdToHtml(src){
  const blocks = [];
  let t = String(src || "").replace(/```[\w-]*\n?([\s\S]*?)```/g, (m, code) => { blocks.push(code.replace(/\n$/, "")); return "\n\u0000" + (blocks.length - 1) + "\u0000\n"; });
  t = e(t);
  const inline = s => s
    .replace(/`([^`\n]+)`/g, '<code style="background:#F1F1F3;border-radius:5px;padding:1px 5px;font-size:12.5px">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = t.split("\n");
  const out = [];
  let i = 0;
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
  while(i < lines.length){
    const l = lines[i];
    const cb = /^\u0000(\d+)\u0000$/.exec(l.trim());
    if(cb){ out.push(`<pre style="background:#17171A;color:#F1F1F3;border-radius:10px;padding:12px 14px;overflow-x:auto;font-size:12.5px;line-height:1.5;margin:0 0 10px"><code>${e(blocks[+cb[1]])}</code></pre>`); i++; continue; }
    const hd = /^(#{1,6})\s+(.*)$/.exec(l);
    if(hd){ const sz = [18, 16, 15, 14, 13.5, 13.5][hd[1].length - 1]; out.push(`<div style="font-family:'Space Grotesk',sans-serif;font-size:${sz}px;font-weight:600;margin:14px 0 8px">${inline(hd[2])}</div>`); i++; continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ out.push('<hr style="border:0;border-top:1px solid #E6E6EA;margin:14px 0">'); i++; continue; }
    if(l.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])){
      const head = cells(l); i += 2; const rows = [];
      while(i < lines.length && lines[i].includes("|") && lines[i].trim()){ rows.push(cells(lines[i])); i++; }
      out.push(`<div style="overflow-x:auto;margin:0 0 10px"><table style="border-collapse:collapse;font-size:12.5px;min-width:100%"><thead><tr>${head.map(c => `<th style="border:1px solid #E6E6EA;padding:7px 10px;text-align:left;background:#F7F7F8;font-weight:600">${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td style="border:1px solid #E6E6EA;padding:7px 10px;vertical-align:top">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if(/^\s*&gt;\s?/.test(l)){
      const q = [];
      while(i < lines.length && /^\s*&gt;\s?/.test(lines[i])){ q.push(inline(lines[i].replace(/^\s*&gt;\s?/, ""))); i++; }
      out.push(`<blockquote style="margin:0 0 10px;padding:9px 14px;border-left:3px solid rgba(168,98,10,0.5);background:rgba(168,98,10,0.05);border-radius:0 8px 8px 0">${q.join("<br>")}</blockquote>`);
      continue;
    }
    if(/^\s*[-*•]\s+/.test(l)){
      const items = [];
      while(i < lines.length && /^\s*[-*•]\s+/.test(lines[i])){ items.push(inline(lines[i].replace(/^\s*[-*•]\s+/, ""))); i++; }
      out.push(`<ul style="margin:0 0 10px;padding-left:20px">${items.map(x => `<li style="margin:3px 0">${x}</li>`).join("")}</ul>`);
      continue;
    }
    if(/^\s*\d+[.)]\s+/.test(l)){
      const items = [];
      while(i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ items.push(inline(lines[i].replace(/^\s*\d+[.)]\s+/, ""))); i++; }
      out.push(`<ol style="margin:0 0 10px;padding-left:22px">${items.map(x => `<li style="margin:3px 0">${x}</li>`).join("")}</ol>`);
      continue;
    }
    if(!l.trim()){ i++; continue; }
    const para = [];
    while(i < lines.length && lines[i].trim() && !/^(#{1,6})\s|^\s*[-*•]\s+|^\s*\d+[.)]\s+|^&gt;|^\u0000\d+\u0000$/.test(lines[i].trim()) && !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))){ para.push(inline(lines[i])); i++; }
    if(para.length) out.push(`<p style="margin:0 0 10px">${para.join("<br>")}</p>`);
    else i++;
  }
  return out.join("");
}

      ${a.warn ? `<div style="display:flex;gap:9px;padding:11px 13px;border:1px solid rgba(168,98,10,0.24);border-radius:10px;background:rgba(168,98,10,0.05);text-align:left;margin-bottom:18px">${icon(ICONS.warn, 13, "#A8620A")}<span style="font-size:11.5px;color:#4A4A52;line-height:1.55">${e(a.warn)}</span></div>` : ""}

        ${(a.icebreakers || []).map(q => `<div data-ag-ice="${e(q)}" data-hover-border style="border:1px solid #E6E6EA;border-radius:11px;background:#FFFFFF;padding:13px 15px;font-size:12.5px;color:#3C3C44;line-height:1.5;cursor:pointer;text-align:left">${e(q)}</div>`).join("")}
      </div>
    </div>`;
  }
  return messages.map(m => {
    const isUser = m.role === "user";
    const isPending = m.status === "pending" && !m.content;
    const att = (m.attachments || []).map(x => x.kind === "image"

      : `<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid rgba(168,98,10,0.3);border-radius:8px;font-size:11.5px;background:#FFFFFF">${icon(ICONS.file, 12, "#A8620A")}${e(x.originalname || "arquivo")}</span>`).join("");
    if(isUser){
      return `<div style="display:flex;justify-content:flex-end"><div style="max-width:78%;padding:12px 16px;border-radius:14px 14px 4px 14px;background:rgba(168,98,10,0.12);border:1px solid rgba(168,98,10,0.24);font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word">${att ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${m.content ? "8px" : "0"}">${att}</div>` : ""}${e(m.content)}</div></div>`;
    }
    return `<div style="display:flex;justify-content:flex-start"><div style="max-width:86%;min-width:0;padding:14px 18px;border-radius:14px 14px 14px 4px;background:#FFFFFF;border:1px solid #E6E6EA;font-size:13.5px;line-height:1.65;word-wrap:break-word">${isPending ? '<span style="color:#66666F">Pensando ▍</span>' : mdToHtml(m.content)}</div></div>`;
  }).join("");
}

// Durante o streaming só o miolo muda: não recria o textarea (preserva o que está sendo digitado)
function syncAgentChat(){
  const a = state.agentDetail;
  const sc = document.getElementById("chat-scroll");
  if(!a || !sc) return;
  const chat = state.chat || {};
  const streaming = !!chat.streaming;
  sc.innerHTML = agentMsgsHTML(a, chat);
  const st = document.getElementById("ag-status");
  if(st){
    st.style.color = streaming ? "#A8620A" : "#0F7A68";
    st.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>${streaming ? "Pensando..." : "Pronto"}`;
  }
  const btn = document.getElementById("ac-send");
  if(btn){
    btn.disabled = streaming;
    btn.style.background = streaming ? "#B4B4BC" : "#A8620A";
    btn.style.cursor = streaming ? "not-allowed" : "pointer";
  }
  const lista = document.getElementById("ag-sess-list");
  if(lista){
    const assinatura = (chat.sessions || []).map(s => s.id + ":" + (s.title || "")).join("|") + "#" + (chat.sid || "");
    if(lista.dataset.assinatura !== assinatura){
      lista.dataset.assinatura = assinatura;
      lista.innerHTML = agentSessHTML(chat);
    }
  }
  attach();
}

async function agentSetWorkspace(id, val){

const CARD_SEL = "[data-agent-card],[data-team-card]", POP_SEL = "[data-agent-pop],[data-team-pop],[data-tr-pop]";
function cardMenuClose(){
  document.querySelectorAll(POP_SEL).forEach(p => {
    if(p.hidden) return;
    p.hidden = true;
    const card = p.closest(CARD_SEL);
    if(card) card.style.zIndex = "";
  });
}
function cardMenuToggle(id, kebab){
  const card = kebab.closest(CARD_SEL);
  const pop = card && card.querySelector(POP_SEL);
  if(!pop) return;
  const abrir = pop.hidden;
  cardMenuClose();
  if(!abrir) return;
  pop.hidden = false;
  card.style.zIndex = "5";
  pop.classList.remove("pop-down"); void pop.offsetWidth; pop.classList.add("pop-down");
}
async function agentShare(id, el){
  const link = location.origin + location.pathname + "#/agente/" + id;
  try { await navigator.clipboard.writeText(link); }
  catch(err){ prompt("Copie o link do agente:", link); return; }
  const span = el.querySelector("span");
  if(span){ span.textContent = "Link copiado"; setTimeout(cardMenuClose, 900); }
}
async function agentDuplicate(id){
  try {
    const r = await fetch("/api/agents/" + encodeURIComponent(id));
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    const a = j.agent;
    const body = { name: (a.name + " (cópia)").slice(0, 120), category: a.category, description: a.description, prompt: a.prompt,
      icebreakers: a.icebreakers, skills: a.skills, model: a.model };
    const r2 = await fetch("/api/agents", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const j2 = await r2.json();
    if(!r2.ok) throw new Error(j2.error || "HTTP " + r2.status);
    const novoId = j2.agent.id;
    if(a.inWorkspace){
      await fetch("/api/agents/" + encodeURIComponent(novoId), { method: "PATCH", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ inWorkspace: true }) });
    }
    // Copia os arquivos de conhecimento (baixa do original e sobe no novo)
    if(a.files && a.files.length){
      try {
        const files = await Promise.all(a.files.map(async f => {
          const rf = await fetch("/api/agents/" + encodeURIComponent(id) + "/files/" + encodeURIComponent(f.id));
          if(!rf.ok) throw new Error("HTTP " + rf.status);
          return new File([await rf.blob()], f.name, { type: f.mime || "application/octet-stream" });
        }));
        await afUpload(novoId, files);
      } catch(err){ alert("Agente duplicado, mas os arquivos de conhecimento não foram copiados: " + err.message); }
    }
    state.agentsData = null; state.agentDetail = null;
    setState({ agentsTab: state.agentsTab === "empresa" ? "meus" : state.agentsTab });
  } catch(err){ alert("Erro ao duplicar: " + err.message); }
}
async function agentDeleteById(id){
  const a = agentsList().find(x => x.id === id);
  if(!a) return;
  if(!confirm(`Excluir o agente "${a.name}"? As conversas dele deixam de aparecer e os arquivos de conhecimento são apagados.`)) return;
  try {
    const r = await fetch("/api/agents/" + encodeURIComponent(id), { method: "DELETE" });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    state.agentsData = null; state.agentDetail = null;
    setState({});
  } catch(err){ alert("Erro: " + err.message); }
}
function agentMenuAction(act, id, el){
  const a = agentsList().find(x => x.id === id);
  if(act === "share"){ agentShare(id, el); return; }
  cardMenuClose();
  if(act === "edit") setState({ screen: "criarAgente", editAgentId: id });
  else if(act === "dup") agentDuplicate(id);
  else if(act === "ws" && a) agentSetWorkspace(id, !a.inWorkspace);
  else if(act === "del") agentDeleteById(id);
}

function afFrom(a){

    icebreakers: (a.icebreakers && a.icebreakers.length) ? a.icebreakers.slice() : [""], skills: (a.skills || []).slice(), model: a.model || "", files: a.files || [] };

async function afLoad(id){
  _afLoading = id;
  state.agentFormError = null;
  try {
    const r = await fetch("/api/agents/" + encodeURIComponent(id));
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);

function afTouch(patch){ state.agentForm = Object.assign({}, state.agentForm, patch || {}); render(); }
async function afUpload(id, files){
  const fd = new FormData();
  files.forEach(x => fd.append("files", x));
  const r = await fetch("/api/agents/" + encodeURIComponent(id) + "/files", { method: "POST", body: fd });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error || "falha no upload (HTTP " + r.status + ")");
  return j.agent;
}
async function afAddFiles(files){
  const f = state.agentForm; if(!f || !files.length) return;
  if(!f.id){ _afPending = _afPending.concat(files); afTouch(); return; }
  afTouch({ _uploading: true });
  try {
    const ag = await afUpload(f.id, files);
    afTouch({ _uploading: false, files: ag.files });
    state.agentsData = null; state.agentDetail = null;
  } catch(err){ afTouch({ _uploading: false }); alert("Erro no upload: " + err.message); }
}
async function afDelFile(fid){
  const f = state.agentForm; if(!f || !f.id) return;
  if(!confirm("Remover este arquivo da base de conhecimento do agente?")) return;
  try {
    const r = await fetch("/api/agents/" + encodeURIComponent(f.id) + "/files/" + encodeURIComponent(fid), { method: "DELETE" });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    afTouch({ files: j.agent.files });
    state.agentsData = null; state.agentDetail = null;
  } catch(err){ alert("Erro: " + err.message); }
}
async function afSave(){
  const f = state.agentForm; if(!f || f._saving) return;
  if(!f.name.trim()){ alert("Dê um nome ao agente."); return; }
  if(f.kind !== "zeus" && !f.prompt.trim() && !f.description.trim()){ alert("Escreva o prompt ou ao menos o descritivo do agente."); return; }
  afTouch({ _saving: true });
  const body = { name: f.name, category: f.category, description: f.description, prompt: f.prompt,
    icebreakers: f.icebreakers.filter(q => q && q.trim()), skills: f.skills, model: f.model };
  try {
    const r = await fetch(f.id ? "/api/agents/" + encodeURIComponent(f.id) : "/api/agents", {
      method: f.id ? "PATCH" : "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    const id = j.agent.id;
    if(_afPending.length){
      try { await afUpload(id, _afPending); }
      catch(err){ alert("Agente salvo, mas o upload dos arquivos falhou: " + err.message); }
      _afPending = [];
    }
    state.agentsData = null; state.agentDetail = null; state.agentForm = null;
    setState({ screen: "agente", agentId: id, editAgentId: null });
  } catch(err){ afTouch({ _saving: false }); alert("Erro ao salvar: " + err.message); }
}
async function afDelete(){
  const f = state.agentForm; if(!f || !f.id) return;
  if(!confirm(`Excluir o agente "${f.name}"? As conversas dele deixam de aparecer e os arquivos de conhecimento são apagados.`)) return;
  try {
    const r = await fetch("/api/agents/" + encodeURIComponent(f.id), { method: "DELETE" });

}

// Ripple nos botões principais (dourados) e no FAB. Desenhado numa camada fixa no body,
// recortada no formato do botão, pra sobreviver ao re-render que o próprio clique dispara.
document.addEventListener("pointerdown", ev => {
  const btn = ev.target.closest && ev.target.closest("[data-hover-dark],[data-toggle-widget]");
  if(!btn) return;
  const r = btn.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 2.2;
  const layer = document.createElement("div");
  layer.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;border-radius:${getComputedStyle(btn).borderRadius};overflow:hidden;pointer-events:none;z-index:9999`;
  const s = document.createElement("span");
  s.className = "z-ripple";
  s.style.cssText = `width:${d}px;height:${d}px;left:${ev.clientX - r.left - d/2}px;top:${ev.clientY - r.top - d/2}px`;
  layer.appendChild(s);
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 650);
});

function render(){
  if(!document.getElementById("main-slot")) mountShell();

  // Escopo do chat: conversas gerais do Zeus (agent null) ou de um agente específico
  const escopo = state.screen === "agente" ? (state.agentId || null) : (["chat","motorExec"].indexOf(state.screen) >= 0 ? null : undefined);
  if(escopo !== undefined){
    const atual = state.chat ? (state.chat.agentId || null) : null;
    if(state.chat && atual !== escopo){
      chatCloseStream();
      _acFiles = [];
      state.chat = { agentId: escopo, sessions: [], messages: [], sid: null, streaming: false, _loaded: true };
      setTimeout(chatLoadSessions, 0);
    } else if(!state.chat || !state.chat._loaded){
      state.chat = Object.assign({ agentId: escopo }, state.chat || {}, { _loaded: true });
      setTimeout(chatLoadSessions, 0);
    }
  }

  const sidebarDirty = _prev.collapsed !== state.collapsed
    || _prev.wsMenuOpen !== state.wsMenuOpen
    || _prev.userMenuOpen !== state.userMenuOpen
    || _prev.themeMenuOpen !== state.themeMenuOpen
    || _prev.screen !== state.screen;

    || _prev.toolsTab !== state.toolsTab
    || _prev.wa !== state.wa

    || _prev.agentsTab !== state.agentsTab

    || _prev.editAgentId !== state.editAgentId

    || (["equipes","equipe","criarEquipe","agentes"].indexOf(state.screen) >= 0 && (_prev.teamsData !== state.teamsData || _prev.teamsError !== state.teamsError))
    || (state.screen === "equipe" && _prev.teamId !== state.teamId)
    || (state.screen === "criarEquipe" && (_prev.teamForm !== state.teamForm || _prev.editTeamId !== state.editTeamId));
  const chatDirty = TELAS_CHAT.indexOf(state.screen) >= 0 && _prev.chat !== state.chat;
  const mainDirty = mainStructDirty || (chatDirty && state.screen !== "agente");
  const agentChatSync = !mainStructDirty && chatDirty && state.screen === "agente";
  const teamSync = !mainStructDirty && state.screen === "equipe" && _prev.teamRun !== state.teamRun;
  const widgetDirty = _prev.widgetOpen !== state.widgetOpen;
  const fabDirty = _prev.widgetOpen !== state.widgetOpen || _prev.screen !== state.screen;
  const overlayDirty = _prev.chatOverlay !== state.chatOverlay
    || (state.chatOverlay && _prev.chatOverlayHist !== state.chatOverlayHist);

  if(sidebarDirty) document.getElementById("sidebar-slot").innerHTML = sidebar();
  if(mainDirty) document.getElementById("main-slot").innerHTML = (RENDERERS[state.screen] || renderHome)();
  if(widgetDirty) document.getElementById("widget-slot").innerHTML = widget();
  if(fabDirty) document.getElementById("fab-slot").innerHTML = fab();
  if(overlayDirty) document.getElementById("overlay-slot").innerHTML = state.chatOverlay ? renderChatOverlay() : "";

  animateEntradas(mainDirty, overlayDirty);

  if(sidebarDirty || mainDirty || widgetDirty || fabDirty || overlayDirty) attach();
  if(agentChatSync) syncAgentChat();
  if(teamSync) syncTeam();

  if(state.chatOverlay){
    if(overlayDirty){
      const oi = document.getElementById("chat-overlay-input");
      if(oi) oi.focus();
    } else if(_prev.chat !== state.chat){
      syncChatOverlay();
    }
  }

  if(state.screen === "waConnector" && _lastScreen !== "waConnector" && (!state.wa || state.wa.loading !== false)){
    setTimeout(waLoad, 0);
  }
  const emTelaChat = TELAS_CHAT.indexOf(state.screen) >= 0;
  const vinhaDeTelaChat = TELAS_CHAT.indexOf(_lastScreen) >= 0;

  // Carregamentos das telas de agentes
  if(["agentes","catalogo","criarAgente","agente","criarEquipe"].indexOf(state.screen) >= 0 && !state.agentsData && !_agentsLoading){
    setTimeout(agentsLoad, 0);
  }
  if(state.screen === "agente" && state.agentId && (!state.agentDetail || state.agentDetail.id !== state.agentId) && _agentDetailLoading !== state.agentId){
    _agentDetailLoading = state.agentId;
    const alvo = state.agentId;
    setTimeout(() => agentLoadDetail(alvo), 0);
  }
  if(state.screen === "criarAgente"){
    const quer = state.editAgentId || null;
    if(quer && (!state.agentForm || state.agentForm.id !== quer) && _afLoading !== quer){
      _afLoading = quer;
      setTimeout(() => afLoad(quer), 0);
    } else if(!quer && (!state.agentForm || state.agentForm.id)){
      _afPending = [];
      setTimeout(() => { if(state.screen === "criarAgente" && !state.editAgentId){ state.agentForm = afBlank(); render(); } }, 0);
    }
  }
  // Equipes de agentes
  if(["equipes","equipe","criarEquipe","agentes"].indexOf(state.screen) >= 0 && !state.teamsData && !_teamsLoading){
    setTimeout(teamsLoad, 0);
  }
  if(state.screen === "equipe" && state.teamId && (!state.teamRun || state.teamRun.teamId !== state.teamId)){
    state.teamRun = { teamId: state.teamId, runs: [], rid: null, steps: [], running: false };

    setTimeout(() => teamRunInit(alvo), 0);
  }
  if(state.screen !== "equipe" && _lastScreen === "equipe"){ teamCloseStream(); state.teamRun = null; }
  if(state.screen === "criarEquipe" && state.teamsData){
    const quer = state.editTeamId || null;
    if(quer && (!state.teamForm || state.teamForm.id !== quer)){

      setTimeout(() => { if(state.screen === "criarEquipe" && !state.editTeamId){ state.teamForm = tfBlank(); render(); } }, 0);
    }
  }
  if(!emTelaChat && vinhaDeTelaChat && !state.chatOverlay) chatCloseStream();
  _lastScreen = state.screen;
  _prev = Object.assign({}, state);
}

const _boundEls = new WeakMap();
function bindOnce(el, type, fn){
  let tipos = _boundEls.get(el);
  if(!tipos){ tipos = new Set(); _boundEls.set(el, tipos); }
  if(tipos.has(type)) return;
  tipos.add(type);
  el.addEventListener(type, fn);
}

function waSetModal(m){ state.wa = Object.assign({}, state.wa || { instances: [] }, { modal: m }); render(); }
function waSetInstances(list, extra){ state.wa = Object.assign({}, state.wa || {}, { instances: list, loading: false, error: null }, extra || {}); render(); }
function waError(msg){ state.wa = Object.assign({}, state.wa || { instances: [] }, { loading: false, error: msg }); render(); }

async function waLoad(){
  state.wa = Object.assign({}, state.wa || {}, { loading: true, error: null }); render();
  try {
    const r = await fetch("/api/wa/instances");
    const j = await r.json();
    waSetInstances(j.instances || []);
  } catch(e){ waError("Falha ao carregar instâncias: " + e.message); }
}
async function waCreate(friendly){
  try {
    const r = await fetch("/api/wa/instances", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ friendly }) });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "criacao_falhou");
    const qr = (j.qr && (j.qr.base64 || j.qr.code)) || null;
    waSetModal({ step: "qr", name: j.name, friendly, qr, state: "aguardando escaneamento..." });
    waPollState(j.name);
    waLoad();
  } catch(e){ alert("Erro ao criar: " + e.message); }
}
async function waConnect(name){
  const cur = (state.wa && state.wa.instances || []).find(i=>i.name===name) || {};
  waSetModal({ step: "qr", name, friendly: cur.friendly || name, qr: null, state: "gerando QR..." });
  try {
    const r = await fetch("/api/wa/instances/"+encodeURIComponent(name)+"/qr");
    const j = await r.json();
    const qr = (j.base64 || j.code || (j.qrcode && (j.qrcode.base64 || j.qrcode.code))) || null;
    waSetModal({ step: "qr", name, friendly: cur.friendly || name, qr, state: "aguardando escaneamento..." });
    waPollState(name);
  } catch(e){ alert("Erro ao gerar QR: " + e.message); }
}
async function waPollState(name){
  const start = Date.now();
  const tick = async () => {
    if(!state.wa || !state.wa.modal || state.wa.modal.name !== name) return;
    try {
      const r = await fetch("/api/wa/instances/"+encodeURIComponent(name)+"/state");
      const j = await r.json();
      const st = (j.instance && j.instance.state) || j.state || "unknown";
      if(state.wa && state.wa.modal && state.wa.modal.name === name){
        state.wa.modal = Object.assign({}, state.wa.modal, { state: st });
        render();
      }
      if(st === "open"){ waSetModal(null); waLoad(); return; }
    } catch {}
    if(Date.now() - start < 120000) setTimeout(tick, 3000);
  };
  setTimeout(tick, 2000);
}
async function waLogout(name){
  try { await fetch("/api/wa/instances/"+encodeURIComponent(name)+"/logout", { method: "POST" }); waLoad(); }
  catch(e){ alert("Erro: " + e.message); }
}
async function waDelete(name){
  try { await fetch("/api/wa/instances/"+encodeURIComponent(name), { method: "DELETE" }); waLoad(); }
  catch(e){ alert("Erro: " + e.message); }
}
async function waRename(name, friendly){
  try {
    await fetch("/api/wa/instances/"+encodeURIComponent(name), { method: "PATCH", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ friendly }) });
    waSetModal(null); waLoad();
  } catch(e){ alert("Erro: " + e.message); }
}

// ─── Chat (Copiloto ZEUS) ────────────────────────────────────────────────────
let _chatES = null;
function chatSet(patch){
  state.chat = Object.assign({}, state.chat || { sessions: [], messages: [] }, patch);
  render();
  const s = document.getElementById("chat-scroll");
  if(s) s.scrollTop = s.scrollHeight;
}
async function chatLoadSessions(){
  const agentId = (state.chat && state.chat.agentId) || null;
  try {
    const r = await fetch("/api/chat/sessions" + (agentId ? "?agent=" + encodeURIComponent(agentId) : ""));
    const j = await r.json();
    if(((state.chat && state.chat.agentId) || null) !== agentId) return; // trocou de agente no meio
    chatSet({ sessions: j.sessions || [] });
  } catch(e){}
}
async function chatOpen(sid){
  chatCloseStream();
  chatSet({ sid, messages: [], streaming: false });
  try {
    const r = await fetch("/api/chat/sessions/"+encodeURIComponent(sid)+"/messages");
    const j = await r.json();
    if(!state.chat || state.chat.sid !== sid) return;
    chatSet({ messages: (j.messages || []).map(m => ({ role: m.role, content: m.content || "", status: m.status, attachments: m.attachments || [] })) });
    chatOpenStream(sid);
  } catch(e){}
}
// Resolve quando o SSE conecta (ou após 3s): mandar mensagem antes disso perde os eventos
function chatOpenStream(sid){
  chatCloseStream();
  let pronto;
  const conectado = new Promise(r => { pronto = r; setTimeout(r, 3000); });
  try {
    const es = new EventSource("/api/chat/sessions/"+encodeURIComponent(sid)+"/stream");
    _chatES = es;
    es.addEventListener("open", () => pronto());
    es.addEventListener("user_msg", ev => {
      const d = JSON.parse(ev.data);
      const msgs = (state.chat.messages || []).concat([{ role:"user", content: d.content, status:"done", attachments: d.attachments || [] }]);
      chatSet({ messages: msgs });
    });
    es.addEventListener("zeus_start", () => {
      const msgs = (state.chat.messages || []).concat([{ role:"zeus", content:"", status:"pending" }]);
      chatSet({ messages: msgs, streaming: true });
    });
    es.addEventListener("token", ev => {
      const d = JSON.parse(ev.data);
      const msgs = (state.chat.messages || []).slice();
      const last = msgs[msgs.length - 1];
      if(last && last.role === "zeus"){ last.content = (last.content || "") + (d.text || ""); last.status = "pending"; }
      chatSet({ messages: msgs });
    });
    es.addEventListener("done", ev => {
      const msgs = (state.chat.messages || []).slice();
      const last = msgs[msgs.length - 1];
      if(!last || last.role !== "zeus"){ chatSet({ streaming: false }); chatReloadMessages(sid); chatLoadSessions(); return; }
      if(last && last.role === "zeus"){
        try { const d = JSON.parse(ev.data); if(d && d.content) last.content = d.content; } catch{}
        last.status = "done";
      }
      chatSet({ messages: msgs, streaming: false });
      chatLoadSessions();
    });
  } catch(e){ pronto(); }
  return conectado;
}
async function chatReloadMessages(sid){
  try {
    const r = await fetch("/api/chat/sessions/"+encodeURIComponent(sid)+"/messages");
    const j = await r.json();
    if(!state.chat || state.chat.sid !== sid) return;
    chatSet({ messages: (j.messages || []).map(m => ({ role: m.role, content: m.content || "", status: m.status, attachments: m.attachments || [] })) });
  } catch(e){}
}
function chatCloseStream(){
  if(_chatES){ try { _chatES.close(); } catch{} _chatES = null; }
}
async function chatNewSession(){
  chatCloseStream();
  try {
    const agentId = (state.chat && state.chat.agentId) || null;
    const r = await fetch("/api/chat/sessions", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ title: "Nova conversa", agent_id: agentId }) });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    chatSet({ sid: j.id, messages: [], streaming: false });
    await chatOpenStream(j.id);
    chatLoadSessions();
    return j.id;
  } catch(e){ alert("Erro criando sessão: " + e.message); return null; }
}
async function chatSend(text, files){
  files = files || [];
  if((!text || !text.trim()) && !files.length) return;
  let sid = state.chat && state.chat.sid;
  if(!sid) sid = await chatNewSession();
  if(!sid) return;
  const fd = new FormData();
  fd.append("text", text || "");
  files.forEach(f => fd.append("files", f));
  if(files.length) chatSet({ streaming: true }); // anexo pesado (áudio/vídeo) demora a processar antes do SSE
  try {
    const r = await fetch("/api/chat/sessions/"+encodeURIComponent(sid)+"/send", { method:"POST", body: fd });
    if(!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(j.error || "HTTP " + r.status); }
  } catch(e){ chatSet({ streaming: false }); alert("Erro enviando: " + e.message); }
}
async function chatDelete(sid){
  if(!confirm("Excluir esta conversa?")) return;
  try {
    await fetch("/api/chat/sessions/"+encodeURIComponent(sid), { method:"DELETE" });
    if(state.chat && state.chat.sid === sid){ chatCloseStream(); chatSet({ sid: null, messages: [], streaming: false }); }
    chatLoadSessions();
  } catch(e){ alert("Erro: " + e.message); }
}
// ─── Chat flutuante (sem sair da tela) ───────────────────────────────────────
function chatBubblesHTML(messages){
  if(!messages || !messages.length){
    return `<div style="margin:auto;text-align:center;color:#66666F;font-size:13px">Mande sua pergunta. Eu leio o contexto da operação e respondo aqui.</div>`;
  }
  return messages.map(m => {
    const isUser = m.role === "user";
    const isPending = m.status === "pending" && !m.content;
    const bg = isUser ? "rgba(168,98,10,0.12)" : "#FFFFFF";
    const border = isUser ? "rgba(168,98,10,0.24)" : "#E6E6EA";
    const align = isUser ? "flex-end" : "flex-start";
    const radius = isUser ? "14px 14px 4px 14px" : "14px 14px 14px 4px";
    return `<div style="display:flex;justify-content:${align}">
      <div style="max-width:78%;padding:12px 16px;border-radius:${radius};background:${bg};border:1px solid ${border};font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word">${isPending ? '<span style="color:#66666F">▍</span>' : e(m.content)}</div>
    </div>`;
  }).join("");
}

function chatSessoesHTML(sessions, sid){
  if(!sessions || !sessions.length){
    return `<div style="font-size:11.5px;color:#66666F;padding:8px 10px;line-height:1.5">Nenhuma conversa anterior.</div>`;
  }
  return sessions.map(s => `
    <div data-chat-open="${e(s.id)}" data-hover style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12px;cursor:pointer;background:${s.id===sid?'rgba(168,98,10,0.12)':'transparent'};color:${s.id===sid?'#A8620A':'#3C3C44'};font-weight:${s.id===sid?'600':'500'}">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${ICONS.chatBubble}</svg>
      <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e(s.title || 'Nova conversa')}</span>
      <span data-chat-delete="${e(s.id)}" title="Excluir" style="opacity:.5;cursor:pointer">${icon(ICONS.x, 11, "currentColor")}</span>
    </div>`).join("");
}

// Atualiza só o miolo do overlay durante o streaming (sem re-render que rouba o foco)
function syncChatOverlay(){
  const sc = document.getElementById("chat-overlay-scroll");
  if(!sc) return;
  const chat = state.chat || {};
  const streaming = !!chat.streaming;
  sc.innerHTML = chatBubblesHTML(chat.messages);
  sc.scrollTop = sc.scrollHeight;
  const st = document.getElementById("chat-overlay-status");
  if(st) st.textContent = streaming ? "ZEUS pensando..." : "Já li seus dados de hoje";
  const inp = document.getElementById("chat-overlay-input");
  if(inp){
    inp.disabled = streaming;
    if(!streaming && document.activeElement !== inp) inp.focus();
  }
  const btn = document.getElementById("chat-overlay-send");
  if(btn){
    btn.disabled = streaming;
    btn.style.background = streaming ? "#B4B4BC" : "#A8620A";
    btn.style.cursor = streaming ? "not-allowed" : "pointer";
  }
  // lista de conversas do painel lateral (quando aberto)
  const lista = document.getElementById("chat-overlay-hist-lista");
  if(lista){
    const assinatura = (chat.sessions || []).map(s => s.id + ":" + (s.title || "")).join("|") + "#" + (chat.sid || "");
    if(lista.dataset.assinatura !== assinatura){
      lista.dataset.assinatura = assinatura;
      lista.innerHTML = chatSessoesHTML(chat.sessions, chat.sid);
      attach();
    }
  }
}

function chatOverlayClose(){
  chatCloseStream();
  setState({ chatOverlay: false });
}

async function startChatFromHome(text){
  if(state.chat && state.chat.agentId){ chatCloseStream(); state.chat = { agentId: null, sessions: [], messages: [], sid: null, streaming: false }; }
  const sid = await chatNewSession();
  if(!sid) return;
  setState({ chatOverlay: true, chatOverlayHist: false });
  await chatSend(text);
}

  try {
    const r = await fetch("/index.html", { method: "HEAD", cache: "no-store" });
    const tag = r.headers.get("last-modified") || r.headers.get("etag");
    if(!tag) return;
    if(_buildTag === null){ _buildTag = tag; console.log("[central] build " + tag); return; }
    if(tag !== _buildTag && !(state.chat && state.chat.streaming)) location.reload();
  } catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkBuild(); });
window.addEventListener("focus", checkBuild);
setInterval(checkBuild, 120000);
checkBuild();

Object.assign(state, hashPatch());
if(!location.hash){ _skipHashSync = true; location.hash = "#/" + state.screen; }
render();
