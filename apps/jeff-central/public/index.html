// Durante a execução só o miolo muda: não recria o textarea (preserva o que está sendo digitado).
// Troca entre tela inicial e conversa muda a estrutura: aí redesenha a tela inteira.
function syncTeam(){
  const t = teamById(state.teamId);
  const sc = document.getElementById("team-scroll");
  if(!t || !sc) return;
  const tr = state.teamRun || {};
  const vazio = !(tr.steps || []).length && !tr._loadingRun;
  if(sc.dataset.vazio !== String(vazio)){
    const pop = document.querySelector("[data-tr-pop]");
    const popAberto = pop && !pop.hidden;
    document.getElementById("main-slot").innerHTML = renderEquipe();
    if(popAberto){ const p2 = document.querySelector("[data-tr-pop]"); if(p2) p2.hidden = false; }
    const sc2 = document.getElementById("team-scroll");
    if(sc2 && !vazio) sc2.scrollTop = sc2.scrollHeight;
    _teamForceScroll = false;
    attach();
    return;
  }
  if(!vazio){
    const perto = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160;
    sc.innerHTML = teamTimelineHTML(t, tr);
    if(perto || _teamForceScroll){ sc.scrollTop = sc.scrollHeight; _teamForceScroll = false; }
  }
  const el = document.getElementById("team-elenco");
  if(el) el.innerHTML = teamElencoHTML(t, tr);
  const st = document.getElementById("team-status");
  if(st){ st.style.color = tr.running ? "#673DE6" : "#0F7A68"; st.innerHTML = teamStatusHTML(tr); }
  const act = document.getElementById("team-actions");
  if(act && act.dataset.running !== String(!!tr.running)){ act.dataset.running = String(!!tr.running); act.innerHTML = teamActionsHTML(tr); }
  const runs = document.getElementById("tr-runs");
  if(runs){
    const ass = (tr.runs || []).map(r => r.id + ":" + r.title + ":" + r.status).join("|") + "#" + (tr.rid || "");
    if(runs.dataset.ass !== ass){ runs.dataset.ass = ass; runs.innerHTML = teamRunsHTML(tr); }
  }
  attach();
}

// Ditado por voz (reconhecimento do próprio navegador, pt-BR)
let _teamRec = null;
function teamMic(el, inputId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Seu navegador não suporta ditado por voz. Use o Chrome ou o Edge."); return; }
  if(_teamRec){ _teamRec.stop(); return; }
  const inp = document.getElementById(inputId || "team-input");
  if(!inp) return;
  const rec = new SR();
  rec.lang = "pt-BR"; rec.interimResults = true; rec.continuous = true;
  const base = inp.value ? inp.value.replace(/\s*$/, " ") : "";
  rec.onresult = ev => { let txt = ""; for(let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript; inp.value = base + txt; };
  rec.onerror = ev => { if(ev.error === "not-allowed") alert("Permita o uso do microfone no navegador para ditar."); };
  rec.onend = () => { _teamRec = null; el.style.color = ""; el.style.background = ""; };
  try { rec.start(); } catch(err){ return; }
  _teamRec = rec;
  el.style.color = "#C0341C"; el.style.background = "rgba(192,52,28,0.08)";
}

// ─── Ações de equipes ────────────────────────────────────────────────────────
async function teamsLoad(){
  if(_teamsLoading) return;
  _teamsLoading = true;
  try {
    const r = await fetch("/api/teams");
    if(!r.ok) throw new Error("HTTP " + r.status);
    state.teamsData = await r.json();
    state.teamsError = null;
  } catch(err){ state.teamsError = "Não foi possível carregar as equipes: " + err.message; }
  _teamsLoading = false;
  render();
}
function trSet(patch){ state.teamRun = Object.assign({}, state.teamRun || {}, patch); render(); }
function teamCloseStream(){ if(_teamES){ try { _teamES.close(); } catch(err){} _teamES = null; } }
async function teamRunInit(teamId){
  teamCloseStream();
  state.teamRun = { teamId, runs: [], rid: null, steps: [], running: false };
  render();
  await teamRunsLoad();
  // Se tem execução rodando, abre ela direto pra acompanhar
  const tr = state.teamRun;
  const rodando = (tr.runs || []).find(r => r.status === "running");
  if(rodando && !tr.rid) teamRunOpen(rodando.id);
}
async function teamRunsLoad(){
  const teamId = state.teamRun && state.teamRun.teamId;
  if(!teamId) return;
  try {
    const r = await fetch("/api/teams/" + encodeURIComponent(teamId) + "/runs");
    const j = await r.json();
    if(!state.teamRun || state.teamRun.teamId !== teamId) return;
    trSet({ runs: j.runs || [] });
  } catch(err){}
}
function teamUpsertStep(step){
  const steps = (state.teamRun.steps || []).slice();
  const i = steps.findIndex(s => s.id === step.id);
  if(i >= 0) steps[i] = step; else steps.push(step);
  steps.sort((a, b) => a.turn - b.turn || a.seq - b.seq);
  return steps;
}
function teamOpenStream(rid){
  teamCloseStream();
  let pronto;
  const conectado = new Promise(r => { pronto = r; setTimeout(r, 3000); });
  try {
    const es = new EventSource("/api/teams/runs/" + encodeURIComponent(rid) + "/stream");
    _teamES = es;
    const meu = () => state.teamRun && state.teamRun.rid === rid;
    es.addEventListener("open", () => pronto());
    es.addEventListener("step", ev => { if(meu()) trSet({ steps: teamUpsertStep(JSON.parse(ev.data)) }); });
    es.addEventListener("token", ev => {
      if(!meu()) return;
      const d = JSON.parse(ev.data);
      const steps = (state.teamRun.steps || []).slice();
      const i = steps.findIndex(s => s.id === d.id);
      if(i < 0) return;
      steps[i] = Object.assign({}, steps[i], { content: (steps[i].content || "") + (d.text || "") });
      trSet({ steps });
    });
    es.addEventListener("run", ev => { if(meu()){ trSet({ running: JSON.parse(ev.data).status === "running" }); teamRunsLoad(); } });
    es.addEventListener("end", () => { if(meu()){ trSet({ running: false }); teamRunsLoad(); } });
  } catch(err){ pronto(); }
  return conectado;
}
async function teamRunOpen(rid){
  teamCloseStream();
  trSet({ rid, steps: [], running: false, _loadingRun: true });
  try {
    const r = await fetch("/api/teams/runs/" + encodeURIComponent(rid));
    const j = await r.json();
    if(!state.teamRun || state.teamRun.rid !== rid) return;
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    _teamForceScroll = true;
    trSet({ steps: j.steps || [], running: j.run.status === "running", _loadingRun: false });
    await teamOpenStream(rid);
  } catch(err){ trSet({ _loadingRun: false }); alert("Erro: " + err.message); }
}
function teamStartNew(){
  teamCloseStream();
  trSet({ rid: null, steps: [], running: false, _loadingRun: false });
  const i = document.getElementById("team-input"); if(i) i.focus();
}
async function teamSend(text){
  text = (text || "").trim();
  const tr = state.teamRun || {};
  if(!text || tr.running) return;
  let rid = tr.rid;
  try {
    if(!rid){
      const r = await fetch("/api/teams/" + encodeURIComponent(tr.teamId) + "/runs", { method: "POST" });
      const j = await r.json();
      if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
      rid = j.run.id;
      trSet({ rid, steps: [], running: true });
      await teamOpenStream(rid);
    } else {
      trSet({ running: true });
      if(!_teamES) await teamOpenStream(rid);
    }
    _teamForceScroll = true;
    const r2 = await fetch("/api/teams/runs/" + encodeURIComponent(rid) + "/send", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ text }) });
    const j2 = await r2.json().catch(() => ({}));
    if(!r2.ok) throw new Error(j2.error || "HTTP " + r2.status);
    teamRunsLoad();
  } catch(err){ trSet({ running: false }); alert("Erro ao enviar: " + err.message); }
}
function teamSendFromInput(){
  const i = document.getElementById("team-input");
  if(!i || !i.value.trim() || (state.teamRun && state.teamRun.running)) return;
  const v = i.value; i.value = "";
  teamSend(v);
}
async function teamCancel(){
  const rid = state.teamRun && state.teamRun.rid;
  if(!rid) return;
  try { await fetch("/api/teams/runs/" + encodeURIComponent(rid) + "/cancel", { method: "POST" }); } catch(err){}
}
async function teamRunDelete(rid){
  if(!confirm("Excluir esta execução? O histórico e as entregas dela serão apagados.")) return;
  try {
    const r = await fetch("/api/teams/runs/" + encodeURIComponent(rid), { method: "DELETE" });
    if(!r.ok) throw new Error((await r.json()).error || "HTTP " + r.status);
    if(state.teamRun && state.teamRun.rid === rid){ teamCloseStream(); trSet({ rid: null, steps: [], running: false }); }
    teamRunsLoad();
  } catch(err){ alert("Erro: " + err.message); }
}
async function teamShare(id, el){
  const link = location.origin + location.pathname + "#/equipe/" + id;
  try { await navigator.clipboard.writeText(link); }
  catch(err){ prompt("Copie o link da equipe:", link); return; }
  const span = el && el.querySelector("span");
  if(span){ const antes = span.textContent; span.textContent = "Link copiado"; setTimeout(() => { span.textContent = antes; cardMenuClose(); }, 1200); }
  else if(el){ el.title = "Link copiado"; el.style.color = "#0F7A68"; setTimeout(() => { el.style.color = ""; el.title = "Copiar link da equipe"; }, 1200); }
}
async function teamDuplicate(id){
  try {
    const r = await fetch("/api/teams/" + encodeURIComponent(id) + "/duplicate", { method: "POST" });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    state.teamsData = null;
    setState({});
  } catch(err){ alert("Erro ao duplicar: " + err.message); }
}
async function teamDeleteById(id){
  const t = teamById(id);
  if(!t) return;
  if(!confirm(`Excluir a equipe "${t.name}"? As execuções e entregas dela serão apagadas. Os agentes continuam existindo.`)) return;
  try {
    const r = await fetch("/api/teams/" + encodeURIComponent(id), { method: "DELETE" });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    state.teamsData = null; state.teamForm = null;
    if(state.teamRun && state.teamRun.teamId === id){ teamCloseStream(); state.teamRun = null; }
    setState(["equipe", "criarEquipe"].indexOf(state.screen) >= 0 ? { screen: "equipes", teamId: null, editTeamId: null } : {});
  } catch(err){ alert("Erro: " + err.message); }
}
function teamMenuAction(act, id, el){
  if(act === "share"){ teamShare(id, el); return; }
  cardMenuClose();
  if(act === "edit") setState({ screen: "criarEquipe", editTeamId: id });
  else if(act === "dup") teamDuplicate(id);
  else if(act === "del") teamDeleteById(id);
}

function tfBlank(){ return { id: null, name: "", objective: "", description: "", visibility: "privada", orchestratorPrompt: "", model: "", icebreakers: [""], agentIds: [], _q: "" }; }
function tfFrom(t){
  return { id: t.id, name: t.name, objective: t.objective, description: t.description, visibility: t.visibility, orchestratorPrompt: t.orchestratorPrompt,
    model: t.model || "", icebreakers: t.icebreakers.length ? t.icebreakers.slice() : [""], agentIds: t.agents.filter(a => !a.missing).map(a => a.id), _q: "" };
}
function tfTouch(patch){ state.teamForm = Object.assign({}, state.teamForm, patch || {}); render(); }
function tfNorm(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function tfFilter(){
  const f = state.teamForm; if(!f) return;
  const q = tfNorm(f._q);
  document.querySelectorAll("[data-tf-group]").forEach(g => {
    let vis = 0;
    g.querySelectorAll("[data-tf-agent]").forEach(el => { const ok = !q || el.dataset.busca.indexOf(q) >= 0; el.hidden = !ok; if(ok) vis++; });
    g.hidden = !vis;
  });
}

async function tfSave(){
  const f = state.teamForm; if(!f || f._saving) return;
  const lim = teamLimits();
  if(!f.name.trim()){ alert("Dê um nome à equipe."); return; }
  if(f.agentIds.length < lim.min || f.agentIds.length > lim.max){ alert(`Selecione de ${lim.min} a ${lim.max} agentes.`); return; }
  tfTouch({ _saving: true });
  const body = { name: f.name, objective: f.objective, description: f.description, visibility: f.visibility, orchestratorPrompt: f.orchestratorPrompt,
    model: f.model, icebreakers: f.icebreakers.filter(q => q && q.trim()), agentIds: f.agentIds };
  try {
    const r = await fetch(f.id ? "/api/teams/" + encodeURIComponent(f.id) : "/api/teams", {
      method: f.id ? "PATCH" : "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    state.teamsData = null; state.teamForm = null;
    if(state.teamRun && state.teamRun.teamId === j.team.id) state.teamRun = Object.assign({}, state.teamRun);
    setState({ screen: "equipe", teamId: j.team.id, editTeamId: null });
  } catch(err){ tfTouch({ _saving: false }); alert("Erro ao salvar: " + err.message); }
}

function fmtBytes(n){
  if(!n && n !== 0) return "";
  if(n < 1024) return n + " B";
  if(n < 1024*1024) return (n/1024).toFixed(0) + " KB";
  return (n/1024/1024).toFixed(1).replace(".", ",") + " MB";
}

function afIaScroll(){

async function afIaSend(texto){
  const f = state.agentForm;
  texto = (texto || "").trim();
  if(!f || !texto || f._iaBusy) return;
  afTouch({ _ia: (f._ia || []).concat([{ role: "user", content: texto }]), _iaBusy: true });
  afIaScroll();
  const g = state.agentForm;
  try {
    const r = await fetch("/api/agents/assist", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({
      mode: "build", messages: g._ia,
      draft: { name: g.name, category: g.category, description: g.description, prompt: g.prompt, icebreakers: g.icebreakers.filter(q => q && q.trim()), skills: g.skills } }) });
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    if(!state.agentForm || state.agentForm.id !== g.id || state.screen !== "criarAgente") return; // saiu da tela
    const dr = j.draft || {};
    const atual = state.agentForm;
    afTouch({
      name: dr.name || atual.name, category: dr.category || atual.category, description: dr.description || atual.description,
      prompt: dr.prompt || atual.prompt, icebreakers: (dr.icebreakers && dr.icebreakers.length) ? dr.icebreakers : atual.icebreakers,
      skills: (dr.skills && dr.skills.length) ? dr.skills : atual.skills,
      _ia: atual._ia.concat([{ role: "zeus", content: j.reply || "Pronto, atualizei o rascunho." }]), _iaBusy: false
    });
  } catch(err){
    const atual = state.agentForm;
    if(atual) afTouch({ _ia: (atual._ia || []).concat([{ role: "zeus", content: "Não consegui montar agora (" + err.message + "). Tente de novo em instantes." }]), _iaBusy: false });
  }
  afIaScroll();
  const i = document.getElementById("af-ia-input"); if(i) i.focus();
}
async function afEnrich(el){
  const f = state.agentForm; if(!f || f._enriching) return;
  const ta = document.querySelector('[data-af="prompt"]');
  if(ta) f.prompt = ta.value;
  if(!(f.prompt || "").trim() && !(f.description || "").trim()){ alert("Escreva um rascunho do prompt (ou o descritivo) antes de enriquecer."); return; }
  f._enriching = true;
  if(el){ el.style.opacity = ".6"; el.querySelector("span").textContent = "Enriquecendo..."; }
  try {
    const r = await fetch("/api/agents/assist", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ mode: "enrich",
      draft: { name: f.name, category: f.category, description: f.description, prompt: f.prompt } }) });
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    afTouch({ prompt: j.prompt, _enriching: false, _promptAntes: f.prompt });
  } catch(err){
    f._enriching = false;
    if(el){ el.style.opacity = ""; el.querySelector("span").textContent = "Enriquecer com o ZEUS"; }
    alert("Não consegui enriquecer: " + err.message);
  }
}

let _acFiles = []; // anexos da próxima mensagem

// ─── Visuais no chat: blocos ```zeus-kpi e ```zeus-grafico viram painel/gráfico ─
const VIZ_SERIES = ["#673DE6", "#C25FD6", "#4A6CF7", "#2B1E8C", "#A78BFA"]; // família do roxo (principal, orquídea, índigo, índigo escuro, lavanda)
const VIZ_FRAME = "border:1px solid #E6E6EA;border-radius:12px;background:#FFFFFF;margin:4px 0 12px;overflow:hidden";
function vizNum(v, un, compact){
  v = Number(v) || 0;
  const abs = Math.abs(v);
  if(compact && abs >= 1e6) return (un === "R$" ? "R$ " : "") + (v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mi" + (un === "%" ? "%" : "");
  if(compact && abs >= 1e3) return (un === "R$" ? "R$ " : "") + (v / 1e3).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" + (un === "%" ? "%" : "");
  if(un === "R$") return "R$ " + v.toLocaleString("pt-BR", compact && Number.isInteger(v) ? { maximumFractionDigits: 0 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if(un === "%") return v.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + "%";
  return v.toLocaleString("pt-BR", { maximumFractionDigits: Number.isInteger(v) ? 0 : 2 });
}
function vizTicks(max){ // eixo com números redondos (até 5 divisões)
  if(!(max > 0)) return { top: 1, ticks: [0, 1] };
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => Math.ceil(max / k) <= 5) || 10 * mag;
  const top = Math.ceil(max / step) * step, ticks = [];
  for(let v = 0; v <= top + step / 1e6; v += step) ticks.push(+v.toFixed(10));
  return { top, ticks };
}
function vizHeader(d, extra){
  if(!d.titulo && !d.periodo) return "";
  return `<div style="display:flex;align-items:baseline;gap:10px;padding:12px 14px 8px"><span style="font-size:13.5px;font-weight:600;flex:1;min-width:0">${e(d.titulo || "")}</span>${d.periodo ? `<span style="font-size:12px;color:#66666F;white-space:nowrap">${e(d.periodo)}</span>` : ""}${extra || ""}</div>`;
}
function vizTable(d){
  const un = d.unidade || "";
  const rows = d.categorias.map((c, i) => `<tr><td style="border:1px solid #E6E6EA;padding:5px 9px">${e(c)}</td>${d.series.map(sr => `<td style="border:1px solid #E6E6EA;padding:5px 9px;text-align:right">${vizNum(sr.valores[i], un)}</td>`).join("")}</tr>`).join("");
  return `<details style="margin:0 14px 10px;font-size:12px"><summary style="cursor:pointer;color:#66666F">Ver tabela</summary><div style="overflow-x:auto;margin-top:6px"><table style="border-collapse:collapse;min-width:60%"><thead><tr><th style="border:1px solid #E6E6EA;padding:5px 9px;text-align:left;background:#F7F7F8"></th>${d.series.map(sr => `<th style="border:1px solid #E6E6EA;padding:5px 9px;text-align:right;background:#F7F7F8">${e(sr.nome || "")}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></details>`;
}
function vizKpi(d){
  const itens = Array.isArray(d.itens) ? d.itens.slice(0, 12) : [];
  if(!itens.length) return null;
  const tile = it => {
    const dl = it.delta != null ? String(it.delta).trim() : "";
    const neg = /^[-−↓▼]/.test(dl), pos = /^[+↑▲]/.test(dl);
    const dlHtml = dl ? `<div style="margin-top:4px;font-size:11.5px;color:${neg ? "#B42318" : pos ? "#067647" : "#66666F"}">${neg ? "▼ " : pos ? "▲ " : ""}${e(dl.replace(/^[+\-−↑↓▲▼]\s*/, ""))}</div>` : "";
    return `<div style="background:#FFFFFF;padding:11px 14px 12px;min-width:0"><div style="font-size:11.5px;color:#66666F;margin-bottom:3px">${e(it.rotulo || "")}</div><div style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e(it.valor != null ? it.valor : "")}</div>${dlHtml}</div>`;
  };
  return `<div class="zviz" style="${VIZ_FRAME}">${vizHeader(d)}<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:#E6E6EA;border-top:1px solid #E6E6EA">${itens.map(tile).join("")}</div></div>`;
}
function vizLegend(d){
  if(d.series.length < 2) return "";
  return `<div style="display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 14px 6px;font-size:12px;color:#3C3C44">${d.series.map((sr, k) => `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:${VIZ_SERIES[k]}"></span>${e(sr.nome || "Série " + (k + 1))}</span>`).join("")}</div>`;
}
function vizChart(d){
  d.tipo = String(d.tipo || "barras").toLowerCase();
  d.categorias = (Array.isArray(d.categorias) ? d.categorias : []).slice(0, 40).map(c => String(c));
  d.series = (Array.isArray(d.series) ? d.series : []).slice(0, VIZ_SERIES.length).map(sr => ({ nome: sr && sr.nome, valores: d.categorias.map((_, i) => Number(sr && sr.valores && sr.valores[i]) || 0) }));
  if(!d.categorias.length || !d.series.length) return null;
  const un = d.unidade || "";
  const max = Math.max(0, ...d.series.flatMap(sr => sr.valores));
  const { top, ticks } = vizTicks(max);
  const n = d.categorias.length, S = d.series.length;
  const W = 640, tip = (c, sr, v) => `<title>${e(c)}${S > 1 ? " · " + e(sr.nome || "") : ""}: ${vizNum(v, un)}</title>`;
  let svg;
  if(d.tipo === "ranking" || d.tipo === "barras-h"){
    const rowH = S > 1 ? 14 * S + 12 : 26, labW = 150, H = n * rowH + 12, plotW = W - labW - 90;
    const bars = d.categorias.map((c, i) => d.series.map((sr, k) => {
      const v = sr.valores[i], w = top ? Math.max(0, v / top * plotW) : 0, y = 6 + i * rowH + (S > 1 ? 4 + k * 14 : 4), h = S > 1 ? 12 : 18, r = Math.min(4, w / 2);
      return `<g>${tip(c, sr, v)}<path d="M${labW},${y} h${Math.max(0, w - r)} a${r},${r} 0 0 1 ${r},${r} v${h - 2 * r} a${r},${r} 0 0 1 -${r},${r} h-${Math.max(0, w - r)} z" fill="${VIZ_SERIES[k]}"/>${k === 0 ? `<text x="${labW - 8}" y="${6 + i * rowH + rowH / 2 + 4}" text-anchor="end" font-size="11.5" fill="#3C3C44">${e(c.length > 24 ? c.slice(0, 23) + "…" : c)}</text>` : ""}<text x="${labW + w + 6}" y="${y + h / 2 + 4}" font-size="11" fill="#17171A">${vizNum(v, un, true)}</text></g>`;
    }).join("")).join("");
    svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;font-family:inherit">${bars}</svg>`;
  } else {
    const H = 230, mL = 64, mR = d.tipo === "linhas" ? 72 : 16, mT = 14, mB = 34, plotW = W - mL - mR, plotH = H - mT - mB;
    const yOf = v => mT + plotH - (top ? v / top * plotH : 0);
    const grid = ticks.map(v => `<line x1="${mL}" x2="${W - mR}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="#E6E6EA" stroke-width="1"/><text x="${mL - 8}" y="${yOf(v) + 4}" text-anchor="end" font-size="10.5" fill="#66666F">${vizNum(v, un, true)}</text>`).join("");
    const every = Math.ceil(n / 8), band = plotW / n;
    const xLab = d.categorias.map((c, i) => i % every ? "" : `<text x="${mL + band * (i + 0.5)}" y="${H - mB + 16}" text-anchor="middle" font-size="10.5" fill="#66666F">${e(c.length > 12 ? c.slice(0, 11) + "…" : c)}</text>`).join("");
    let marks;
    if(d.tipo === "linhas"){
      const xOf = i => mL + band * (i + 0.5);
      marks = d.series.map((sr, k) => {
        const pts = sr.valores.map((v, i) => [xOf(i), yOf(v)]);
        const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
        const last = pts[pts.length - 1], lv = sr.valores[sr.valores.length - 1];
        const dots = pts.map((p, i) => {
          const fim = i === pts.length - 1;
          const vis = n <= 16 || fim ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${VIZ_SERIES[k]}" stroke="#FFFFFF" stroke-width="2"/>` : "";
          return `<g>${tip(d.categorias[i], sr, sr.valores[i])}<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${Math.max(8, band / 2).toFixed(1)}" fill="transparent"/>${vis}</g>`;
        }).join("");
        return `<g><path d="${path}" fill="none" stroke="${VIZ_SERIES[k]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text x="${(last[0] + 8).toFixed(1)}" y="${(last[1] + 4).toFixed(1)}" font-size="11" fill="#17171A">${vizNum(lv, un, true)}</text></g>`;
      }).join("");
    } else {
      const bw = Math.min(24, Math.max(4, (band * 0.72 - 2 * (S - 1)) / S));
      const label = n * S <= 14;
      marks = d.categorias.map((c, i) => d.series.map((sr, k) => {
        const v = sr.valores[i], x = mL + band * (i + 0.5) - (S * bw + 2 * (S - 1)) / 2 + k * (bw + 2), y = yOf(v), h = mT + plotH - y, r = Math.min(4, h / 2, bw / 2);
        return `<g>${tip(c, sr, v)}<path d="M${x.toFixed(1)},${(mT + plotH).toFixed(1)} v-${Math.max(0, h - r).toFixed(1)} a${r},${r} 0 0 1 ${r},-${r} h${(bw - 2 * r).toFixed(1)} a${r},${r} 0 0 1 ${r},${r} v${Math.max(0, h - r).toFixed(1)} z" fill="${VIZ_SERIES[k]}"/>${label ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#17171A">${vizNum(v, un, true)}</text>` : ""}</g>`;
      }).join("")).join("");
    }
    svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;font-family:inherit">${grid}<line x1="${mL}" x2="${W - mR}" y1="${mT + plotH}" y2="${mT + plotH}" stroke="#DADADF"/>${xLab}${marks}</svg>`;
  }
  return `<div class="zviz" style="${VIZ_FRAME}">${vizHeader(d)}${vizLegend(d)}<div style="padding:4px 10px 6px">${svg}</div>${vizTable(d)}</div>`;
}
function vizHTML(lang, code){
  if(lang === "zeus-pendente") return `<div style="${VIZ_FRAME};padding:14px;font-size:12.5px;color:#66666F">Montando o visual<span style="color:#673DE6">▍</span></div>`;
  let d; try { d = JSON.parse(code); } catch(_) { return null; }
  if(!d || typeof d !== "object") return null;
  try {
    if(lang === "zeus-kpi") return vizKpi(d);
    if(lang === "zeus-grafico" || lang === "zeus-chart") return vizChart(d);
  } catch(_) {}
  return null;
}

function mdToHtml(src){
  const blocks = [];
  let t = String(src || "").replace(/```([\w-]*)\n?([\s\S]*?)```/g, (m, lang, code) => { blocks.push({ lang: lang.toLowerCase(), code: code.replace(/\n$/, "") }); return "\n\u0000" + (blocks.length - 1) + "\u0000\n"; });
  t = t.replace(/```zeus-[\w-]*[\s\S]*$/, () => { blocks.push({ lang: "zeus-pendente", code: "" }); return "\n\u0000" + (blocks.length - 1) + "\u0000\n"; });
  t = e(t);
  const inline = s => s
    .replace(/`([^`\n]+)`/g, '<code style="background:#F1F1F3;border-radius:5px;padding:1px 5px;font-size:12.5px">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = t.split("\n");
  const out = [];
  let i = 0;
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
  while(i < lines.length){
    const l = lines[i];
    const cb = /^\u0000(\d+)\u0000$/.exec(l.trim());
    if(cb){
      const b = blocks[+cb[1]];
      const viz = b.lang.startsWith("zeus-") ? vizHTML(b.lang, b.code) : null;
      out.push(viz || `<pre style="background:#17171A;color:#F1F1F3;border-radius:10px;padding:12px 14px;overflow-x:auto;font-size:12.5px;line-height:1.5;margin:0 0 10px"><code>${e(b.code)}</code></pre>`);
      i++; continue;
    }
    const hd = /^(#{1,6})\s+(.*)$/.exec(l);
    if(hd){ const sz = [18, 16, 15, 14, 13.5, 13.5][hd[1].length - 1]; out.push(`<div style="font-family:'Space Grotesk',sans-serif;font-size:${sz}px;font-weight:600;margin:12px 0 6px">${inline(hd[2])}</div>`); i++; continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ out.push('<hr style="border:0;border-top:1px solid #E6E6EA;margin:12px 0">'); i++; continue; }
    if(l.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])){
      const head = cells(l); i += 2; const rows = [];
      while(i < lines.length && lines[i].includes("|") && lines[i].trim()){ rows.push(cells(lines[i])); i++; }
      out.push(`<div style="overflow-x:auto;margin:0 0 10px"><table style="border-collapse:collapse;font-size:12.5px;min-width:100%"><thead><tr>${head.map(c => `<th style="border:1px solid #E6E6EA;padding:7px 10px;text-align:left;background:#F7F7F8;font-weight:600">${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td style="border:1px solid #E6E6EA;padding:7px 10px;vertical-align:top">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if(/^\s*&gt;\s?/.test(l)){
      const q = [];
      while(i < lines.length && /^\s*&gt;\s?/.test(lines[i])){ q.push(inline(lines[i].replace(/^\s*&gt;\s?/, ""))); i++; }
      out.push(`<blockquote style="margin:0 0 10px;padding:9px 14px;border-left:3px solid rgba(103,61,230,0.5);background:rgba(103,61,230,0.05);border-radius:0 8px 8px 0">${q.join("<br>")}</blockquote>`);
      continue;
    }
    if(/^\s*[-*•]\s+/.test(l)){
      const items = [];
      while(i < lines.length && /^\s*[-*•]\s+/.test(lines[i])){ items.push(inline(lines[i].replace(/^\s*[-*•]\s+/, ""))); i++; }
      out.push(`<ul style="margin:0 0 10px;padding-left:20px">${items.map(x => `<li style="margin:3px 0">${x}</li>`).join("")}</ul>`);
      continue;
    }
    if(/^\s*\d+[.)]\s+/.test(l)){
      const items = [];
      while(i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ items.push(inline(lines[i].replace(/^\s*\d+[.)]\s+/, ""))); i++; }
      out.push(`<ol style="margin:0 0 10px;padding-left:22px">${items.map(x => `<li style="margin:3px 0">${x}</li>`).join("")}</ol>`);
      continue;
    }
    if(!l.trim()){ i++; continue; }
    const para = [];
    while(i < lines.length && lines[i].trim() && !/^(#{1,6})\s|^\s*[-*•]\s+|^\s*\d+[.)]\s+|^&gt;|^\u0000\d+\u0000$/.test(lines[i].trim()) && !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))){ para.push(inline(lines[i])); i++; }
    if(para.length) out.push(`<p style="margin:0 0 10px">${para.join("<br>")}</p>`);
    else i++;
  }
  return out.join("");
}

function agentSessHTML(chat){

// Durante o streaming só o miolo muda: não recria o campo (preserva o que está sendo digitado).
// Trocar de tela inicial pra conversa muda a estrutura: aí redesenha o miolo inteiro.
function syncAgentChat(){
  const a = state.agentDetail;
  const main = document.getElementById("ag-main");
  if(!a || !main) return;
  const chat = state.chat || {};
  const streaming = !!chat.streaming;
  const vazio = agentChatVazio(chat);
  if(main.dataset.vazio !== String(vazio)){
    const antes = document.getElementById("ac-input");
    const digitado = antes ? antes.value : "";
    main.dataset.vazio = String(vazio);
    main.innerHTML = agentMainHTML(a, chat);
    const depois = document.getElementById("ac-input");
    if(depois && digitado) depois.value = digitado;
    const sc = document.getElementById("chat-scroll");
    if(sc) sc.scrollTop = sc.scrollHeight;
  } else if(!vazio){
    const sc = document.getElementById("chat-scroll");
    if(sc && sc.firstElementChild) sc.firstElementChild.innerHTML = agentMsgsHTML(a, chat);
  }
  const st = document.getElementById("ag-status");
  if(st){
    st.style.color = streaming ? "#673DE6" : "#0F7A68";
    st.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>${streaming ? "Pensando..." : "Pronto"}`;
  }
  const btn = document.getElementById("ac-send");
  if(btn){
    btn.disabled = streaming;
    btn.style.background = streaming ? "#B4B4BC" : "#673DE6";
    btn.style.cursor = streaming ? "not-allowed" : "pointer";
  }
  const lista = document.getElementById("ag-sess-list");
  if(lista){
    const assinatura = (chat.sessions || []).map(s => s.id + ":" + (s.title || "")).join("|") + "#" + (chat.sid || "");
    if(lista.dataset.assinatura !== assinatura){
      lista.dataset.assinatura = assinatura;
      lista.innerHTML = agentSessHTML(chat);
    }
  }
  attach();
}

let _agentsLoading = false, _agentDetailLoading = null, _afLoading = null;
async function agentsLoad(){

async function agentLoadDetail(id){

    const j = await r.json();
    if(state.agentId === id) state.agentDetail = r.ok ? j.agent : { id, _error: j.error || "Agente não encontrado." };
  } catch(err){ if(state.agentId === id) state.agentDetail = { id, _error: "Falha ao carregar agente: " + err.message }; }

async function agentSetWorkspace(id, val){
  try {
    const r = await fetch("/api/agents/" + encodeURIComponent(id), { method: "PATCH", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ inWorkspace: val }) });
    if(!r.ok) throw new Error((await r.json()).error || "HTTP " + r.status);
    const j = await r.json();
    const list = agentsList().map(a => a.id === id ? Object.assign({}, a, { inWorkspace: j.agent.inWorkspace }) : a);
    state.agentsData = Object.assign({}, state.agentsData, { agents: list });
    render();
  } catch(err){ alert("Erro: " + err.message); }
}

const CARD_SEL = "[data-agent-card],[data-team-card]", POP_SEL = "[data-agent-pop],[data-team-pop],[data-tr-pop],[data-home-pop]";
function cardMenuClose(){
  document.querySelectorAll(POP_SEL).forEach(p => {

}
function cardMenuToggle(id, kebab){

async function agentShare(id, el){

async function agentDuplicate(id){
  try {
    const r = await fetch("/api/agents/" + encodeURIComponent(id));
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    const a = j.agent;
    const body = { name: (a.name + " (cópia)").slice(0, 120), category: a.category, description: a.description, prompt: a.prompt,
      icebreakers: a.icebreakers, skills: a.skills, model: a.model };
    const r2 = await fetch("/api/agents", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const j2 = await r2.json();
    if(!r2.ok) throw new Error(j2.error || "HTTP " + r2.status);
    const novoId = j2.agent.id;
    if(a.inWorkspace){
      await fetch("/api/agents/" + encodeURIComponent(novoId), { method: "PATCH", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ inWorkspace: true }) });
    }
    // Copia os arquivos de conhecimento (baixa do original e sobe no novo)
    if(a.files && a.files.length){
      try {
        const files = await Promise.all(a.files.map(async f => {
          const rf = await fetch("/api/agents/" + encodeURIComponent(id) + "/files/" + encodeURIComponent(f.id));
          if(!rf.ok) throw new Error("HTTP " + rf.status);
          return new File([await rf.blob()], f.name, { type: f.mime || "application/octet-stream" });
        }));
        await afUpload(novoId, files);
      } catch(err){ alert("Agente duplicado, mas os arquivos de conhecimento não foram copiados: " + err.message); }
    }
    state.agentsData = null; state.agentDetail = null;
    setState({ agentsTab: state.agentsTab === "empresa" ? "meus" : state.agentsTab });
  } catch(err){ alert("Erro ao duplicar: " + err.message); }
}
async function agentDeleteById(id){
  const a = agentsList().find(x => x.id === id);
  if(!a) return;
  if(!confirm(`Excluir o agente "${a.name}"? As conversas dele deixam de aparecer e os arquivos de conhecimento são apagados.`)) return;
  try {
    const r = await fetch("/api/agents/" + encodeURIComponent(id), { method: "DELETE" });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    state.agentsData = null; state.agentDetail = null;
    setState({});
  } catch(err){ alert("Erro: " + err.message); }
}
function agentMenuAction(act, id, el){
  const a = agentsList().find(x => x.id === id);
  if(act === "share"){ agentShare(id, el); return; }

let _kbLoading = false, _kbSearchSeq = 0, _kbTypeT = null;
async function kbLoad(){
  if(_kbLoading) return;
  _kbLoading = true;
  try {
    const r = await fetch("/api/knowledge");
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    const prev = state.kb || {};
    state.kb = { docs: j.docs, stats: j.stats, scopes: j.scopes, filters: prev.filters || {}, hits: prev.hits || null, error: null };
  } catch(err){ state.kb = Object.assign({}, state.kb || {}, { error: "Falha ao carregar a base: " + err.message }); }
  _kbLoading = false;
  render();
  // Enquanto tiver documento na fila, atualiza sozinho
  if(state.screen === "conhecimento" && state.kb && state.kb.stats && state.kb.stats.pending) setTimeout(() => { if(state.screen === "conhecimento") kbLoad(); }, 2500);
}
function kbSetFilter(k, v){
  const kb = state.kb || { filters: {} };
  kb.filters = Object.assign({}, kb.filters || {}); kb.filters[k] = v;
  if(k === "q" && !v) kb.hits = null;
  state.kb = Object.assign({}, kb); render();
}
async function kbSearch(q){
  const seq = ++_kbSearchSeq;
  if(!q.trim()){ kbSetFilter("q", ""); return; }
  try {
    const r = await fetch("/api/knowledge/search?q=" + encodeURIComponent(q) + "&limit=20");
    const j = await r.json();
    if(seq !== _kbSearchSeq) return;
    const kb = state.kb || { filters: {} };
    kb.filters = Object.assign({}, kb.filters || {}, { q }); kb.hits = j.hits || [];
    state.kb = Object.assign({}, kb); render();
  } catch(err){ alert("Erro na busca: " + err.message); }
}
async function kbUpload(files, extra){
  files = Array.from(files || []).filter(Boolean);
  if(!files.length) return;
  state.kbUploading = true; render();
  const fd = new FormData();
  files.forEach(x => fd.append("files", x));
  Object.entries(extra || {}).forEach(([k, v]) => { if(v !== undefined && v !== null) fd.append(k, v); });
  try {
    const r = await fetch("/api/knowledge", { method: "POST", body: fd });
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.error || "falha no upload (HTTP " + r.status + ")");

  if(!linha || linha.contains(document.getElementById(inputId)) || !window.MediaRecorder || !navigator.mediaDevices){ teamMic(btn, inputId); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(err){ alert("Permita o uso do microfone no navegador para gravar."); return; }
  const tipos = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
  const tipo = tipos.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  const mr = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined);
  const pedacos = [];
  mr.ondataavailable = ev => { if(ev.data && ev.data.size) pedacos.push(ev.data); };
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = Ctx ? new Ctx() : null;
  let an = null, dados = null;
  if(ctx){ an = ctx.createAnalyser(); an.fftSize = 256; ctx.createMediaStreamSource(stream).connect(an); dados = new Uint8Array(an.frequencyBinCount); }
  const bar = document.createElement("div");
  bar.className = "mic-bar";
  bar.innerHTML = `<span class="mic-dot"></span><span class="mic-levels">${"<i></i>".repeat(6)}</span><strong class="mic-time">00:00</strong><span class="mic-status">Gravando...</span><span style="flex:1"></span>
    <span data-mic-cancel title="Cancelar gravação" class="mic-btn">${icon(ICONS.x, 15, "#66666F")}</span>
    <span data-mic-ok title="Concluir e transcrever" class="mic-ok">${icon(ICONS.check, 15, "#FFFFFF")}</span>`;
  const displayAntes = linha.style.display; // a linha pode ter display:flex inline (composer da home e de Conversas)
  linha.style.display = "none";
  linha.after(bar);
  const barras = bar.querySelectorAll(".mic-levels i"), relogio = bar.querySelector(".mic-time");
  const t0 = Date.now();
  let raf = 0;
  const tick = () => {
    const seg = Math.floor((Date.now() - t0) / 1000);
    relogio.textContent = String(Math.floor(seg / 60)).padStart(2, "0") + ":" + String(seg % 60).padStart(2, "0");
    if(an){
      an.getByteFrequencyData(dados);
      barras.forEach((b, i) => {
        const ini = Math.floor(i * dados.length / 12), fim = Math.floor((i + 1) * dados.length / 12);
        let soma = 0; for(let k = ini; k < fim; k++) soma += dados[k];
        const v = soma / Math.max(1, fim - ini) / 255;
        b.style.height = Math.max(3, Math.round(3 + v * 17)) + "px";
      });
    }
    if(seg >= 180) concluir(); // limite de 3 minutos por gravação
    raf = requestAnimationFrame(tick);
  };
  tick();
  mr.start(250);
  const encerrar = () => { cancelAnimationFrame(raf); stream.getTracks().forEach(t => t.stop()); if(ctx) ctx.close().catch(() => {}); };
  const restaurar = () => { bar.remove(); linha.style.display = displayAntes; _micRec = null; };
  const cancelar = ev => { if(ev) ev.stopPropagation(); mr.onstop = null; try { mr.stop(); } catch(err){} encerrar(); restaurar(); };
  let concluindo = false;
  function concluir(ev){
    if(ev) ev.stopPropagation();
    if(concluindo) return; concluindo = true;
    cancelAnimationFrame(raf);
    bar.querySelector(".mic-status").textContent = "Transcrevendo...";
    bar.querySelector(".mic-dot").style.animation = "none"; bar.querySelector(".mic-dot").style.background = "#673DE6";
    bar.querySelector("[data-mic-ok]").style.opacity = ".5";
    mr.onstop = async () => {
      encerrar();
      const blob = new Blob(pedacos, { type: mr.mimeType || "audio/webm" });
      const ext = /mp4/.test(blob.type) ? "m4a" : /ogg/.test(blob.type) ? "ogg" : "webm";
      try {
        if(blob.size < 1200) throw new Error("gravação muito curta");
        const fd = new FormData(); fd.append("audio", blob, "voz." + ext);
        const r = await fetch("/api/chat/transcribe", { method: "POST", body: fd });
        const j = await r.json().catch(() => ({}));
        if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
        const inp = document.getElementById(inputId);
        if(inp && j.text){ inp.value = (inp.value.trim() ? inp.value.replace(/\s*$/, " ") : "") + j.text; inp.dispatchEvent(new Event("input", { bubbles: true })); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        else if(!j.text) cfgToast("Não entendi o áudio. Tente de novo mais perto do microfone.", true);
      } catch(err){ cfgToast("Não consegui transcrever: " + err.message, true); }
      restaurar();
    };
    try { mr.stop(); } catch(err){ encerrar(); restaurar(); }
  }
  bar.querySelector("[data-mic-cancel]").addEventListener("click", cancelar);
  bar.querySelector("[data-mic-ok]").addEventListener("click", concluir);
  _micRec = { cancelar };
}

function wzFecharStream(){ if(_wzES){ try { _wzES.close(); } catch(err){} _wzES = null; } }
function wzAbrirStream(sid){
  wzFecharStream();
  return new Promise(resolve => {
    const es = new EventSource("/api/chat/sessions/" + encodeURIComponent(sid) + "/stream");
    _wzES = es; setTimeout(resolve, 2500);
    es.addEventListener("open", () => resolve());
    const c = () => wz();
    es.addEventListener("user_msg", ev => { const d = JSON.parse(ev.data); c().messages.push({ role: "user", content: d.content }); wzSync(); });
    es.addEventListener("zeus_start", () => { c().messages.push({ role: "zeus", content: "" }); c().streaming = true; wzSync(); });
    es.addEventListener("token", ev => { const d = JSON.parse(ev.data); const m = c().messages[c().messages.length - 1]; if(m && m.role === "zeus"){ m.content += d.text || ""; wzSync(); } });
    es.addEventListener("reset", () => { const m = c().messages[c().messages.length - 1]; if(m && m.role === "zeus"){ m.content = ""; wzSync(); } });
    es.addEventListener("done", ev => { const d = JSON.parse(ev.data); const m = c().messages[c().messages.length - 1]; if(m && m.role === "zeus" && d.content) m.content = d.content; c().streaming = false; wzSync(); });
  });
}
async function wzSend(texto){

        ${t.messages.map(m => `<div style="padding:10px 12px;border-radius:12px;background:${m.author === "Suporte ZEUS" ? "rgba(74,108,247,0.06)" : "#F7F7F8"};border:1px solid #EFEFF1"><div style="display:flex;font-size:11.5px;color:#66666F;margin-bottom:4px"><strong style="color:#17171A">${e(m.author)}</strong><span style="margin-left:auto">${new Date(m.createdAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span></div><div style="font-size:13px;line-height:1.5;white-space:pre-wrap">${e(m.text)}</div></div>`).join("")}
        <form data-w-reply="${e(t.id)}" style="margin:4px 0 0;display:flex;flex-direction:column;gap:8px"><textarea name="text" rows="2" placeholder="Adicionar informação ao chamado" style="${CFG_IN};font-size:13px;resize:vertical"></textarea>
          <div style="display:flex;gap:8px"><span data-w-ticket-status="${t.status === "resolvido" ? "aberto" : "resolvido"}" data-id="${e(t.id)}" style="padding:9px 12px;border:1px solid #DADADF;border-radius:10px;font-size:12.5px;cursor:pointer">${t.status === "resolvido" ? "Reabrir" : "Marcar como resolvido"}</span><span style="flex:1"></span><button type="submit" style="padding:9px 14px;border-radius:10px;background:#673DE6;color:#FFFFFF;border:0;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer">Enviar</button></div></form>
      </div>`;
  }
  if(!state.wTickets) return `<div style="margin:auto;color:#66666F;font-size:13px">Carregando chamados...</div>`;
  return `<div style="display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid #EFEFF1"><span style="font-size:12px;color:#66666F;flex:1">Seus chamados</span><span data-w-view="novo" style="font-size:12.5px;font-weight:700;color:#673DE6;cursor:pointer">+ Abrir chamado</span></div>
    <div style="flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px">
      ${state.wTickets.length ? state.wTickets.map(t => `<div data-w-view="${e(t.id)}" data-hover-border style="padding:11px 13px;border:1px solid #EFEFF1;border-radius:11px;cursor:pointer">
          <div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:#9A9AA3">#${t.num}</span><span style="font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e(t.subject)}</span>${wBadge(W_TST[t.status] || W_TST.aberto)}</div>
          <div style="font-size:11.5px;color:#66666F;margin-top:4px">${e(W_CAT[t.category] || t.category)} · ${t.msgs} ${t.msgs === 1 ? "mensagem" : "mensagens"} · ${new Date(t.updatedAt).toLocaleDateString("pt-BR")}</div></div>`).join("")
        : `<div style="margin:auto;text-align:center;font-size:12.5px;color:#66666F;line-height:1.55;max-width:280px">Você ainda não tem chamados. Abra um quando precisar da ajuda do suporte.</div>`}
    </div>`;
}

let _lastScreen = null;
let _prev = {};
// Telas que mostram a conversa em si (precisam re-renderizar durante o streaming)
const TELAS_CHAT = ["chat", "motorExec", "agente"];

function mountShell(){
  const root = document.getElementById("root");
  root.innerHTML = '<div id="sidebar-slot" style="display:contents"></div>'
    + '<main id="main-slot" style="flex:1;min-width:0;display:flex;flex-direction:column"></main>'
    + '<div id="widget-slot" style="display:contents"></div>'
    + '<div id="fab-slot" style="display:contents"></div>'
    + '<div id="overlay-slot" style="display:contents"></div>';
}

// Classes de entrada aplicadas só quando algo acabou de aparecer (troca de tela, menu/widget/overlay abrindo),
// pra que re-renders do mesmo estado (streaming do chat, carregamento de dados) não repitam a animação.
function animateEntradas(mainDirty, overlayDirty){
  const add = (el, cls) => { if(el) el.classList.add(cls); };
  if(mainDirty && _prev.screen !== state.screen){
    Array.prototype.forEach.call(document.getElementById("main-slot").children, el => el.classList.add("pg-in"));
  }
  if(state.wsMenuOpen && !_prev.wsMenuOpen) add(document.querySelector("[data-ws-menu]"), "pop-down");
  if(state.userMenuOpen && !_prev.userMenuOpen) add(document.querySelector("[data-user-menu]"), "pop-up");
  if(state.themeMenuOpen && !_prev.themeMenuOpen) add(document.querySelector("[data-theme-menu]"), "pop-side");
  if(state.widgetOpen && !_prev.widgetOpen) add(document.querySelector("[data-widget-panel]"), "widget-in");
  if(overlayDirty && state.chatOverlay && !_prev.chatOverlay) add(document.querySelector("[data-chat-overlay-backdrop]"), "ov-in");
}

// Ripple nos botões principais (dourados) e no FAB. Desenhado numa camada fixa no body,
// recortada no formato do botão, pra sobreviver ao re-render que o próprio clique dispara.
document.addEventListener("pointerdown", ev => {
  const btn = ev.target.closest && ev.target.closest("[data-hover-dark],[data-toggle-widget]");
  if(!btn) return;
  const r = btn.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 2.2;
  const layer = document.createElement("div");
  layer.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;border-radius:${getComputedStyle(btn).borderRadius};overflow:hidden;pointer-events:none;z-index:9999`;
  const s = document.createElement("span");
  s.className = "z-ripple";
  s.style.cssText = `width:${d}px;height:${d}px;left:${ev.clientX - r.left - d/2}px;top:${ev.clientY - r.top - d/2}px`;
  layer.appendChild(s);
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 650);
});

function render(){
  if(!document.getElementById("main-slot")) mountShell();

  // Escopo do chat: conversas gerais do Zeus (agent null) ou de um agente específico
  const escopo = state.screen === "agente" ? (state.agentId || null) : (["chat","motorExec"].indexOf(state.screen) >= 0 ? null : undefined);
  if(escopo !== undefined){
    const atual = state.chat ? (state.chat.agentId || null) : null;
    if(state.chat && atual !== escopo){
      chatCloseStream();
      _acFiles = [];
      state.chat = { agentId: escopo, sessions: [], messages: [], sid: null, streaming: false, _loaded: true };
      setTimeout(chatLoadSessions, 0);
    } else if(!state.chat || !state.chat._loaded){
      state.chat = Object.assign({ agentId: escopo }, state.chat || {}, { _loaded: true });
      setTimeout(chatLoadSessions, 0);
    }
  }

  const sidebarDirty = _prev.collapsed !== state.collapsed
    || _prev.wsMenuOpen !== state.wsMenuOpen
    || _prev.userMenuOpen !== state.userMenuOpen
    || _prev.themeMenuOpen !== state.themeMenuOpen
    || _prev.screen !== state.screen;
  const mainStructDirty = _prev.screen !== state.screen
    || _prev.toolsTab !== state.toolsTab
    || _prev.wa !== state.wa
    || (["agentes","catalogo","criarAgente","agente","criarEquipe","habilidades"].indexOf(state.screen) >= 0 && (_prev.agentsData !== state.agentsData || _prev.agentsError !== state.agentsError))
    || _prev.agentsTab !== state.agentsTab
    || _prev.growth !== state.growth
    || _prev.agentId !== state.agentId
    || _prev.agentDetail !== state.agentDetail
    || _prev.editAgentId !== state.editAgentId
    || _prev.agentForm !== state.agentForm
    || _prev.agentFormError !== state.agentFormError
    || (["equipes","equipe","criarEquipe","agentes"].indexOf(state.screen) >= 0 && (_prev.teamsData !== state.teamsData || _prev.teamsError !== state.teamsError))
    || (state.screen === "equipe" && _prev.teamId !== state.teamId)
    || _prev.toolId !== state.toolId || _prev.appId !== state.appId || _prev.toolView !== state.toolView
    || (["config","empresa","permissoes"].indexOf(state.screen) >= 0 && (_prev.cfg !== state.cfg || _prev.cfgSec !== state.cfgSec || _prev.cfgTab !== state.cfgTab || _prev.cfgError !== state.cfgError || _prev.agentsData !== state.agentsData))
    || (["pdi","pdiEquipe","pdiEvolucao","pdiTemplates","pdiNovo","pdiVer","pdiIA"].indexOf(state.screen) >= 0 && (_prev.pdiIA !== state.pdiIA || _prev.pdiData !== state.pdiData || _prev.pdiDetail !== state.pdiDetail || _prev.pdiTpls !== state.pdiTpls || _prev.pdiAn !== state.pdiAn || _prev.pdiId !== state.pdiId || _prev.pdiError !== state.pdiError))
    || (state.screen === "criarEquipe" && (_prev.teamForm !== state.teamForm || _prev.editTeamId !== state.editTeamId))
    || (state.screen === "conhecimento" && (_prev.kb !== state.kb || _prev.kbUploading !== state.kbUploading));
  const chatDirty = TELAS_CHAT.indexOf(state.screen) >= 0 && _prev.chat !== state.chat;
  const mainDirty = mainStructDirty || (chatDirty && state.screen !== "agente");
  const agentChatSync = !mainStructDirty && chatDirty && state.screen === "agente";
  const teamSync = !mainStructDirty && state.screen === "equipe" && _prev.teamRun !== state.teamRun;
  const widgetDirty = _prev.widgetOpen !== state.widgetOpen || (state.widgetOpen && _prev.widgetTab !== state.widgetTab);
  const fabDirty = _prev.widgetOpen !== state.widgetOpen || _prev.screen !== state.screen;
  const overlayDirty = _prev.chatOverlay !== state.chatOverlay
    || (state.chatOverlay && _prev.chatOverlayHist !== state.chatOverlayHist);

  if(sidebarDirty) document.getElementById("sidebar-slot").innerHTML = sidebar();
  if(mainDirty) document.getElementById("main-slot").innerHTML = (RENDERERS[state.screen] || renderHome)();
  if(widgetDirty){
    document.getElementById("widget-slot").innerHTML = widget();
    if(state.widgetOpen){
      const tab = state.widgetTab || "zeus";
      if(tab === "acoes" && !state.wTasks) setTimeout(wTasksLoad, 0);
      if(tab === "suporte" && !state.wTickets) setTimeout(wTicketsLoad, 0);
      const m = document.getElementById("wz-msgs"); if(m) m.scrollTop = m.scrollHeight;
    }
  }
  if(fabDirty) document.getElementById("fab-slot").innerHTML = fab();
  if(overlayDirty) document.getElementById("overlay-slot").innerHTML = state.chatOverlay ? renderChatOverlay() : "";

  animateEntradas(mainDirty, overlayDirty);

  if(sidebarDirty || mainDirty || widgetDirty || fabDirty || overlayDirty) attach();
  if(agentChatSync) syncAgentChat();
  if(teamSync) syncTeam();

  if(state.chatOverlay){
    if(overlayDirty){
      const oi = document.getElementById("chat-overlay-input");
      if(oi) oi.focus();
    } else if(_prev.chat !== state.chat){
      syncChatOverlay();
    }
  }

  if(state.screen === "home" && (_lastScreen !== "home" || !state.dia) && !_diaLoading){ setTimeout(diaLoad, 0); diaAuto(); }
  if(state.screen === "waConnector" && _lastScreen !== "waConnector" && (!state.wa || state.wa.loading !== false)){
    setTimeout(waLoad, 0);
  }
  const emTelaChat = TELAS_CHAT.indexOf(state.screen) >= 0;
  const vinhaDeTelaChat = TELAS_CHAT.indexOf(_lastScreen) >= 0;

  // Carregamentos das telas de agentes
  if(["agentes","catalogo","criarAgente","agente","criarEquipe","habilidades"].indexOf(state.screen) >= 0 && !state.agentsData && !_agentsLoading){
    setTimeout(agentsLoad, 0);
  }
  if(state.screen === "agente" && state.agentId && (!state.agentDetail || state.agentDetail.id !== state.agentId) && _agentDetailLoading !== state.agentId){
    _agentDetailLoading = state.agentId;
    const alvo = state.agentId;
    setTimeout(() => agentLoadDetail(alvo), 0);
  }
  if(state.screen === "criarAgente"){
    const quer = state.editAgentId || null;
    if(quer && (!state.agentForm || state.agentForm.id !== quer) && _afLoading !== quer){
      _afLoading = quer;
      setTimeout(() => afLoad(quer), 0);
    } else if(!quer && (!state.agentForm || state.agentForm.id)){
      _afPending = [];
      setTimeout(() => { if(state.screen === "criarAgente" && !state.editAgentId){ state.agentForm = afBlank(); render(); } }, 0);
    }
  }
  // Base de conhecimento
  if(state.screen === "conhecimento" && (!state.kb || _lastScreen !== "conhecimento") && !_kbLoading) setTimeout(kbLoad, 0);
  // Configurações
  if(["config","empresa","permissoes"].indexOf(state.screen) >= 0){
    if(!state.cfg && !_cfgLoading) setTimeout(cfgLoad, 0);
    if(state.screen !== "config") setTimeout(() => { if(state.screen === "empresa" || state.screen === "permissoes") setState({ screen: "config", cfgSec: state.screen === "empresa" ? "dados" : "permissoes" }); }, 0);
    if(state.cfgSec === "agentes" && !state.agentsData && !_agentsLoading) setTimeout(agentsLoad, 0);
  }
  // PDI
  if(["pdi","pdiEquipe","pdiNovo","pdiIA"].indexOf(state.screen) >= 0 && !state.pdiData && !_pdiLoading) setTimeout(pdiLoad, 0);
  if(["pdi","pdiVer","pdiNovo","pdiTemplates"].indexOf(state.screen) >= 0 && !state.pdiTpls && !_pdiTplLoading) setTimeout(pdiLoadTpls, 0);
  if(state.screen === "pdiEvolucao" && !state.pdiAn && !_pdiAnLoading) setTimeout(pdiLoadAn, 0);
  {
    let alvoPdi = null;
    if(state.screen === "pdiVer") alvoPdi = state.pdiId;
    if(state.screen === "pdi" && state.pdiData){ const at = pdiMeuAtual(); alvoPdi = at ? at.id : null; }
    if(alvoPdi && (!state.pdiDetail || state.pdiDetail.id !== alvoPdi) && _pdiDetLoading !== alvoPdi){ _pdiDetLoading = alvoPdi; setTimeout(() => pdiLoadDetail(alvoPdi), 0); }
  }
  // Equipes de agentes
  if(["equipes","equipe","criarEquipe","agentes"].indexOf(state.screen) >= 0 && !state.teamsData && !_teamsLoading){
    setTimeout(teamsLoad, 0);
  }
  if(state.screen === "equipe" && state.teamId && (!state.teamRun || state.teamRun.teamId !== state.teamId)){
    state.teamRun = { teamId: state.teamId, runs: [], rid: null, steps: [], running: false };
    const alvo = state.teamId;
    setTimeout(() => teamRunInit(alvo), 0);
  }
  if(state.screen !== "equipe" && _lastScreen === "equipe"){ teamCloseStream(); state.teamRun = null; }
  if(state.screen === "criarEquipe" && state.teamsData){
    const quer = state.editTeamId || null;
    if(quer && (!state.teamForm || state.teamForm.id !== quer)){
      const t = teamById(quer);
      setTimeout(() => { if(state.screen === "criarEquipe" && state.editTeamId === quer){ state.teamForm = t ? tfFrom(t) : null; if(!t) state.teamsError = "Equipe não encontrada."; render(); } }, 0);
    } else if(!quer && (!state.teamForm || state.teamForm.id)){
      setTimeout(() => { if(state.screen === "criarEquipe" && !state.editTeamId){ state.teamForm = tfBlank(); render(); } }, 0);
    }
  }
  if(!emTelaChat && vinhaDeTelaChat && !state.chatOverlay) chatCloseStream();
  homeFxSync();
  _lastScreen = state.screen;
  _prev = Object.assign({}, state);
}

const _boundEls = new WeakMap();
function bindOnce(el, type, fn){
  let tipos = _boundEls.get(el);
  if(!tipos){ tipos = new Set(); _boundEls.set(el, tipos); }
  if(tipos.has(type)) return;
  tipos.add(type);
  el.addEventListener(type, fn);
}

function attach(){
  // Evita listener duplicado quando um slot re-renderiza e os outros não
  
  const root = document.getElementById("root");
  root.querySelectorAll("[data-go]").forEach(el=>{
    bindOnce(el, "click", ev=>{
      ev.stopPropagation();
      const patch = { screen: el.dataset.go, wsMenuOpen:false, userMenuOpen:false };
      if(el.dataset.go === "criarAgente") patch.editAgentId = null;
      setState(patch);
    });
  });
  root.querySelectorAll("[data-toggle-sidebar]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); setState({ collapsed: !state.collapsed }); });
  });
  root.querySelectorAll("[data-toggle-ws]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); setState({ wsMenuOpen: !state.wsMenuOpen, userMenuOpen:false }); });
  });
  root.querySelectorAll("[data-toggle-user]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); setState({ userMenuOpen: !state.userMenuOpen, wsMenuOpen:false }); });
  });
  root.querySelectorAll("[data-toggle-widget]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); setState({ widgetOpen: !state.widgetOpen }); });
  });
  root.querySelectorAll("[data-tools-tab]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); setState({ toolsTab: el.dataset.toolsTab }); });
  });
  root.querySelectorAll("[data-toggle-theme]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); setState({ themeMenuOpen: !state.themeMenuOpen }); });
  });

  // WhatsApp handlers
  root.querySelectorAll("[data-wa-new]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); waSetModal({ step: "name", name: "" }); });
  });
  root.querySelectorAll("[data-wa-refresh]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); waLoad(); });
  });
  root.querySelectorAll("[data-wa-close]").forEach(el=>{

    bindOnce(el, "click", ev=>{ ev.stopPropagation(); waConnect(el.dataset.waConnect); });
  });
  root.querySelectorAll("[data-wa-refresh-qr]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); waConnect(el.dataset.waRefreshQr); });
  });
  root.querySelectorAll("[data-wa-logout]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); waLogout(el.dataset.waLogout); });
  });
  root.querySelectorAll("[data-wa-delete]").forEach(el=>{

  });
  root.querySelectorAll("[data-wa-rename-save]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation();
      const input = document.getElementById("wa-rename-input");
      const friendly = (input && input.value || "").trim();
      if(!friendly) return;
      waRename(el.dataset.waRenameSave, friendly);
    });

  root.querySelectorAll("[data-home-cards-manage]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); hcManagerOpen(); });
  });
  root.querySelectorAll("[data-home-scroll]").forEach(el=>{
    bindOnce(el, "click", ev=>{ ev.stopPropagation(); const alvo = document.getElementById("home-seu-dia"); if(alvo) alvo.scrollIntoView({ behavior: "smooth", block: "start" }); });
  });

    bindOnce(el, "click", ev=>{ ev.stopPropagation(); ev.preventDefault(); navToggle(el.dataset.navToggle, el); });

  // Atalhos da home (Pesquisar / Executar / Criar / Gestão)
  root.querySelectorAll("[data-home-cat]").forEach(el=>{

      ev.stopPropagation();

  root.querySelectorAll("[data-home-tags]").forEach(el=>{
    bindOnce(el, "click", ev=>{
      const x = ev.target.closest("[data-home-tag-del]");

      const f = el.closest("form"), input = f && f.querySelector("[data-home-chat-input],[data-ac-input]"); if(input) input.focus();
    });

function waSetModal(m){ state.wa = Object.assign({}, state.wa || { instances: [] }, { modal: m }); render(); }
function waSetInstances(list, extra){ state.wa = Object.assign({}, state.wa || {}, { instances: list, loading: false, error: null }, extra || {}); render(); }
function waError(msg){ state.wa = Object.assign({}, state.wa || { instances: [] }, { loading: false, error: msg }); render(); }

async function waLoad(){
  state.wa = Object.assign({}, state.wa || {}, { loading: true, error: null }); render();
  try {
    const r = await fetch("/api/wa/instances");
    const j = await r.json();
    waSetInstances(j.instances || []);
  } catch(e){ waError("Falha ao carregar instâncias: " + e.message); }
}
async function waCreate(friendly){
  try {
    const r = await fetch("/api/wa/instances", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ friendly }) });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "criacao_falhou");
    const qr = (j.qr && (j.qr.base64 || j.qr.code)) || null;
    waSetModal({ step: "qr", name: j.name, friendly, qr, state: "aguardando escaneamento..." });
    waPollState(j.name);
    waLoad();
  } catch(e){ alert("Erro ao criar: " + e.message); }
}
async function waConnect(name){
  const cur = (state.wa && state.wa.instances || []).find(i=>i.name===name) || {};
  waSetModal({ step: "qr", name, friendly: cur.friendly || name, qr: null, state: "gerando QR..." });
  try {
    const r = await fetch("/api/wa/instances/"+encodeURIComponent(name)+"/qr");
    const j = await r.json();
    const qr = (j.base64 || j.code || (j.qrcode && (j.qrcode.base64 || j.qrcode.code))) || null;
    waSetModal({ step: "qr", name, friendly: cur.friendly || name, qr, state: "aguardando escaneamento..." });
    waPollState(name);
  } catch(e){ alert("Erro ao gerar QR: " + e.message); }
}

// ─── Chat (Copiloto ZEUS) ────────────────────────────────────────────────────
let _chatES = null;
function chatSet(patch){
  state.chat = Object.assign({}, state.chat || { sessions: [], messages: [] }, patch);
  render();
  const s = document.getElementById("chat-scroll");
  if(s) s.scrollTop = s.scrollHeight;
}
async function chatLoadSessions(){
  const agentId = (state.chat && state.chat.agentId) || null;
  try {
    const r = await fetch("/api/chat/sessions" + (agentId ? "?agent=" + encodeURIComponent(agentId) : ""));
    const j = await r.json();
    if(((state.chat && state.chat.agentId) || null) !== agentId) return; // trocou de agente no meio
    chatSet({ sessions: j.sessions || [] });
  } catch(e){}
}
async function chatOpen(sid){
  chatCloseStream();
  chatSet({ sid, messages: [], streaming: false });
  try {
    const r = await fetch("/api/chat/sessions/"+encodeURIComponent(sid)+"/messages");
    const j = await r.json();
    if(!state.chat || state.chat.sid !== sid) return;
    chatSet({ messages: (j.messages || []).map(m => ({ role: m.role, content: m.content || "", status: m.status, attachments: m.attachments || [] })) });
    chatOpenStream(sid);
  } catch(e){}
}
// Resolve quando o SSE conecta (ou após 3s): mandar mensagem antes disso perde os eventos
function chatOpenStream(sid){
  chatCloseStream();
  let pronto;
  const conectado = new Promise(r => { pronto = r; setTimeout(r, 3000); });
  try {
    const es = new EventSource("/api/chat/sessions/"+encodeURIComponent(sid)+"/stream");
    _chatES = es;
    es.addEventListener("open", () => pronto());
    es.addEventListener("user_msg", ev => {
      const d = JSON.parse(ev.data);
      const msgs = (state.chat.messages || []).concat([{ role:"user", content: d.content, status:"done", attachments: d.attachments || [] }]);
      chatSet({ messages: msgs });
    });
    es.addEventListener("zeus_start", () => {
      const msgs = (state.chat.messages || []).concat([{ role:"zeus", content:"", status:"pending" }]);
      chatSet({ messages: msgs, streaming: true });
    });
    es.addEventListener("token", ev => {
      const d = JSON.parse(ev.data);
      const msgs = (state.chat.messages || []).slice();
      const last = msgs[msgs.length - 1];
      if(last && last.role === "zeus"){ last.content = (last.content || "") + (d.text || ""); last.status = "pending"; last.statusText = null; }
      chatSet({ messages: msgs });
    });
    // O ZEUS está usando uma ferramenta: o texto anterior era narração, some; mostra o que ele está fazendo
    es.addEventListener("reset", () => {
      const msgs = (state.chat.messages || []).slice(); const last = msgs[msgs.length - 1];
      if(last && last.role === "zeus"){ last.content = ""; last.status = "pending"; chatSet({ messages: msgs }); }
    });
    es.addEventListener("status", ev => {
      const d = JSON.parse(ev.data); const msgs = (state.chat.messages || []).slice(); const last = msgs[msgs.length - 1];
      if(last && last.role === "zeus"){ last.statusText = d.text || ""; chatSet({ messages: msgs }); }
    });
    es.addEventListener("done", ev => {
      const msgs = (state.chat.messages || []).slice();
      const last = msgs[msgs.length - 1];
      if(!last || last.role !== "zeus"){ chatSet({ streaming: false }); chatReloadMessages(sid); chatLoadSessions(); return; }
      if(last && last.role === "zeus"){
        try { const d = JSON.parse(ev.data); if(d && d.content) last.content = d.content; } catch{}
        last.status = "done";
      }
      chatSet({ messages: msgs, streaming: false });
      chatLoadSessions();
    });
  } catch(e){ pronto(); }
  return conectado;
}
async function chatReloadMessages(sid){
  try {
    const r = await fetch("/api/chat/sessions/"+encodeURIComponent(sid)+"/messages");
    const j = await r.json();
    if(!state.chat || state.chat.sid !== sid) return;
    chatSet({ messages: (j.messages || []).map(m => ({ role: m.role, content: m.content || "", status: m.status, attachments: m.attachments || [] })) });
  } catch(e){}
}
function chatCloseStream(){
  if(_chatES){ try { _chatES.close(); } catch{} _chatES = null; }
}
async function chatNewSession(){
  chatCloseStream();
  try {
    const agentId = (state.chat && state.chat.agentId) || null;
    const r = await fetch("/api/chat/sessions", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ title: "Nova conversa", agent_id: agentId }) });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || "HTTP " + r.status);
    chatSet({ sid: j.id, messages: [], streaming: false });
    await chatOpenStream(j.id);
    chatLoadSessions();
    return j.id;
  } catch(e){ alert("Erro criando sessão: " + e.message); return null; }
}
async function chatSend(text, files, skill){
  files = files || [];
  if((!text || !text.trim()) && !files.length) return;
  let sid = state.chat && state.chat.sid;
  if(!sid) sid = await chatNewSession();
  if(!sid) return;
  const fd = new FormData();
  fd.append("text", text || "");
  if(skill && skill.id) fd.append("skill", skill.id);
  files.forEach(f => fd.append("files", f));
  if(files.length) chatSet({ streaming: true }); // anexo pesado (áudio/vídeo) demora a processar antes do SSE
  try {
    const r = await fetch("/api/chat/sessions/"+encodeURIComponent(sid)+"/send", { method:"POST", body: fd });
    if(!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(j.error || "HTTP " + r.status); }
  } catch(e){ chatSet({ streaming: false }); alert("Erro enviando: " + e.message); }
}
async function chatDelete(sid){
  if(!confirm("Excluir esta conversa?")) return;
  try {
    await fetch("/api/chat/sessions/"+encodeURIComponent(sid), { method:"DELETE" });
    if(state.chat && state.chat.sid === sid){ chatCloseStream(); chatSet({ sid: null, messages: [], streaming: false }); }
    chatLoadSessions();
  } catch(e){ alert("Erro: " + e.message); }
}
// ─── Chat flutuante (sem sair da tela) ───────────────────────────────────────
function chatBubblesHTML(messages){
  if(!messages || !messages.length){
    return `<div style="margin:auto;text-align:center;color:#66666F;font-size:13px">Mande sua pergunta. Eu leio o contexto da operação e respondo aqui.</div>`;
  }
  return `<div class="chat-col">` + messages.map((m, idx) => {
    const isUser = m.role === "user";
    const isPending = m.status === "pending" && !m.content;
    // Pedido maior (12+ palavras ou anexo): mostra o ZEUS MAX escolhendo a IA enquanto pensa
    const anterior = isPending ? messages.slice(0, idx).reverse().find(x => x.role === "user") : null;
    const escolhendo = !!(anterior && (String(anterior.content || "").trim().split(/\s+/).length >= 12 || (anterior.attachments || []).length));
    const acoes = !isUser && !isPending && m.content ? chatAcoesHTML(idx) : "";
    return `<div class="chat-row" data-role="${isUser ? "user" : "assistant"}">
      <div class="chat-bubble" data-chat-bubble="${idx}">${chatAnexosHTML(m.attachments)}${isPending ? '<span class="zeus-pensando"><i></i><i></i><i></i>Pensando...</span>' + (escolhendo ? zeusEscolhendoHTML() : "") + (m.statusText ? `<div style="margin-top:8px;font-size:11.5px;color:#66666F;display:flex;align-items:center;gap:6px">${icon(ICONS.bolt, 11, "none", "#673DE6")}${e(m.statusText)}…</div>` : "") : (isUser ? e(m.content) : mdToHtml(m.content))}${acoes}</div>
    </div>`;
  }).join("") + `</div>`;
}

const CHAT_ACT = "display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;font-size:11.5px;color:#66666F;cursor:pointer;user-select:none";
function chatAcoesHTML(idx){
  return `<div data-chat-acts style="display:flex;align-items:center;gap:2px;margin-top:8px;padding-top:6px;border-top:1px solid #F1F1F3">
    <span data-chat-copy="${idx}" data-hover title="Copiar o texto da resposta" style="${CHAT_ACT}">${icon(ICONS.copy, 13, "currentColor")}Copiar</span>
    <span data-chat-md="${idx}" data-hover title="Baixar em Markdown" style="${CHAT_ACT}">${icon(ICONS.download, 13, "currentColor")}.md</span>
    <span data-chat-pdf="${idx}" data-hover title="Baixar em PDF" style="${CHAT_ACT}">${icon(ICONS.download, 13, "currentColor")}PDF</span>
  </div>`;
}
function chatMsg(idx){ const ms = state.chat && state.chat.messages; return ms && ms[idx]; }
function chatTituloAtual(){
  const c = state.chat || {};
  const s = (c.sessions || []).find(x => x.id === c.sid);
  return (s && s.title) || "Resposta do ZEUS";
}
function chatNomeArquivo(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const base = chatTituloAtual().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "resposta-zeus";
  return base + "-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
}
function chatActFeedback(el, texto, cor){
  if(!el || el._voltando) return;
  const antes = el.innerHTML;
  el._voltando = true;
  el.innerHTML = icon(cor === "erro" ? ICONS.x : ICONS.check, 13, cor === "erro" ? "#C0341C" : "#0F7A68") + texto;
  setTimeout(() => { el.innerHTML = antes; el._voltando = false; }, 2000);
}
function baixarBlob(blob, nome){
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
}
async function chatCopiar(idx, el){
  const m = chatMsg(idx); if(!m) return;
  const txt = m.content || "";
  try { await navigator.clipboard.writeText(txt); }
  catch(_){
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch(err){}
    ta.remove();
  }
  chatActFeedback(el, "Copiado");
}
function chatBaixarMd(idx, el){
  const m = chatMsg(idx); if(!m) return;
  baixarBlob(new Blob([m.content || ""], { type: "text/markdown;charset=utf-8" }), chatNomeArquivo() + ".md");
  chatActFeedback(el, "Baixado");
}
async function chatBaixarPdf(idx, el){
  const m = chatMsg(idx); if(!m) return;
  const bolha = document.querySelector('[data-chat-bubble="' + idx + '"]');
  if(!bolha) return;
  // Manda pro servidor o que está na tela, sem os anexos nem a própria barra de botões
  const copia = bolha.cloneNode(true);
  copia.querySelectorAll("[data-chat-acts],[data-chat-att]").forEach(x => x.remove());
  const antes = el ? el.innerHTML : null;
  if(el){ el.innerHTML = icon(ICONS.bolt, 13, "none", "#673DE6") + "Gerando…"; el._voltando = true; }
  try {
    const r = await fetch("/api/export/pdf", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ html: copia.innerHTML, title: chatTituloAtual() })
    });
    if(!r.ok) throw new Error(((await r.json().catch(() => ({}))).error) || ("HTTP " + r.status));
    baixarBlob(await r.blob(), chatNomeArquivo() + ".pdf");
    if(el){ el.innerHTML = antes; el._voltando = false; chatActFeedback(el, "Baixado"); }
  } catch(err){
    if(el){ el.innerHTML = antes; el._voltando = false; chatActFeedback(el, "Falhou", "erro"); }
    console.error("[chat] pdf:", err.message);
  }
}
// Delegado no documento: vale pra tela Conversas, pro chat flutuante e pro histórico recarregado
document.addEventListener("click", ev => {
  const alvo = ev.target && ev.target.closest;
  if(!alvo) return;
  const cp = ev.target.closest("[data-chat-copy]");
  if(cp){ ev.stopPropagation(); return chatCopiar(+cp.getAttribute("data-chat-copy"), cp); }
  const md = ev.target.closest("[data-chat-md]");
  if(md){ ev.stopPropagation(); return chatBaixarMd(+md.getAttribute("data-chat-md"), md); }
  const pdf = ev.target.closest("[data-chat-pdf]");
  if(pdf){ ev.stopPropagation(); return chatBaixarPdf(+pdf.getAttribute("data-chat-pdf"), pdf); }
});

  }
}

function chatOverlayClose(){
  chatCloseStream();
  setState({ chatOverlay: false });
}

async function startChatFromHome(text, tag, files){
  tag = tag || {}; files = files || [];
  if(tag.agent){ // @agente: a conversa acontece na tela do agente
    chatCloseStream();
    state.chat = { agentId: tag.agent.id, sessions: [], messages: [], sid: null, streaming: false, _loaded: true };
    setState({ screen: "agente", agentId: tag.agent.id, editAgentId: null });
    if(!text && !files.length){ chatLoadSessions(); return; }
    const sidAg = await chatNewSession();
    if(sidAg) await chatSend(text, files, tag.skill);
    return;
  }
  _homeFxHold = true; homeFxStop(false); // a conversa começou: a animação da home sai de cena
  if(state.chat && state.chat.agentId){ chatCloseStream(); state.chat = { agentId: null, sessions: [], messages: [], sid: null, streaming: false }; }
  const sid = await chatNewSession();
  if(!sid){ _homeFxHold = false; homeFxSync(); return; }
  setState({ screen: "chat", chatOverlay: false });
  _homeFxHold = false;
  await chatSend(text, files, tag.skill);
}

document.addEventListener("click", ()=>{
  cardMenuClose();
  if(state.wsMenuOpen || state.userMenuOpen || state.themeMenuOpen){
    setState({ wsMenuOpen:false, userMenuOpen:false, themeMenuOpen:false });
  }
});

document.addEventListener("keydown", ev=>{
  if(ev.key === "Escape"){ cardMenuClose(); hcManagerClose(); pdiModalClose(); }
  if(ev.key === "Escape" && state.chatOverlay) chatOverlayClose();
});

// ─── Auto-atualização: aba antiga não fica rodando código velho ──────────────
let _buildTag = null;
async function checkBuild(){
  try {
    const r = await fetch("/index.html", { method: "HEAD", cache: "no-store" });
    const tag = r.headers.get("last-modified") || r.headers.get("etag");
    if(!tag) return;
    if(_buildTag === null){ _buildTag = tag; console.log("[central] build " + tag); return; }
    if(tag === _buildTag) return;
    // Versão nova no servidor: só recarrega sozinho se a aba estiver em segundo plano. Com a aba em uso,
    // mostra um aviso e deixa a pessoa escolher a hora (recarregar no meio de um formulário perdia o que estava sendo feito).
    if(document.hidden && !(state.chat && state.chat.streaming)){ location.reload(); return; }
    if(document.getElementById("build-toast")) return;
    const t = document.createElement("div"); t.id = "build-toast";
    t.style.cssText = "position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:12px;padding:11px 14px 11px 16px;border-radius:12px;background:#17171A;color:#FFFFFF;font-size:13px;box-shadow:0 12px 32px rgba(23,23,26,0.28)";
    t.innerHTML = 'A Central foi atualizada. <span data-build-reload style="padding:6px 12px;border-radius:8px;background:#673DE6;color:#FFFFFF;font-weight:700;cursor:pointer">Recarregar agora</span><span data-build-later title="Depois" style="cursor:pointer;opacity:.7;padding:4px 6px">&times;</span>';
    document.body.appendChild(t);
    t.querySelector("[data-build-reload]").addEventListener("click", () => location.reload());
    t.querySelector("[data-build-later]").addEventListener("click", () => { _buildTag = tag; t.remove(); });
  } catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkBuild(); });
window.addEventListener("focus", checkBuild);
setInterval(checkBuild, 120000);
checkBuild();

Object.assign(state, hashPatch());
// Normaliza a URL: tira o # dos links antigos e troca /motorVendas por /motor/vendas
try { if(location.pathname + location.hash !== rotaFor(state.screen)) history.replaceState(null, "", rotaFor(state.screen)); } catch(err){}
// Âncoras decorativas (href="#...") não sujam a URL
document.addEventListener("click", ev => { const a = ev.target && ev.target.closest && ev.target.closest('a[href^="#"]'); if(a) ev.preventDefault(); }, true);
render();
