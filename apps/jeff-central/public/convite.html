<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ZEUS — Convite</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#F6F6F7;color:#17171A;font-family:'DM Sans',system-ui,sans-serif;font-size:14px}
  *{box-sizing:border-box}
  a{color:#673DE6;text-decoration:none}
  input{font:inherit;color:#17171A;background:transparent;border:0;outline:none;width:100%;font-size:13.5px}
  input::placeholder{color:#8A8A93}
  .campo{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #DADADF;border-radius:11px;background:#FFFFFF}
  .campo:focus-within{border-color:#673DE6}
  .rot{font-size:12px;color:#66666F;margin-bottom:7px}
  .cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px;border-radius:11px;background:#673DE6;color:#FFFFFF;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border:0}
  .cta:hover{background:#5429C9}
  .cta[disabled]{opacity:.6;cursor:wait}
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:radial-gradient(760px 520px at 30% 20%, rgba(103,61,230,0.12), transparent 70%)">
  <div style="width:100%;max-width:430px;background:#FFFFFF;border:1px solid #E6E6EA;border-radius:18px;padding:34px 30px;box-shadow:0 20px 50px rgba(23,23,26,0.08)">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:26px">
      <div style="width:30px;height:30px;border-radius:8px;background:linear-gradient(140deg,#673DE6,#5429C9);display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:0.16em">ZEUS</div>
    </div>

    <div id="carregando" style="font-size:13.5px;color:#66666F">Abrindo o convite…</div>

    <div id="erro" style="display:none">
      <h2 style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;margin:0 0 10px">Convite indisponível</h2>
      <p id="erro-txt" style="margin:0 0 22px;font-size:13.5px;color:#66666F;line-height:1.6"></p>
      <a href="/login" class="cta" style="text-decoration:none">Ir para o login</a>
    </div>

    <form id="form" style="display:none;flex-direction:column;gap:16px">
      <div>
        <h2 style="font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600;margin:0 0 8px">Você foi convidado</h2>
        <p id="sub" style="margin:0;font-size:13.5px;color:#66666F;line-height:1.6"></p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid rgba(103,61,230,0.28);border-radius:11px;background:rgba(103,61,230,0.06);font-size:12.5px;color:#5429C9">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 8l9 6 9-6"/></svg>
        <span>Seu login será <strong id="email"></strong></span>
      </div>
      <div>
        <div class="rot">Seu nome</div>
        <div class="campo"><input id="nome" name="name" autocomplete="name" required maxlength="120"></div>
      </div>
      <div>
        <div class="rot">Crie uma senha</div>
        <div class="campo"><input id="senha" type="password" name="password" autocomplete="new-password" minlength="8" required placeholder="mínimo 8 caracteres"></div>
      </div>
      <div>
        <div class="rot">Repita a senha</div>
        <div class="campo"><input id="senha2" type="password" autocomplete="new-password" minlength="8" required></div>
      </div>
      <div id="form-erro" style="display:none;padding:11px 14px;border:1px solid rgba(192,52,28,0.3);border-radius:11px;background:rgba(192,52,28,0.07);font-size:12.5px;color:#C0341C"></div>
      <button id="btn" type="submit" class="cta">Entrar no ZEUS
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </button>
      <div id="validade" style="font-size:11.5px;color:#9A9AA3;text-align:center"></div>
    </form>
  </div>
</div>
<script>
(function(){
  var token = location.pathname.split("/").pop();
  var $ = function(id){ return document.getElementById(id); };
  var ERROS = {
    expirado: "Este link de convite expirou. Peça um novo link ao administrador da sua empresa.",
    inativo: "Seu acesso está desativado. Fale com um administrador da sua empresa.",
    invalido: "Este link de convite não é válido ou já foi usado. Se você já criou sua senha, entre pelo login."
  };
  function falha(cod){ $("carregando").style.display = "none"; $("form").style.display = "none"; $("erro").style.display = "block"; $("erro-txt").textContent = ERROS[cod] || ERROS.invalido; }

  fetch("/api/convite/" + encodeURIComponent(token)).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); }).then(function(x){
    if(!x.ok) return falha(x.j && x.j.error);
    var d = x.j;
    $("carregando").style.display = "none";
    $("form").style.display = "flex";
    $("sub").textContent = (d.convidadoPor ? d.convidadoPor + " convidou você" : "Você foi convidado") + " para a central de " + d.empresa + " como " + d.papel + ". Crie sua senha para entrar.";
    $("email").textContent = d.email;
    $("nome").value = d.nome || "";
    if(d.expira) $("validade").textContent = "Convite válido até " + new Date(d.expira).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + ".";
    $("senha").focus();
  }).catch(function(){ falha("invalido"); });

  $("form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var erro = $("form-erro");
    erro.style.display = "none";
    if($("senha").value.length < 8){ erro.textContent = "A senha precisa ter pelo menos 8 caracteres."; erro.style.display = "block"; return; }
    if($("senha").value !== $("senha2").value){ erro.textContent = "As senhas não conferem."; erro.style.display = "block"; return; }
    $("btn").disabled = true;
    fetch("/api/convite/" + encodeURIComponent(token), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: $("nome").value, password: $("senha").value }) })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(x){
        if(x.ok){ location.href = x.j.redirect || "/"; return; }
        $("btn").disabled = false; erro.textContent = (x.j && x.j.error) || "Não foi possível concluir. Tente de novo."; erro.style.display = "block";
      })
      .catch(function(){ $("btn").disabled = false; erro.textContent = "Sem conexão. Tente de novo."; erro.style.display = "block"; });
  });
})();
</script>
</body>
</html>
