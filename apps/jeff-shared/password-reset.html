<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redefinir senha · __APP_NAME__</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:#0b0d10;color:#e8eaed;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .card{width:100%;max-width:400px;background:#14171c;border:1px solid #242932;border-radius:14px;padding:28px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#8b93a1;font-size:13px;margin:0 0 22px}
  label{display:block;font-size:13px;color:#aab2bf;margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border-radius:9px;border:1px solid #2a303a;background:#0e1115;color:#e8eaed;font-size:15px}
  input:focus{outline:none;border-color:#C4FF0E}
  #code{letter-spacing:8px;text-align:center;font-size:22px;font-weight:600}
  button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#C4FF0E;color:#0b0d10;
    font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.55;cursor:wait}
  .msg{margin-top:14px;font-size:13px;min-height:18px}
  .msg.err{color:#ff6b6b}.msg.ok{color:#C4FF0E}
  .back{display:block;text-align:center;margin-top:18px;color:#8b93a1;font-size:13px;text-decoration:none}
  .back:hover{color:#e8eaed}
  .hint{font-size:13px;color:#8b93a1;background:#0e1115;border:1px solid #242932;border-radius:9px;padding:10px 12px;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <h1>Redefinir senha</h1>
  <p class="sub">__APP_NAME__</p>

  <form id="step1">
    <div id="identWrap" hidden>
      <label for="identifier">__IDENT_LABEL__</label>
      <input id="identifier" type="text" autocomplete="username">
    </div>
    <p class="hint">Vou enviar um código de 6 dígitos pelo WhatsApp do administrador. Ele vale por 10 minutos.</p>
    <button type="submit">Enviar código</button>
  </form>

  <form id="step2" hidden>
    <label for="code">Código recebido no WhatsApp</label>
    <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
    <label for="pass1">Senha nova (mínimo __MIN_PASSWORD__ caracteres)</label>
    <input id="pass1" type="password" autocomplete="new-password" minlength="__MIN_PASSWORD__" required>
    <label for="pass2">Repita a senha nova</label>
    <input id="pass2" type="password" autocomplete="new-password" minlength="__MIN_PASSWORD__" required>
    <button type="submit">Salvar senha nova</button>
  </form>

  <div id="msg" class="msg"></div>
  <a class="back" href="__LOGIN_PATH__">← Voltar pro login</a>
</div>
<script>
(function(){
  var needsIdent = '__NEEDS_IDENT__' === '1';
  var $ = function(id){ return document.getElementById(id); };
  var msg = $('msg');
  if (needsIdent) { $('identWrap').hidden = false; $('identifier').required = true; }

  function show(text, ok){ msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }
  function post(url, data){
    return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok:r.ok, body:j }; }); });
  }
  function busy(form, on){ form.querySelector('button').disabled = on; }

  $('step1').addEventListener('submit', function(e){
    e.preventDefault(); show('', true); busy(this, true);
    var form = this;
    post('/api/password-reset/request', { identifier: $('identifier').value }).then(function(r){
      busy(form, false);
      if (!r.ok) return show(r.body.error || 'Erro ao pedir o código.', false);
      form.hidden = true; $('step2').hidden = false; $('code').focus();
      show('Código enviado. Confira o WhatsApp.', true);
    }).catch(function(){ busy(form, false); show('Falha de conexão.', false); });
  });

  $('step2').addEventListener('submit', function(e){
    e.preventDefault();
    if ($('pass1').value !== $('pass2').value) return show('As senhas não conferem.', false);
    show('', true); busy(this, true);
    var form = this;
    post('/api/password-reset/confirm', { code: $('code').value, newPassword: $('pass1').value }).then(function(r){
      busy(form, false);
      if (!r.ok) return show(r.body.error || 'Erro ao redefinir.', false);
      form.hidden = true;
      show('Senha redefinida. Redirecionando pro login...', true);
      setTimeout(function(){ location.href = '__LOGIN_PATH__'; }, 1800);
    }).catch(function(){ busy(form, false); show('Falha de conexão.', false); });
  });
})();
</script>
</body>
</html>
