<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Farias Souza — Governança, Estratégia e Legado">
    <title>Farias Souza</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #060c1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 48px 0;
            font-family: 'Georgia', serif;
        }

        .cards {
            width: 100%;
            max-width: 480px;
            padding: 24px 20px 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            display: block;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(0,100,255,0.25);
        }

        .card:active {
            transform: translateY(0);
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="cards">
        <a class="card" href="https://pfcc.boardbr.com/pfcc-nova/?src=Org_Instagram&utm_source=Org&utm_medium=Instagram&utm_content=bio-farias&utm_term=perpetuo&utm_campaign=pfcc-page#form" target="_blank" rel="noopener">
            <img src="images/conselheiros-banner.webp" alt="Formação de Conselheiros Empresariais" loading="lazy">
        </a>
        <a class="card" href="https://forms.fariassouza.com.br" target="_blank" rel="noopener">
            <img src="images/o-proximo-ciclo.webp" alt="O Próximo Ciclo" loading="lazy">
        </a>
        <a class="card" href="#LINK_PALESTRAS" target="_blank" rel="noopener">
            <img src="images/palestras.webp" alt="Palestras" loading="lazy">
        </a>
        <a class="card" href="#LINK_OFERTA" target="_blank" rel="noopener">
            <img src="images/oferta-especial.webp" alt="Oferta Especial" loading="lazy">
        </a>
    </div>

</body>
</html>
