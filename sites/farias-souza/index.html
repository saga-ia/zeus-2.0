    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { width: 100%; }

        body {
            background: radial-gradient(ellipse at 70% -10%, #142046 0%, #080e20 45%, #04070f 100%);
            min-height: 100vh;
            color: #f4f1ea;
            font-family: 'Helvetica Neue', Arial, system-ui, sans-serif;
            padding-bottom: 56px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Hero: mobile stacked, desktop full-bleed split */
        .hero {
            position: relative;
            width: 100%;
            padding-top: 24px;
        }

        .hero-photo {
            width: 100%;
            aspect-ratio: 4/3;
            background-image: url('images/farias-photo.webp');
            background-size: cover;
            background-position: center 20%;
            border-radius: 18px;
            box-shadow: 0 22px 60px rgba(0,0,0,0.55);
        }

        .brand {
            padding: 28px 4px 0 4px;
        }

        .brand-name {
            font-family: 'Times New Roman', Georgia, serif;
            font-weight: 700;
            font-size: 52px;
            line-height: 0.9;
            letter-spacing: -0.5px;
            color: #f4f1ea;
        }

        .brand-name span {
            display: block;
            color: #c9a84c;
        }

        .brand-tagline {
            margin-top: 14px;
            font-size: 14px;
            line-height: 1.5;
            color: rgba(244, 241, 234, 0.7);
            letter-spacing: 0.2px;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .socials {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .socials a {
            color: rgba(244, 241, 234, 0.55);
            transition: color 0.18s ease, transform 0.18s ease;
            display: flex;
            align-items: center;
        }

        .socials a:hover {
            color: #f4f1ea;
            transform: translateY(-2px);
        }

        .socials svg { width: 20px; height: 20px; }

        .site-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid rgba(244, 241, 234, 0.35);
            border-radius: 999px;
            color: #f4f1ea;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        .site-btn:hover {
            background: rgba(244, 241, 234, 0.08);
            border-color: rgba(244, 241, 234, 0.7);
        }

        .site-btn svg { width: 12px; height: 12px; }

        .section-label {
            margin: 44px 0 20px 0;
            text-align: center;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(244, 241, 234, 0.6);
        }

        .cards {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .card-wrapper {
            position: relative;
            border-radius: 14px;
        }

        .card-wrapper::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 20px;
            background: var(--glow);
            filter: blur(26px);
            opacity: 0.55;
            z-index: 0;
        }

        .card {
            display: block;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.18s ease;
            position: relative;
            z-index: 1;
        }

        .card:hover { transform: translateY(-3px); }
        .card:active { transform: translateY(0); }

        .card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Desktop split hero — foto full-bleed lateral direita */
        @media (min-width: 820px) {
            body { padding-bottom: 80px; }

            .container {
                max-width: none;
                padding: 0;
            }

            .hero {
                display: grid;
                grid-template-columns: 1fr 1fr;
                min-height: 82vh;
                align-items: stretch;
                padding-top: 0;
                position: relative;
            }

            .hero-photo {
                aspect-ratio: auto;
                border-radius: 0;
                box-shadow: none;
                height: 100%;
                width: 100%;
                background-position: center 25%;
                order: 2;
                position: relative;
            }

            .hero-photo::after {
                content: '';
                position: absolute;
                inset: 0;
                background: linear-gradient(90deg, rgba(4,7,15,0.55) 0%, rgba(4,7,15,0.0) 22%, rgba(4,7,15,0) 100%);
            }

            .brand {
                order: 1;
                padding: 72px 60px 40px 88px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .brand-name { font-size: clamp(96px, 11vw, 156px); letter-spacing: -2.5px; }

            .brand-tagline { font-size: clamp(18px, 1.8vw, 26px); margin-top: 26px; max-width: 560px; letter-spacing: 0.4px; }

            .top-row { margin-top: 48px; gap: 28px; }

            .socials { gap: 28px; }

            .socials svg { width: 34px; height: 34px; }

            .site-btn { padding: 16px 30px; font-size: 15px; letter-spacing: 1.4px; }

            .site-btn svg { width: 14px; height: 14px; }

            .section-label { max-width: 560px; margin-left: auto; margin-right: auto; margin-top: 64px; }

            .cards {
                max-width: 560px;
                margin: 0 auto;
                padding: 0 20px;
            }
        }
    </style>
