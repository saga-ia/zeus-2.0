map $host $subdomain {
  default                                            "_default";
  "~^(?<sub>[^.]+)\.propostaebcmkt2026\.shop$"       $sub;
  "~^(?<sub>[^.]+)\.jefersonhenrike\.com$"           $sub;
  "bio.fariassouza.com.br"                           "farias-souza";
  "~^(?<sub>[^.]+)\.fariassouza\.com\.br$"           $sub;
}

server {
  listen 80 default_server;
  server_name _;

  root /sites/$subdomain;
  index index.html;

  # Editor da planilha do Board Summit (só nesse subdomínio)
  location /api/board-editor/ {
    if ($subdomain != "boardsummit2026planilha") { return 404; }
    proxy_pass http://172.18.0.1:3095/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # serve estático com fallback simples
  location / {
    try_files $uri $uri/ /index.html =404;
  }

  # gzip leve
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # cache pra assets estáticos
  location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
