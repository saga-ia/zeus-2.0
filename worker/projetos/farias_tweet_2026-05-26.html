<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGA Post — Farias Souza</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .card {
      width: 1080px;
      height: 1080px;
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 70px 80px 60px 80px;
      overflow: hidden;
    }

    /* ---- TOPO ---- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .profile-area {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* Foto circular com borda animada tipo stories */
    .avatar-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045, #405de6, #5851db);
      background-size: 300% 300%;
      animation: gradientSpin 3s ease infinite;
      flex-shrink: 0;
    }

    @keyframes gradientSpin {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffffff;
      padding: 2px;
      overflow: hidden;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #c8cdd4;
      display: block;
    }

    /* Placeholder cinza quando não há foto */
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #c8cdd4, #a8b0ba);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profile-name {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: #0f1419;
      letter-spacing: -0.3px;
    }

    /* Checkmark verificado */
    .verified-badge {
      width: 22px;
      height: 22px;
      background: #0f1419;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .verified-badge svg {
      width: 13px;
      height: 13px;
    }

    .profile-handle {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 18px;
      color: #6b7280;
      letter-spacing: -0.2px;
    }

    /* OGA label */
    .oga-label {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 18px;
      color: #9ca3af;
      letter-spacing: 0.5px;
    }

    /* ---- CONTEÚDO CENTRAL ---- */
    .content-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 0 20px 0;
    }

    .main-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      font-size: 82px;
      line-height: 1.15;
      color: #0f1419;
      letter-spacing: -2.5px;
      max-width: 100%;
    }

    .main-text strong {
      font-weight: 800;
      color: #0f1419;
    }

    /* ---- RODAPÉ — ícones de engajamento ---- */
    .footer {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 48px;
      padding-top: 20px;
      border-top: 1.5px solid #f3f4f6;
    }

    .engagement-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #9ca3af;
    }

    .engagement-item svg {
      width: 28px;
      height: 28px;
      stroke: #9ca3af;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .engagement-count {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 18px;
      color: #9ca3af;
    }

    .engagement-spacer {
      flex: 1;
    }
  </style>
</head>
