<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story 3</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:#fff;color:#000;font-family:'DM Sans',sans-serif;overflow:hidden}
  .frame{position:relative;width:1080px;height:1920px;padding:120px 80px 140px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .selo{display:flex;align-items:center;gap:22px}
  .selo img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #000}
  .selo .nome{font-family:'DM Sans',sans-serif;font-weight:700;font-size:34px;line-height:1.1;color:#000}
  .selo .arroba{font-size:26px;color:#6a6a6a;font-weight:500;margin-top:4px}
  .barra{height:8px;width:160px;background:#FF0000;margin-bottom:28px}
  .titulo{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:120px;line-height:1.15;color:#000;max-width:920px;letter-spacing:-1px}
  .titulo .red{color:#FF0000}
  .apoio{font-family:'DM Sans',sans-serif;font-weight:500;font-size:38px;line-height:1.35;color:#2a2a2a;max-width:860px;margin-top:48px}
  .apoio strong{color:#000;font-weight:700}
  .cta{margin-top:56px;background:#000;color:#fff;border-radius:22px;padding:42px 44px;max-width:920px;display:flex;align-items:center;gap:28px}
  .cta .emoji{font-family:'Anton',sans-serif;font-size:72px;color:#FF0000;line-height:1}
  .cta .msg{font-family:'DM Sans',sans-serif;font-size:36px;font-weight:700;line-height:1.25}
  .cta .msg span{color:#FF0000}
  .rod{display:flex;justify-content:space-between;align-items:center;font-family:'DM Sans',sans-serif;font-size:26px;color:#8a8a8a;letter-spacing:2px;text-transform:uppercase}
  .pag{font-family:'Anton',sans-serif;font-size:42px;color:#FF0000}
</style>
</head>
<body>
<div class="frame">
  <div class="selo">
    <img src="file:///opt/jeff-worker/projetos/clientes/jeffhenrike/avatar-escuro.png" alt="Jeff">
    <div>
      <div class="nome">Jefferson Henrike</div>
      <div class="arroba">@jeffhenrike</div>
    </div>
  </div>
  <div>
    <div class="barra"></div>
    <div class="titulo">Enquanto todo mundo <span class="red">automatiza</span>,</div>
    <div class="apoio">o próximo ciclo pertence a quem usa a IA pra <strong>aparecer mais, não menos</strong>. Rosto, tese e consistência. Esse é o novo jogo.</div>
    <div class="cta">
      <div class="emoji">→</div>
      <div class="msg">Me chama na DM com a palavra <span>FUTURO</span> e eu te mostro como.</div>
    </div>
  </div>
  <div class="rod">
    <span class="pag">03 / 03</span>
    <span>Fim</span>
  </div>
</div>
</body>
</html>
