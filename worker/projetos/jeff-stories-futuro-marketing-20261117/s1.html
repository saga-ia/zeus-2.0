<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story 1</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:#000;color:#fff;font-family:'DM Sans',sans-serif;overflow:hidden}
  .frame{position:relative;width:1080px;height:1920px;padding:120px 80px 140px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .selo{display:flex;align-items:center;gap:22px}
  .selo img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #fff}
  .selo .nome{font-family:'DM Sans',sans-serif;font-weight:700;font-size:34px;line-height:1.1}
  .selo .arroba{font-size:26px;color:#9a9a9a;font-weight:500;margin-top:4px}
  .hook{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:-1px;font-size:150px;line-height:1.15;color:#fff;max-width:920px}
  .hook .red{color:#FF0000}
  .apoio{font-family:'DM Sans',sans-serif;font-weight:500;font-size:34px;line-height:1.35;color:#c9c9c9;max-width:820px;margin-top:52px}
  .apoio strong{color:#fff;font-weight:700}
  .rod{display:flex;justify-content:space-between;align-items:center;font-family:'DM Sans',sans-serif;font-size:26px;color:#8a8a8a;letter-spacing:2px;text-transform:uppercase}
  .rod .seta{color:#FF0000;font-weight:700}
  .pag{font-family:'Anton',sans-serif;font-size:42px;color:#FF0000}
</style>
</head>
<body>
<div class="frame">
  <div class="selo">
    <img src="file:///opt/jeff-worker/projetos/clientes/jeffhenrike/avatar-escuro.png" alt="Jeff">
    <div>
      <div class="nome">Jefferson Henrike</div>
      <div class="arroba">@jeffhenrike</div>
    </div>
  </div>
  <div>
    <div class="hook">O futuro do marketing <span class="red">NÃO</span> é IA.</div>
    <div class="apoio">É <strong>confiança em escala</strong>. Quem só automatiza, some. Quem usa IA pra ser mais humano, domina.</div>
  </div>
  <div class="rod">
    <span class="pag">01 / 03</span>
    <span>Arrasta <span class="seta">→</span></span>
  </div>
</div>
</body>
</html>
