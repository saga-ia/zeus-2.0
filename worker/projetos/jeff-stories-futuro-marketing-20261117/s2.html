<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story 2</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:#FF0000;color:#fff;font-family:'DM Sans',sans-serif;overflow:hidden}
  .frame{position:relative;width:1080px;height:1920px;padding:120px 80px 140px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .selo{display:flex;align-items:center;gap:22px}
  .selo img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #fff}
  .selo .nome{font-family:'DM Sans',sans-serif;font-weight:700;font-size:34px;line-height:1.1;color:#fff}
  .selo .arroba{font-size:26px;color:#ffd9d9;font-weight:500;margin-top:4px}
  .label{font-family:'DM Sans',sans-serif;font-weight:700;letter-spacing:4px;font-size:30px;color:#000;text-transform:uppercase;margin-bottom:28px}
  .frase{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:168px;line-height:1.08;color:#fff;max-width:920px;letter-spacing:-1px}
  .caixa-preta{display:inline-block;background:#000;color:#fff;padding:0 32px;margin-top:22px}
  .apoio{font-family:'DM Sans',sans-serif;font-weight:500;font-size:44px;line-height:1.35;color:#fff;max-width:860px;margin-top:64px}
  .apoio strong{font-weight:700;color:#000}
  .rod{display:flex;justify-content:space-between;align-items:center;font-family:'DM Sans',sans-serif;font-size:26px;color:#ffd9d9;letter-spacing:2px;text-transform:uppercase}
  .rod .seta{color:#fff;font-weight:700}
  .pag{font-family:'Anton',sans-serif;font-size:42px;color:#fff}
</style>
</head>
<body>
<div class="frame">
  <div class="selo">
    <img src="file:///opt/jeff-worker/projetos/clientes/jeffhenrike/avatar-escuro.png" alt="Jeff">
    <div>
      <div class="nome">Jefferson Henrike</div>
      <div class="arroba">@jeffhenrike</div>
    </div>
  </div>
  <div>
    <div class="label">O novo jogo</div>
    <div class="frase">Atenção virou commodity.</div>
    <div class="frase" style="margin-top:28px;"><span class="caixa-preta">Confiança</span> é o ativo caro.</div>
    <div class="apoio">Quem só <strong>automatiza</strong>, some. Quem usa IA pra ser mais humano, domina.</div>
  </div>
  <div class="rod">
    <span class="pag">02 / 03</span>
    <span>Arrasta <span class="seta">→</span></span>
  </div>
</div>
</body>
</html>
