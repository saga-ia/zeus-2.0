# /etc/nginx/sites-available/agente.imersaoparadigma.com.br.conf
# Managed by whatsapp-worker deployment. TLS block is left as certbot produced it.

# ---- Rate-limit zones (declared in http {} context — if not already there, include via snippet) ----
# This site expects the following map/zones to exist (in /etc/nginx/conf.d/whatsapp-worker-limits.conf or similar):
#   limit_req_zone $binary_remote_addr zone=ww_api:10m rate=20r/s;
#   limit_req_zone $binary_remote_addr zone=ww_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name agente.imersaoparadigma.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agente.imersaoparadigma.com.br;

    ssl_certificate     /etc/letsencrypt/live/agente.imersaoparadigma.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agente.imersaoparadigma.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 32m;

    # Rate limit login endpoint (comment out if zones not declared)
    location = /auth/login {
        # limit_req zone=ww_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else -> Node worker
    location / {
        # limit_req zone=ww_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
