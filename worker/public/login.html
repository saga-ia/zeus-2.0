<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Saga — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: {
                50:  '#FFFFFF',
                100: '#FFFFFF',
                200: '#EEF2F7',
                300: '#C9D2E0',
                400: '#717680',
                500: '#6A7282',
                600: '#3A3A3A',
                700: '#313131',
                800: '#1A1A1A',
                900: '#161616',
                950: '#0A0A0A',
              },
              emerald: {
                200: '#C4FF0E',
                300: '#C4FF0E',
                400: '#C4FF0E',
                500: '#C4FF0E',
                600: '#A3FF33',
                700: '#A3FF33',
                800: '#1F3A0D',
                900: '#1F3A0D',
                950: '#0A1804',
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      body { background: radial-gradient(circle at 20% 0%, #1A1A1A 0%, #0A0A0A 60%); }
    </style>
  </head>
  <body class="min-h-screen text-slate-100 flex items-center justify-center p-6">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-emerald-400" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.52 3.449A11.892 11.892 0 0 0 12.05 0C5.495 0 .159 5.335.156 11.892a11.87 11.87 0 0 0 1.594 5.945L0 24l6.3-1.652a11.88 11.88 0 0 0 5.746 1.463h.005c6.554 0 11.89-5.335 11.893-11.892a11.82 11.82 0 0 0-3.424-8.47zm-8.47 18.3h-.004a9.87 9.87 0 0 1-5.031-1.378l-.36-.214-3.741.98 1-3.645-.235-.374a9.86 9.86 0 0 1-1.51-5.226c.001-5.45 4.436-9.884 9.888-9.884a9.82 9.82 0 0 1 6.988 2.9 9.82 9.82 0 0 1 2.892 6.995c-.002 5.45-4.436 9.846-9.887 9.846zm5.422-7.403c-.297-.149-1.758-.867-2.03-.966-.272-.1-.47-.149-.668.148-.198.298-.767.966-.941 1.164-.173.198-.347.223-.644.074-.297-.148-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.652-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.297-.496.1-.198.05-.372-.025-.52-.074-.149-.668-1.611-.916-2.207-.241-.58-.487-.5-.668-.51-.173-.008-.371-.01-.569-.01-.198 0-.52.074-.792.372-.273.297-1.04 1.016-1.04 2.478s1.065 2.875 1.213 3.073c.149.198 2.097 3.2 5.077 4.487.71.306 1.264.489 1.696.625.713.227 1.362.195 1.875.118.572-.085 1.758-.719 2.006-1.413.248-.694.248-1.29.173-1.414-.074-.124-.272-.198-.57-.347z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-semibold">Sistema Saga</h1>
        <p class="text-slate-400 mt-1 text-sm">Autentique-se para acessar o painel</p>
      </div>

      <div class="bg-slate-900/60 backdrop-blur border border-slate-700/60 rounded-2xl p-6 shadow-2xl">
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-sm text-slate-300 mb-1.5" for="username">Usuário</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              class="w-full px-3 py-2.5 rounded-lg bg-slate-800 border border-slate-700 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/40 outline-none transition"
            />
          </div>
          <div>
            <label class="block text-sm text-slate-300 mb-1.5" for="password">Senha</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="w-full px-3 py-2.5 rounded-lg bg-slate-800 border border-slate-700 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/40 outline-none transition"
            />
          </div>
          <div id="errorBox" class="hidden text-sm text-red-300 bg-red-900/40 border border-red-800 rounded-lg px-3 py-2"></div>
          <button
            type="submit"
            id="submitBtn"
            class="w-full bg-emerald-500 hover:bg-emerald-400 disabled:bg-emerald-800 disabled:cursor-not-allowed text-slate-950 font-semibold py-2.5 rounded-lg transition"
          >Entrar</button>
          <button
            type="button"
            id="openChangePw"
            class="w-full text-xs text-slate-400 hover:text-emerald-400 transition mt-1"
          >Alterar senha</button>
        </form>
      </div>
      <p class="text-center text-xs text-slate-500 mt-6">sagazeus.jefersonhenrike.com</p>
    </div>

    <div id="changePwModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-6 z-50">
      <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-2xl">
        <h2 class="text-lg font-semibold mb-4">Alterar senha</h2>
        <form id="changePwForm" class="space-y-4">
          <div>
            <label class="block text-sm text-slate-300 mb-1.5" for="cp_username">Usuário</label>
            <input id="cp_username" name="username" type="text" required autocomplete="username"
              class="w-full px-3 py-2.5 rounded-lg bg-slate-800 border border-slate-700 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/40 outline-none transition" />
          </div>
          <div>
            <label class="block text-sm text-slate-300 mb-1.5" for="cp_current">Senha atual</label>
            <input id="cp_current" name="currentPassword" type="password" required autocomplete="current-password"
              class="w-full px-3 py-2.5 rounded-lg bg-slate-800 border border-slate-700 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/40 outline-none transition" />
          </div>
          <div>
            <label class="block text-sm text-slate-300 mb-1.5" for="cp_new">Nova senha (mínimo 8 caracteres)</label>
            <input id="cp_new" name="newPassword" type="password" required minlength="8" autocomplete="new-password"
              class="w-full px-3 py-2.5 rounded-lg bg-slate-800 border border-slate-700 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/40 outline-none transition" />
          </div>
          <div id="cpErrorBox" class="hidden text-sm text-red-300 bg-red-900/40 border border-red-800 rounded-lg px-3 py-2"></div>
          <div id="cpOkBox" class="hidden text-sm text-emerald-300 bg-emerald-900/40 border border-emerald-800 rounded-lg px-3 py-2">Senha alterada. Já pode entrar com a nova.</div>
          <div class="flex gap-3">
            <button type="button" id="closeChangePw"
              class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-100 font-semibold py-2.5 rounded-lg transition">Cancelar</button>
            <button type="submit" id="cpSubmitBtn"
              class="flex-1 bg-emerald-500 hover:bg-emerald-400 disabled:bg-emerald-800 disabled:cursor-not-allowed text-slate-950 font-semibold py-2.5 rounded-lg transition">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/public/js/login.js"></script>
  </body>
</html>
